<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Loja</title>

  <!-- =====================================================
       FONTE CINZEL
       ===================================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <!-- =====================================================
       TAILWIND
       ===================================================== -->

  <link
    href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    rel="stylesheet"
  >


  <!-- =====================================================
       ESTILOS
       ===================================================== -->

  <style>

    * {
      box-sizing: border-box;
    }


    body {
      background: #000;
      color: #fff;
      min-height: 100vh;

      font-family: "Cinzel", serif;
    }


    /* =====================================================
       CARD DO PRODUTO
       ===================================================== */

    .produto {

      background:
        linear-gradient(
          145deg,
          #3a2608,
          #1c1204 55%,
          #4a310b
        );

      border: 1px solid #b8862c;

      box-shadow:
        0 0 0 1px rgba(255, 215, 100, 0.08),
        0 15px 40px rgba(0, 0, 0, 0.65),
        inset 0 0 35px rgba(184, 134, 46, 0.08);

      transition: 0.25s ease;
    }


    .produto:hover {

      transform: translateY(-4px);

      border-color: #d4af37;

      box-shadow:
        0 0 25px rgba(212, 175, 55, 0.18),
        0 20px 45px rgba(0, 0, 0, 0.7),
        inset 0 0 40px rgba(212, 175, 55, 0.08);
    }


    /* =====================================================
       BOTÃO COMPRAR
       ===================================================== */

    .botao-comprar {

      background: #0a0702;

      color: #d4af37;

      border: 1px solid #b8862c;

      transition: 0.2s ease;

      font-family: "Cinzel", serif;
    }


    .botao-comprar:hover {

      background: #211604;

      color: #f1d27a;

      border-color: #d4af37;

      box-shadow:
        0 0 15px rgba(212, 175, 55, 0.2);
    }


    .botao-comprar:disabled {

      opacity: 0.5;

      cursor: not-allowed;
    }


    /* =====================================================
       MENSAGEM
       ===================================================== */

    #mensagem {

      display: none;

      position: fixed;

      top: 20px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 10000;

      background: #18130a;

      color: #f1d27a;

      border: 1px solid #b8862c;

      border-radius: 8px;

      padding: 14px 20px;

      min-width: 280px;

      max-width: 90%;

      text-align: center;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, .5),
        0 0 20px rgba(212, 175, 55, 0.1);

      font-family: "Cinzel", serif;
    }


    /* =====================================================
       TÍTULO
       ===================================================== */

    #titulo-principal {

      color: #d4af37;

      text-shadow:
        0 0 15px rgba(212, 175, 55, 0.15);
    }


    /* =====================================================
       PREÇO
       ===================================================== */

    #produto-preco {

      color: #d4af37;

      text-shadow:
        0 0 10px rgba(212, 175, 55, 0.15);
    }


    /* =====================================================
       AUTOR
       ===================================================== */

    #produto-autor {

      color: #e1c36a;
    }


    /* =====================================================
       IMAGEM
       ===================================================== */

    #imagem-produto {

      border: 1px solid rgba(212, 175, 55, 0.35);

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.6);
    }

  </style>

</head>


<body class="bg-black text-white p-6 md:p-10">


  <!-- =====================================================
       MENSAGEM
       ===================================================== -->

  <div id="mensagem"></div>


  <!-- =====================================================
       CONTEÚDO PRINCIPAL
       ===================================================== -->

  <main class="w-full max-w-5xl mx-auto">


    <!-- ===================================================
         TÍTULO
         =================================================== -->

    <header class="text-center mb-10">

      <h1
        id="titulo-principal"
        class="text-4xl md:text-5xl font-bold mb-3"
      >
        Loja
      </h1>


      <p
        id="subtitulo"
        class="text-gray-400"
      >
        Vamos acessar Triohnte? Compre!
      </p>

    </header>


    <!-- ===================================================
         PRODUTO
         =================================================== -->

    <section
      class="grid grid-cols-1 gap-8 max-w-4xl mx-auto"
    >


      <article
        class="produto p-6 md:p-8 rounded-xl text-center"
      >


        <!-- ===============================================
             CAPA DO LIVRO
             =============================================== -->

        <div
          class="flex justify-center items-center mb-6"
          style="min-height:220px;"
        >

          <img
            id="imagem-produto"
            src="Capa.png"
            alt="Triohnte"
            class="max-w-xs w-full rounded-lg object-cover"
            onerror="this.style.display='none';"
          >

        </div>


        <!-- ===============================================
             NOME DO PRODUTO
             =============================================== -->

        <h2
          id="produto-titulo"
          class="text-2xl font-bold mb-2"
        >
          Triohnte
        </h2>


        <!-- ===============================================
             TIPO
             =============================================== -->

        <p
          id="produto-tipo"
          class="text-sm text-gray-400 mb-4"
        >
          Primeiro Volume
        </p>


        <!-- ===============================================
             DESCRIÇÃO
             =============================================== -->

        <p
          id="produto-descricao"
          class="text-sm text-gray-300 mb-4"
        >
          Download desabilitado pela proteção de dados.
        </p>


        <!-- ===============================================
             PREÇO
             =============================================== -->

        <p
          id="produto-preco"
          class="text-2xl font-bold mb-3"
        >
          Preço: R$ 6,99
        </p>


        <!-- ===============================================
             AUTOR
             =============================================== -->

        <p
          id="produto-autor"
          class="text-lg mb-6"
        >
          Gabryell Aweryan.
        </p>


        <!-- ===============================================
             BOTÃO
             =============================================== -->

        <button
          id="botao-comprar"
          type="button"
          class="botao-comprar px-10 py-3 rounded-full font-bold"
        >
          Comprar
        </button>


      </article>

    </section>


  </main>



  <!-- =====================================================
       FIREBASE
       ===================================================== -->

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>



  <script>

    /* =====================================================
       CONFIGURAÇÃO FIREBASE
       ===================================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyAajz5PVa79vH1FSWrC0pPrGxs0Q-9xkFk",

      authDomain:
        "triohnte-database.firebaseapp.com",

      databaseURL:
        "https://triohnte-database-default-rtdb.europe-west1.firebasedatabase.app",

      projectId:
        "triohnte-database",

      appId:
        "1:127473963183:web:c071072d846a8d7240045a"

    };


    /* =====================================================
       INICIALIZA FIREBASE
       ===================================================== */

    if (!firebase.apps.length) {

      firebase.initializeApp(firebaseConfig);

    }


    /* =====================================================
       SERVIÇOS
       ===================================================== */

    const auth =
      firebase.auth();


    const database =
      firebase.database();



    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const botaoComprar =
      document.getElementById("botao-comprar");


    const mensagem =
      document.getElementById("mensagem");



    /* =====================================================
       USUÁRIO ATUAL
       ===================================================== */

    let usuarioAtual = null;



    /* =====================================================
       EXIBIR MENSAGEM
       ===================================================== */

    function mostrarMensagem(texto) {

      mensagem.textContent =
        texto;


      mensagem.style.display =
        "block";


      setTimeout(
        function() {

          mensagem.style.display =
            "none";

        },
        3500
      );

    }



    /* =====================================================
       FIREBASE AUTH
       ===================================================== */

    auth.onAuthStateChanged(
      function(user) {

        usuarioAtual = user;


        console.log(
          "Estado de autenticação:",
          user
            ? "LOGADO"
            : "NÃO LOGADO"
        );


        if (user) {

          console.log(
            "UID:",
            user.uid
          );


          console.log(
            "E-mail:",
            user.email
          );

        }

      }
    );



    /* =====================================================
       COMPRAR
       ===================================================== */

    botaoComprar.addEventListener(
      "click",
      function() {


        /* -----------------------------------------------
           VERIFICA LOGIN
           ----------------------------------------------- */

        if (!usuarioAtual) {

          mostrarMensagem(
            "Faça login para comprar."
          );

          return;

        }


        /* -----------------------------------------------
           DESABILITA BOTÃO
           ----------------------------------------------- */

        botaoComprar.disabled =
          true;


        botaoComprar.textContent =
          "Encaminhando para compra...";


        /* -----------------------------------------------
           REDIRECIONAMENTO
           ----------------------------------------------- */

        window.location.href =
          "compras.html?produto=segredarios";

      }
    );

  </script>


</body>

</html>
