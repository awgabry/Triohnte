  <script>

    /* =====================================================
       MESMO FIREBASE DO INDEX.HTML
       ===================================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyAajz5PVa79vH1FSWrC0pPrGxs0Q-9xkFk",

      authDomain:
        "triohnte-database.firebaseapp.com",

      databaseURL:
        "https://triohnte-database-default-rtdb.europe-west1.firebasedatabase.app",

      projectId:
        "triohnte-database",

      appId:
        "1:127473963183:web:c071072d846a8d7240045a"

    };


    /* =====================================================
       INICIALIZA FIREBASE
       ===================================================== */

    if (!firebase.apps.length) {

      firebase.initializeApp(firebaseConfig);

    }


    const auth =
      firebase.auth();

    const database =
      firebase.database();


    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const botaoComprar =
      document.getElementById("botao-comprar");

    const statusUsuario =
      document.getElementById("status-usuario");

    const mensagem =
      document.getElementById("mensagem");


    /* =====================================================
       USUÁRIO ATUAL
       ===================================================== */

    let usuarioAtual = null;


    /* =====================================================
       MENSAGEM
       ===================================================== */

    function mostrarMensagem(texto) {

      mensagem.textContent =
        texto;

      mensagem.style.display =
        "block";


      setTimeout(
        function() {

          mensagem.style.display =
            "none";

        },
        3500
      );

    }


    /* =====================================================
       STATUS DO USUÁRIO
       ===================================================== */

    function atualizarStatus() {

      if (usuarioAtual) {

        statusUsuario.textContent =
          "Você está conectado.";

        statusUsuario.className =
          "text-center mt-8 text-sm text-green-500";

      } else {

        statusUsuario.textContent =
          "Você não está conectado.";

        statusUsuario.className =
          "text-center mt-8 text-sm text-gray-500";

      }

    }


    /* =====================================================
       FIREBASE AUTH
       ===================================================== */

    auth.onAuthStateChanged(
      function(user) {

        usuarioAtual = user;

        atualizarStatus();


        console.log(
          "Estado de autenticação:",
          user
            ? "LOGADO"
            : "NÃO LOGADO"
        );


        if (user) {

          console.log(
            "UID:",
            user.uid
          );

          console.log(
            "E-mail:",
            user.email
          );

        }

      }
    );


    /* =====================================================
       COMPRAR
       ===================================================== */

    botaoComprar.addEventListener(
      "click",
      function() {

        /*
          Verifica se existe um usuário
          autenticado no Firebase.
        */

        if (!usuarioAtual) {

          mostrarMensagem(
            "Faça login para comprar."
          );

          return;

        }


        /*
          Desabilita o botão enquanto
          o usuário é encaminhado.
        */

        botaoComprar.disabled =
          true;


        botaoComprar.textContent =
          "Encaminhando para compra...";


        /*
          Envia o produto para compras.html.
        */

        window.location.href =
          "compras.html?produto=segredarios";

      }
    );


  </script>
