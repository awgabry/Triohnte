<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Loja</title>

  <!-- Fonte Cinzel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      min-height: 100vh;
      font-family: "Cinzel", serif;
    }

    .produto {
      background: #281109;
      border: 1px solid rgba(160, 110, 60, 0.25);
      transition: 0.25s ease;
    }

    .produto:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .botao-comprar {
      background: #000;
      color: white;
      border: 1px solid #55351f;
      transition: 0.2s ease;
      font-family: "Cinzel", serif;
    }

    .botao-comprar:hover {
      background: #160a05;
      border-color: #8a5b32;
    }

    .botao-comprar:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #mensagem {
      display: none;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      background: #181818;
      border: 1px solid #694528;
      border-radius: 8px;
      padding: 14px 20px;
      min-width: 280px;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
      font-family: "Cinzel", serif;
    }
  </style>
</head>

<body class="bg-black text-white p-6 md:p-10">

  <!-- ===================================================== -->
  <!-- MENSAGEM -->
  <!-- ===================================================== -->

  <div id="mensagem"></div>


  <!-- ===================================================== -->
  <!-- CONTEÚDO -->
  <!-- ===================================================== -->

  <main class="w-full max-w-5xl mx-auto">

    <!-- TÍTULO -->

    <header class="text-center mb-10">

      <h1
        id="titulo-principal"
        class="text-4xl md:text-5xl font-bold mb-3"
      >
        Loja
      </h1>

      <p
        id="subtitulo"
        class="text-gray-400"
      >
        Vamos acessar Triohnte? Compre!
      </p>

    </header>


    <!-- =================================================== -->
    <!-- PRODUTO -->
    <!-- =================================================== -->

    <section class="grid grid-cols-1 gap-8 max-w-4xl mx-auto">

      <article
        class="produto p-6 md:p-8 rounded-xl text-center"
      >

        <!-- CAPA DO LIVRO -->

        <div
          class="flex justify-center items-center mb-6"
          style="min-height:220px;"
        >

          <img
            id="imagem-produto"
            src="segredarios.png"
            alt="Segredários"
            class="max-w-xs w-full rounded-lg object-cover"
            onerror="this.style.display='none';"
          >

        </div>


        <h2
          id="produto-titulo"
          class="text-2xl font-bold mb-2"
        >
          Triohnte
        </h2>


        <p
          id="produto-tipo"
          class="text-sm text-gray-400 mb-4"
        >
          Primeiro Volume
        </p>


        <p
          id="produto-descricao"
          class="text-sm text-gray-300 mb-4"
        >
          Download desabilitado pela proteção de dados.
        </p>


        <p
          id="produto-preco"
          class="text-2xl font-bold mb-3"
        >
          Preço: R$ 6,99
        </p>


        <p
          id="produto-autor"
          class="text-lg mb-6"
        >
          Gabryell Aweryan.
        </p>


        <button
          id="botao-comprar"
          type="button"
          class="botao-comprar px-10 py-3 rounded-full font-bold"
        >
          Comprar
        </button>

      </article>

    </section>

  </main>


  <!-- ===================================================== -->
  <!-- FIREBASE -->
  <!-- ===================================================== -->

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


  <script>

    /* =====================================================
       MESMO FIREBASE DO INDEX.HTML
       ===================================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyAajz5PVa79vH1FSWrC0pPrGxs0Q-9xkFk",

      authDomain:
        "triohnte-database.firebaseapp.com",

      databaseURL:
        "https://triohnte-database-default-rtdb.europe-west1.firebasedatabase.app",

      projectId:
        "triohnte-database",

      appId:
        "1:127473963183:web:c071072d846a8d7240045a"

    };


    /* =====================================================
       INICIALIZA FIREBASE
       ===================================================== */

    if (!firebase.apps.length) {

      firebase.initializeApp(firebaseConfig);

    }


    const auth =
      firebase.auth();

    const database =
      firebase.database();


    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const botaoComprar =
      document.getElementById("botao-comprar");

    const mensagem =
      document.getElementById("mensagem");


    /* =====================================================
       USUÁRIO ATUAL
       ===================================================== */

    let usuarioAtual = null;


    /* =====================================================
       MENSAGEM
       ===================================================== */

    function mostrarMensagem(texto) {

      mensagem.textContent =
        texto;

      mensagem.style.display =
        "block";


      setTimeout(
        function() {

          mensagem.style.display =
            "none";

        },
        3500
      );

    }


    /* =====================================================
       FIREBASE AUTH
       ===================================================== */

    auth.onAuthStateChanged(
      function(user) {

        usuarioAtual = user;

        console.log(
          "Estado de autenticação:",
          user
            ? "LOGADO"
            : "NÃO LOGADO"
        );


        if (user) {

          console.log(
            "UID:",
            user.uid
          );

          console.log(
            "E-mail:",
            user.email
          );

        }

      }
    );


    /* =====================================================
       COMPRAR
       ===================================================== */

    botaoComprar.addEventListener(
      "click",
      function() {

        /*
          Verifica se existe um usuário
          autenticado no Firebase.
        */

        if (!usuarioAtual) {

          mostrarMensagem(
            "Faça login para comprar."
          );

          return;

        }


        /*
          Desabilita o botão enquanto
          o usuário é encaminhado.
        */

        botaoComprar.disabled =
          true;


        botaoComprar.textContent =
          "Encaminhando para compra...";


        /*
          Envia o produto para compras.html.
        */

        window.location.href =
          "compras.html?produto=segredarios";

      }
    );

  </script>

</body>
</html>
