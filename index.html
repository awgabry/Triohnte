<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triohnte - Mapa Interativo</title>
    <!-- Fonte Cinzel para a estética de fantasia -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. ESTILOS GERAIS E INTERFACE DO SITE
           ========================================================================== */
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            font-family: 'Cinzel', Georgia, serif;
            color: #f5f5f5;
            overflow: hidden; /* Impede barras de rolagem na tela principal */
            height: 100vh;
        }

        /* Container do Mapa Canvas (Com suporte a Zoom e Arrastar) */
        #mapContainer {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            cursor: grab;
        }

        #mapContainer:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
        }

        /* ==========================================================================
           2. NOVO DROPDOWN REESTILIZADO (Idêntico ao das imagens)
           ========================================================================== */
        .custom-dropdown {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 420px;
            background-color: #000000;
            border: 1px solid #d4af37;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            user-select: none;
            z-index: 1000;
        }

        .dropdown-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            cursor: pointer;
            background: linear-gradient(180deg, #121212 0%, #080808 100%);
            border-bottom: 1px solid #222;
        }

        .dropdown-header:hover {
            background: #151515;
        }

        .dropdown-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dropdown-header img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .dropdown-header span {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #d4af37;
            font-weight: bold;
        }

        .dropdown-arrow {
            font-size: 10px;
            color: #666;
            transition: transform 0.3s ease;
        }

        .custom-dropdown.open .dropdown-arrow {
            transform: rotate(180deg);
        }

        .dropdown-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #050505;
        }

        .custom-dropdown.open .dropdown-body {
            max-height: 400px;
            overflow-y: auto;
        }

        .dropdown-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 12px;
        }

        .dropdown-item {
            background-color: #0a0a0a;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dropdown-item:hover {
            background-color: #121212;
            border-color: #555;
        }

        .dropdown-item.selected {
            background-color: #11110b;
            border-color: #d4af37;
        }

        .dropdown-item img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .dropdown-item .display-name {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #bfa15f;
        }

        /* ==========================================================================
           3. PAINEL DE INFORMAÇÕES DO TERRITÓRIO
           ========================================================================== */
        .info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            background-color: rgba(0, 0, 0, 0.9);
            border: 1px solid #d4af37;
            border-radius: 6px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none; /* Aparece ao clicar num território */
        }

        .info-panel h2 {
            margin-top: 0;
            color: #d4af37;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .info-field {
            margin: 10px 0;
            font-size: 14px;
        }

        .info-label {
            color: #888;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- MAPA CANVAS -->
    <div id="mapContainer">
        <canvas id="mapCanvas"></canvas>
    </div>

    <!-- DROPDOWN INTEGRADO (Nomes e caminhos corrigidos com base em image_104278.png) -->
    <div class="custom-dropdown" id="reinoDropdown">
        <div class="dropdown-header" id="dropdownHeader">
            <div class="dropdown-header-left">
                <img id="selectedCasaImg" src="reinosdemavul/ashen.png" alt="Brasão">
                <span id="selectedCasaNome">Ashen</span>
            </div>
            <div class="dropdown-arrow">▲</div>
        </div>

        <div class="dropdown-body">
            <div class="dropdown-grid" id="dropdownGrid">
                <!-- Itens da sua pasta reinosdemavul/ -->
                <div class="dropdown-item" data-casa="Ashen">
                    <img src="reinosdemavul/ashen.png" alt="Ashen">
                    <span class="display-name">Ashen</span>
                </div>
                <div class="dropdown-item" data-casa="Barchyro">
                    <img src="reinosdemavul/barchyro.png" alt="Barchyro">
                    <span class="display-name">Barchyro</span>
                </div>
                <div class="dropdown-item" data-casa="Blakah">
                    <img src="reinosdemavul/blakah.png" alt="Blakah">
                    <span class="display-name">Blakah</span>
                </div>
                <div class="dropdown-item" data-casa="Bolynas">
                    <img src="reinosdemavul/bolynas.png" alt="Bolynas">
                    <span class="display-name">Bolynas</span>
                </div>
                <div class="dropdown-item" data-casa="Brakemir">
                    <img src="reinosdemavul/brakemir.png" alt="Brakemir">
                    <span class="display-name">Brakemir</span>
                </div>
                <div class="dropdown-item" data-casa="Cervindor">
                    <img src="reinosdemavul/cervindor.png" alt="Cervindor">
                    <span class="display-name">Cervindor</span>
                </div>
                <div class="dropdown-item" data-casa="Cosnalia">
                    <img src="reinosdemavul/cosnalia.png" alt="Cosnalia">
                    <span class="display-name">Cosnalia</span>
                </div>
                <div class="dropdown-item" data-casa="Drakorvy">
                    <img src="reinosdemavul/drakorvy.png" alt="Drakorvy">
                    <span class="display-name">Drakorvy</span>
                </div>
                <div class="dropdown-item" data-casa="Fartally">
                    <img src="reinosdemavul/fartally.png" alt="Fartally">
                    <span class="display-name">Fartally</span>
                </div>
                <div class="dropdown-item" data-casa="Flamaryn">
                    <img src="reinosdemavul/flamaryn.png" alt="Flamaryn">
                    <span class="display-name">Flamaryn</span>
                </div>
                <div class="dropdown-item" data-casa="Kaldarion">
                    <img src="reinosdemavul/kaldarion.png" alt="Kaldarion">
                    <span class="display-name">Kaldarion</span>
                </div>
                <div class="dropdown-item" data-casa="Klavar">
                    <img src="reinosdemavul/klavar.png" alt="Klavar">
                    <span class="display-name">Klavar</span>
                </div>
            </div>
        </div>
    </div>

    <!-- PAINEL DE INFORMAÇÕES (Com as chaves corrigidas: 'idade' e 'Trono') -->
    <div class="info-panel" id="infoPanel">
        <h2 id="panelTerritorioNome">Território</h2>
        <div class="info-field"><span class="info-label">Trono:</span> <span id="panelTrono">-</span></div>
        <div class="info-field"><span class="info-label">Idade:</span> <span id="panelIdade">-</span></div>
        <div class="info-field"><span class="info-label">Cultura:</span> <span id="panelCultura">-</span></div>
    </div>

    <!-- ELEMENTOS DE ÁUDIO INTEGRADOS -->
    <audio id="bgMusic" src="ae.mp3" loop></audio>
    <audio id="clickSound" src="lohy.mp3"></audio>

    <!-- SCRIPTS DO FIREBASE (Substitua pelas suas chaves se necessário) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
        // ==========================================================================
        // 4. CONFIGURAÇÃO DO FIREBASE REALTIME DATABASE
        // ==========================================================================
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "triohnte.firebaseapp.com",
            databaseURL: "https://triohnte-default-rtdb.firebaseio.com",
            projectId: "triohnte",
            storageBucket: "triohnte.appspot.com",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };
        
        // Inicializa o Firebase apenas se as chaves forem preenchidas
        if(firebaseConfig.apiKey !== "SUA_API_KEY") {
            firebase.initializeApp(firebaseConfig);
        }
        const database = typeof firebase !== 'undefined' ? firebase.database() : null;

        // ==========================================================================
        // 5. PROTEÇÃO DE CONTEÚDO (Anti-Cópia e Printscreen)
        // ==========================================================================
        document.addEventListener('contextmenu', e => e.preventDefault()); // Bloqueia clique direito
        document.addEventListener('selectstart', e => e.preventDefault()); // Bloqueia seleção de texto
        
        document.addEventListener('keydown', e => {
            // Bloqueia Ctrl+S, Ctrl+U, Ctrl+Shift+I e a tecla PrintScreen
            if (e.ctrlKey && (e.key === 's' || e.key === 'u' || e.key === 'I')) e.preventDefault();
            if (e.key === 'PrintScreen') {
                navigator.clipboard.writeText(''); // Limpa a área de transferência
                alert('Capturas de tela não são permitidas nesta página.');
            }
        });

        // ==========================================================================
        // 6. MOTOR DO MAPA (Canvas, Zoom Mouse-Wheel, Click e Arrastar)
        // ==========================================================================
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        
        let scale = 1.0;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let startX, startY;

        const mapImg = new Image();
        mapImg.src = 'tryu.png'; // Sua imagem principal carregada no repositório

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawMap();
        }

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(canvas.width / 2 + offsetX, canvas.height / 2 + offsetY);
            ctx.scale(scale, scale);
            if (mapImg.complete) {
                ctx.drawImage(mapImg, -mapImg.width / 2, -mapImg.height / 2);
            } else {
                ctx.fillStyle = '#111';
                ctx.fillRect(-200, -200, 400, 400);
            }
            ctx.restore();
        }

        mapImg.onload = drawMap;
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Arrastar o mapa com o mouse
        canvas.addEventListener('mousedown', e => {
            isDragging = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        });

        window.addEventListener('mousemove', e => {
            if (!isDragging) return;
            offsetX = e.clientX - startX;
            offsetY = e.clientY - startY;
            drawMap();
        });

        window.addEventListener('mouseup', () => isDragging = false);

        // Zoom com a roda do mouse (Mouse Wheel Zoom)
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            const zoomFactor = 1.1;
            if (e.deltaY < 0) {
                scale *= zoomFactor;
            } else {
                scale /= zoomFactor;
            }
            scale = Math.min(Math.max(scale, 0.5), 4.0); // Limita o zoom entre 0.5x e 4x
            drawMap();
        });

        // Clique no Mapa e ativação de Áudio Localizado
        canvas.addEventListener('click', e => {
            // Toca a música ambiente no primeiro clique caso o navegador tenha bloqueado
            const bgMusic = document.getElementById('bgMusic');
            if(bgMusic.paused) bgMusic.play().catch(() => {});

            // Toca o efeito sonoro de seleção de território
            const clickSound = document.getElementById('clickSound');
            clickSound.currentTime = 0;
            clickSound.play().catch(() => {});

            // Exemplo de exibição do painel (Em produção, você calculará os eixos do clique)
            exibirPainelTerritorio("Reino de Mavul");
        });

        function exibirPainelTerritorio(nomeTerritorio) {
            document.getElementById('panelTerritorioNome').textContent = nomeTerritorio;
            
            if (database) {
                // Puxa as informações dinâmicas direto do Firebase Realtime Database
                database.ref('territorios/' + nomeTerritorio).once('value').then(snapshot => {
                    const data = snapshot.val() || {};
                    document.getElementById('panelTrono').textContent = data.Trono || "Desconhecido";
                    document.getElementById('panelIdade').textContent = data.idade || "-"; // Campo corrigido de ididade para idade
                    document.getElementById('panelCultura').textContent = data.cultura || "-";
                });
            } else {
                // Fallback de exibição sem banco configurado
                document.getElementById('panelTrono').textContent = "Mavul";
                document.getElementById('panelIdade').textContent = "1200 anos";
                document.getElementById('panelCultura').textContent = "Triohnte Tradicional";
            }
            document.getElementById('infoPanel').style.display = 'block';
        }

        // ==========================================================================
        // 7. LÓGICA DE FUNCIONAMENTO DO DROPDOWN REESTILIZADO
        // ==========================================================================
        const dropdown = document.getElementById('reinoDropdown');
        const header = document.getElementById('dropdownHeader');
        const items = document.querySelectorAll('.dropdown-item');
        const selectedNome = document.getElementById('selectedCasaNome');
        const selectedImg = document.getElementById('selectedCasaImg');

        // Alternar abertura do menu
        header.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.classList.toggle('open');
        });

        // Fechar se clicar no mapa
        document.addEventListener('click', () => dropdown.classList.remove('open'));

        // Seleção de itens integrada salvando com minúsculo no servidor
        items.forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                const casa = item.getAttribute('data-casa');
                const arquivoMinusculo = casa.toLowerCase();

                // Atualiza a interface superior imediatamente
                selectedNome.textContent = casa.toUpperCase();
                selectedImg.src = `reinosdemavul/${arquivoMinusculo}.png`;

                // Altera as classes de seleção
                items.forEach(i => i.classList.remove('selected'));
                item.classList.add('selected');

                dropdown.classList.remove('open');

                // Atualiza a escolha do Trono do usuário no Firebase
                if (database) {
                    database.ref('usuarios/atual/casa').set(casa);
                }
                console.log(`Casa atualizada no trono: ${casa}`);
            });
        });

        // Função para recuperar a preferência salva do usuário ao carregar a página
        function carregarConfiguracoesUsuario() {
            if (database) {
                database.ref('usuarios/atual/casa').once('value').then(snapshot => {
                    const casaSalva = snapshot.val();
                    if (casaSalva) {
                        const arquivoMinusculo = casaSalva.toLowerCase();
                        selectedNome.textContent = casaSalva.toUpperCase();
                        selectedImg.src = `reinosdemavul/${arquivoMinusculo}.png`;
                        
                        items.forEach(item => {
                            if(item.getAttribute('data-casa').toLowerCase() === arquivoMinusculo) {
                                item.classList.add('selected');
                            }
                        });
                    }
                });
            }
        }
        
        window.onload = () => {
            carregarConfiguracoesUsuario();
        };
    </script>
</body>
</html>
