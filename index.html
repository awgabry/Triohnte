<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de Escolha - Triohnte</title>
    <style>
        /* ==========================================================================
           ESTILOS DO MENU (Baseado no layout de image_1045c2.png)
           ========================================================================== */
        body {
            background-color: #0d0d0d;
            font-family: 'Cinzel', 'Georgia', serif;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Container Principal do Dropdown */
        .custom-dropdown {
            width: 420px;
            background-color: #000000;
            border: 1px solid #d4af37;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            user-select: none;
        }

        /* Botão do Cabeçalho (Onde mostra o Reino Selecionado) */
        .dropdown-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            cursor: pointer;
            background: linear-gradient(180deg, #121212 0%, #080808 100%);
            border-bottom: 1px solid #333;
            transition: background 0.2s ease;
        }

        .dropdown-header:hover {
            background: #151515;
        }

        .dropdown-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dropdown-header img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .dropdown-header span {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #d4af37;
            font-weight: bold;
        }

        /* Ícone da Seta do Menu */
        .dropdown-arrow {
            font-size: 10px;
            color: #666;
            transition: transform 0.3s ease;
        }

        .custom-dropdown.open .dropdown-arrow {
            transform: rotate(180deg);
        }

        /* Grade de Itens (O Menu de Escolha Ocultável) */
        .dropdown-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #050505;
        }

        .custom-dropdown.open .dropdown-body {
            max-height: 400px; /* Ajuste o limite conforme necessário */
            overflow-y: auto;
        }

        .dropdown-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 12px;
        }

        /* Cards Individuais dos Reinos */
        .dropdown-item {
            background-color: #0a0a0a;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dropdown-item:hover {
            background-color: #121212;
            border-color: #555;
        }

        /* Estado Selecionado (Destaque Dourado) */
        .dropdown-item.selected {
            background-color: #11110b;
            border-color: #d4af37;
        }

        .dropdown-item img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        /* Texto Secundário (Nome em minúsculo do arquivo) */
        .dropdown-item .file-name {
            font-size: 10px;
            color: #888;
        }

        /* Texto Principal (Nome de Exibição) */
        .dropdown-item .display-name {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #bfa15f;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- CONTAINER INTEGRADO DO DROPDOWN -->
    <div class="custom-dropdown" id="reinoDropdown">
        
        <!-- Cabeçalho Principal -->
        <div class="dropdown-header" id="dropdownHeader">
            <div class="dropdown-header-left">
                <!-- Imagem inicial padrão (substituída dinamicamente) -->
                <img id="selectedCasaImg" src="reinosdemavul/ashen.png" alt="Brasão">
                <span id="selectedCasaNome">Ashen</span>
            </div>
            <div class="dropdown-arrow">▲</div>
        </div>

        <!-- Corpo com a Lista de Escolhas -->
        <div class="dropdown-body">
            <div class="dropdown-grid" id="dropdownGrid">
                
                <!-- Itens mapeados exatamente conforme a pasta do seu GitHub (image_104278.png) -->
                <div class="dropdown-item" data-casa="Ashen">
                    <img src="reinosdemavul/ashen.png" alt="Ashen">
                    <span class="file-name">Ashen</span>
                    <span class="display-name">Ashen</span>
                </div>

                <div class="dropdown-item" data-casa="Barchyro">
                    <img src="reinosdemavul/barchyro.png" alt="Barchyro">
                    <span class="file-name">Barchyro</span>
                    <span class="display-name">Barchyro</span>
                </div>

                <div class="dropdown-item" data-casa="Blakah">
                    <img src="reinosdemavul/blakah.png" alt="Blakah">
                    <span class="file-name">Blakah</span>
                    <span class="display-name">Blakah</span>
                </div>

                <div class="dropdown-item" data-casa="Bolynas">
                    <img src="reinosdemavul/bolynas.png" alt="Bolynas">
                    <span class="file-name">Bolynas</span>
                    <span class="display-name">Bolynas</span>
                </div>

                <div class="dropdown-item" data-casa="Brakemir">
                    <img src="reinosdemavul/brakemir.png" alt="Brakemir">
                    <span class="file-name">Brakemir</span>
                    <span class="display-name">Brakemir</span>
                </div>

                <div class="dropdown-item" data-casa="Cervindor">
                    <img src="reinosdemavul/cervindor.png" alt="Cervindor">
                    <span class="file-name">Cervindor</span>
                    <span class="display-name">Cervindor</span>
                </div>

                <div class="dropdown-item" data-casa="Cosnalia">
                    <img src="reinosdemavul/cosnalia.png" alt="Cosnalia">
                    <span class="file-name">Cosnalia</span>
                    <span class="display-name">Cosnalia</span>
                </div>

                <div class="dropdown-item" data-casa="Drakorvy">
                    <img src="reinosdemavul/drakorvy.png" alt="Drakorvy">
                    <span class="file-name">Drakorvy</span>
                    <span class="display-name">Drakorvy</span>
                </div>

                <div class="dropdown-item" data-casa="Fartally">
                    <img src="reinosdemavul/fartally.png" alt="Fartally">
                    <span class="file-name">Fartally</span>
                    <span class="display-name">Fartally</span>
                </div>

                <div class="dropdown-item" data-casa="Flamaryn">
                    <img src="reinosdemavul/flamaryn.png" alt="Flamaryn">
                    <span class="file-name">Flamaryn</span>
                    <span class="display-name">Flamaryn</span>
                </div>

                <div class="dropdown-item" data-casa="Kaldarion">
                    <img src="reinosdemavul/kaldarion.png" alt="Kaldarion">
                    <span class="file-name">Kaldarion</span>
                    <span class="display-name">Kaldarion</span>
                </div>

                <div class="dropdown-item" data-casa="Klavar">
                    <img src="reinosdemavul/klavar.png" alt="Klavar">
                    <span class="file-name">Klavar</span>
                    <span class="display-name">Klavar</span>
                </div>

            </div>
        </div>
    </div>

    <!-- ==========================================================================
       LÓGICA JAVASCRIPT
       ========================================================================== */ -->
    <script>
        const dropdown = document.getElementById('reinoDropdown');
        const header = document.getElementById('dropdownHeader');
        const items = document.querySelectorAll('.dropdown-item');
        
        const selectedNome = document.getElementById('selectedCasaNome');
        const selectedImg = document.getElementById('selectedCasaImg');

        // 1. Abre e fecha o menu ao clicar no cabeçalho
        header.addEventListener('click', () => {
            dropdown.classList.toggle('open');
        });

        // 2. Fecha o menu se o usuário clicar fora dele
        document.addEventListener('click', (e) => {
            if (!dropdown.contains(e.target)) {
                dropdown.classList.remove('open');
            }
        });

        // 3. Gerencia o clique e a seleção de cada reino da lista
        items.forEach(item => {
            item.addEventListener('click', () => {
                const casa = item.getAttribute('data-casa');
                
                // Transforma o nome em minúsculo estrito para bater com a imagem do servidor
                const nomeArquivoMinusculo = casa.toLowerCase();

                // Atualiza o topo com o nome e imagem selecionados
                selectedNome.textContent = casa.toUpperCase();
                selectedImg.src = `reinosdemavul/${nomeArquivoMinusculo}.png`;

                // Remove a borda dourada ativa dos outros itens e coloca no atual
                items.forEach(i => i.classList.remove('selected'));
                item.classList.add('selected');

                // Fecha o menu após escolher
                dropdown.classList.remove('open');

                // Dispara uma função global ou salvamento se você precisar (ex: Banco de Dados/LocalStorage)
                console.log(`Reino selecionado com sucesso: ${casa}`);
                // seTronoNoBanco(casa); // <--- Sua função antiga se houver
            });
        });

        // 4. Simulador de carregamento inicial (Buscando o estado salvo do banco)
        // Substitua essa função pelo bloco que puxa os dados salvos do seu usuário do Firebase/Vercel
        function carregarReinoDoBanco(casaSalva) {
            if (!casaSalva) return;

            const arquivoMinusculo = casaSalva.toLowerCase();
            
            // Atualiza os elementos principais do topo do menu
            if (selectedNome) selectedNome.textContent = casaSalva.toUpperCase();
            if (selectedImg) selectedImg.src = `reinosdemavul/${arquivoMinusculo}.png`;

            // Varre a grade de escolha para pré-selecionar visualmente o card correto
            items.forEach(item => {
                if (item.getAttribute('data-casa').toLowerCase() === arquivoMinusculo) {
                    item.classList.add('selected');
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        // Exemplo: Se o banco retornar que a casa ativa dele é "Blakah" ao abrir a página:
        // carregarReinoDoBanco("Blakah");
    </script>
</body>
</html>
