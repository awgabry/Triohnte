<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Triohnte</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

<link rel="icon" type="image/png" href="mu.png">

<style>
/* =========================
   TEU CSS (MANTIDO INTACTO)
   ========================= */

* { margin:0; padding:0; box-sizing:border-box; }

body {
    background-color:#050505;
    color:#a39b8f;
    font-family:'Crimson Pro', serif;
}

/* (⚠️ TODO teu CSS continua exatamente igual — omitido aqui por espaço,
   mas no ficheiro real mantém tudo o que enviaste) */

.hidden { display:none !important; }
</style>

</head>

<body>

<div class="vignette"></div>

<div class="top-bar-container">
    <div id="user-info" class="auth-box hidden">
        <div class="user-logged">
            <img id="user-mini-avatar" class="profile-img-preview-mini hidden">
            <span id="user-greeting">Olá</span>
            <span id="account-btn" class="account-link">[Conta]</span>
            <span id="logout-btn" class="logout-link">[Sair]</span>
        </div>
    </div>
</div>

<header>
    <h1 style="text-align:center; color:white;">Triohnte</h1>
</header>

<main>

<section class="auth-section">
    <h2>Torne-se um aliado</h2>

    <div class="auth-container-block">
        <input id="email-field" type="email" placeholder="E-mail">
        <input id="pass-field" type="password" placeholder="Senha">

        <div class="auth-actions">
            <button id="login-btn" class="auth-btn">Entrar</button>
            <button id="signup-btn" class="auth-btn">Registrar</button>
        </div>
    </div>
</section>

</main>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    // 🔥 CONFIGURAÇÃO FIREBASE (SUBSTITUI PELOS TEUS DADOS)
    const firebaseConfig = {
        apiKey: "SUA_API_KEY",
        authDomain: "SEU_AUTH_DOMAIN",
        databaseURL: "SUA_DATABASE_URL",
        projectId: "SEU_PROJECT_ID",
        appId: "SEU_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    // ELEMENTOS
    const email = document.getElementById("email-field");
    const pass = document.getElementById("pass-field");
    const loginBtn = document.getElementById("login-btn");
    const signupBtn = document.getElementById("signup-btn");

    const userInfo = document.getElementById("user-info");
    const userGreeting = document.getElementById("user-greeting");
    const logoutBtn = document.getElementById("logout-btn");

    // LOGIN
    loginBtn.addEventListener("click", async () => {
        try {
            await auth.signInWithEmailAndPassword(email.value, pass.value);
            alert("Login efetuado");
        } catch (err) {
            alert("Erro: " + err.message);
        }
    });

    // REGISTRO
    signupBtn.addEventListener("click", async () => {
        try {
            await auth.createUserWithEmailAndPassword(email.value, pass.value);
            alert("Conta criada com sucesso");
        } catch (err) {
            alert("Erro: " + err.message);
        }
    });

    // LOGOUT
    logoutBtn.addEventListener("click", async () => {
        await auth.signOut();
    });

    // ESTADO DO USUÁRIO
    auth.onAuthStateChanged(user => {
        if (user) {
            userInfo.classList.remove("hidden");
            userGreeting.textContent = `Olá, ${user.email}`;
        } else {
            userInfo.classList.add("hidden");
        }
    });

});
</script>

</body>
</html>
