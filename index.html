<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triohnte</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="mu.png">

    <style>
        /* --- ESTILIZAÇÃO CSS OTIMIZADA --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold-gradient: linear-gradient(
                to bottom, 
                #c59d5f 0%,   
                #e3c38f 40%,  
                #f3e1b5 48%, 
                #7a542a 52%, 
                #b88640 60%,  
                #8a5d2e 100%  
            );
            --gold-shadow: drop-shadow(0 2px 2px rgba(0,0,0,0.8));
        }

        .intro-text h2, 
        .card h3, 
        .progress-section h2,
        .forum-section h2,
        .auth-section h2,
        .footer-logo {
            display: inline-block;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            font-weight: 700;
            filter: var(--gold-shadow);
        }

        .img-titulo, .footer-logo-img {
            background: var(--gold-gradient);
            -webkit-mask-image: url('triwo.png');
            mask-image: url('triwo.png');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            background-clip: border-box;
            object-position: -9999px; 
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.9)) drop-shadow(0 0 5px rgba(212, 163, 86, 0.3));
        }

        .img-titulo {
            width: 1000px; 
            height: 300px; 
            max-width: 100%;
            display: block;
            margin: 0 auto;
            animation: flicker 4s infinite alternate;
        }

        body {
            background-color: #050505;
            color: #a39b8f;
            font-family: 'Crimson Pro', serif;
            line-height: 1.8;
            overflow-x: hidden;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 15vw rgba(0,0,0,1);
            pointer-events: none;
            z-index: 100;
        }

        header {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(to bottom, rgba(5,5,5,0.4), #050505),
                        url('https://raw.githubusercontent.com/awgabry/Triohnte/main/map%203.png'); 
            background-size: cover;
            background-position: center;
            border-bottom: 1px solid #1a0000;
            position: relative;
        }

        .borda-lateral {
            position: absolute;
            top: 0;
            height: 100%;
            width: 40px; 
            z-index: 10;
            background: var(--gold-gradient);
            -webkit-mask-image: url('serd.png');
            mask-image: url('serd.png');
            -webkit-mask-size: contain;
            mask-repeat: repeat-y;
            filter: var(--gold-shadow);
        }

        .borda-esquerda { left: 10px; }
        .borda-direita { right: 10px; transform: scaleX(-1); }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.8; }
        }

        nav { margin-top: 50px; }
        nav ul { list-style: none; display: flex; gap: 40px; }
        nav a {
            text-decoration: none;
            color: #888;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            letter-spacing: 2px;
        }
        nav a:hover { color: #fff; text-shadow: 0 0 8px #fff; letter-spacing: 4px; }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 30px;
            animation: fadeIn 2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .intro-text { text-align: center; margin-bottom: 120px; }
        .intro-text h2 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem; 
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        .intro-text p { font-size: 1.3rem; font-style: italic; margin-bottom: 20px; }

        /* --- GRID E CARDS --- */
        .lore-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            align-items: stretch;
            margin-bottom: 120px;
        }

        .lore-grid a {
            text-decoration: none;
            color: inherit;
            display: flex;
        }

        .card {
            background: #0a0a0a;
            padding: 40px;
            border: 1px solid #1a1a1a;
            position: relative;
            transition: 0.5s;
            width: 100%;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; height: 100%; width: 2px;
            background: #ffc88a; 
            transform: scaleY(0);
            transition: 0.5s;
        }
        .card:hover { background: #0f0f0f; border-color: #333; }
        .card:hover::before { transform: scaleY(1); }
        .card h3 { font-family: 'Cinzel', serif; margin-bottom: 20px; font-size: 1.4rem; letter-spacing: 1px; }

        /* --- BARRA DE PROGRESSO --- */
        .progress-section {
            text-align: center;
            background: #0a0a0a;
            padding: 50px 40px;
            border: 1px solid #1a1a1a;
            margin-bottom: 60px;
        }
        .progress-section h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .progress-container {
            background-color: #151515;
            border-radius: 4px;
            padding: 4px;
            border: 1px solid #222;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }
        .progress-bar {
            height: 24px;
            width: 46%; 
            background: var(--gold-gradient);
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(197, 157, 95, 0.4);
            transition: width 1s ease-in-out;
            position: relative;
            animation: pulseGlow 3s infinite alternate;
        }
        .progress-text {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: #e3c38f;
            letter-spacing: 1px;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(197, 157, 95, 0.3); }
            100% { box-shadow: 0 0 20px rgba(243, 225, 181, 0.6); }
        }

        /* --- MINI FÓRUM / ATUALIZAÇÕES --- */
        .forum-section {
            background: #0a0a0a;
            padding: 50px 40px;
            border: 1px solid #1a1a1a;
            margin-bottom: 60px;
        }
        .forum-section h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            text-align: center;
        }
         
        .forum-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px dashed transparent; 
            transition: border-color 0.3s;
        }

        .forum-form.has-posts {
            border-bottom-color: #222;
        }

        .forum-form textarea {
            background: #050505;
            border: 1px solid #222;
            color: #a39b8f;
            padding: 15px;
            font-family: 'Crimson Pro', serif;
            font-size: 1.1rem;
            resize: none;
            border-radius: 4px;
            transition: border-color 0.3s;
        }
        .forum-form textarea:focus {
            outline: none;
            border-color: #c59d5f;
        }
        .forum-btn {
            align-self: flex-end;
            background: var(--gold-gradient);
            color: #050505;
            border: none;
            padding: 10px 25px;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.3s;
            box-shadow: var(--gold-shadow);
        }
        .forum-btn:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 10px rgba(227, 195, 143, 0.5);
        }

        .forum-posts {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .post-card {
            background: #050505;
            border: 1px solid #151515;
            padding: 25px;
            border-left: 3px solid #7a542a;
