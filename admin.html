<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem - Admin</title>
    
    <!-- Bibliotecas externas -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            font-family: 'Cinzel', serif;
            background: #050505;
            color: #e5c585;
        }
        
        .hidden {
            display: none;
        }
        
        #login, #app {
            min-height: 100vh;
        }
        
        .center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card {
            background: #0d0d0d;
            border: 1px solid #c59b27;
            padding: 1.5rem;
            border-radius: 14px;
            margin-bottom: 1rem;
            box-shadow: 0 0 15px rgba(197, 155, 39, 0.08);
        }
        
        input, textarea, button {
            width: 100%;
            padding: .7rem;
            border-radius: 10px;
            border: 1px solid #c59b27;
            margin-top: .5rem;
            background: #141414;
            color: #e5c585;
            font-family: 'Cinzel', serif;
        }
        
        input::placeholder, textarea::placeholder {
            color: #7a652a;
        }
        
        button {
            background: #c59b27;
            color: #050505;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #dfae30;
        }
        
        .top {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: #0d0d0d;
            border-bottom: 1px solid #c59b27;
            flex-wrap: wrap;
        }
        
        .tab {
            cursor: pointer;
            opacity: .6;
            color: #e5c585;
        }
        
        .tab.active {
            opacity: 1;
            font-weight: bold;
            color: #f3d06c;
            border-bottom: 2px solid #c59b27;
        }
        
        .section {
            display: none;
            padding: 1rem;
        }
        
        .section.active {
            display: block;
        }
        
        #map {
            height: 420px;
            border-radius: 12px;
            border: 1px solid #c59b27;
        }
        
        .small {
            font-size: .85rem;
            opacity: .7;
        }
        
        .forum-post {
            border-bottom: 1px solid #33260c;
            padding: .5rem 0;
            margin-top: 0.5rem;
        }
        
        iframe {
            width: 100%;
            height: 420px;
            border: none;
            border-radius: 12px;
        }

        /* Estilos para tabelas de gestão e finanças */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        
        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #33260c;
        }
        
        th {
            color: #f3d06c;
        }
        
        .btn-del {
            background: #5a1a1a;
            color: #ff9999;
            border: 1px solid #ff4444;
            padding: 4px 8px;
            font-size: 10px;
            width: auto;
            font-family: 'Cinzel', serif;
        }
        
        .btn-del:hover {
            background: #ff4444;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Tela de Login -->
    <div id="login" class="center">
        <div class="card" style="width:320px">
            <h2 style="color:#f3d06c; text-align:center; margin-top:0;">Admin Sistem</h2>
            <input id="code" placeholder="Código de acesso">
            <button onclick="login()">Entrar</button>
            <p id="error" class="small" style="color:#ff9999; text-align:center;"></p>
        </div>
    </div>

    <!-- Aplicação Principal -->
    <div id="app" class="hidden">
        <div class="top">
            <div class="tab active" onclick="openTab('demo', this)">Demografia</div>
            <div class="tab" onclick="openTab('fin', this)">Finanças</div>
            <div class="tab" onclick="openTab('plan', this)">Planejamentos</div>
            <div class="tab" onclick="openTab('gestao', this)">Gestão de Acesso</div>
            <div class="tab" onclick="openTab('conf', this)">Conferência</div>
        </div>

        <div id="demo" class="section active">
            <div class="card">
                <h3 style="color:#f3d06c">Leitores Globais (Clique no mapa para adicionar um alfinete)</h3>
                <div id="map"></div>
            </div>
        </div>

        <div id="fin" class="section">
            <div class="card">
                <h3 style="color:#f3d06c">Histórico de Vendas</h3>
                <div style="display:flex; gap:5px;">
                    <input id="saleItem" placeholder="Item / Livro">
                    <input id="saleValue" placeholder="Valor (R$)">
                    <button onclick="adicionarVenda()" style="width:150px">Adicionar</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Item / Descrição</th>
                            <th>Valor</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="salesList"></tbody>
                </table>
            </div>
        </div>

        <div id="plan" class="section">
            <div class="card">
                <h3 style="color:#f3d06c">Fórum Interno</h3>
                <textarea id="idea" placeholder="Escreva sua ideia ou planejamento..."></textarea>
                <button onclick="postIdea()">Publicar</button>
                <div id="forum"></div>
            </div>
        </div>

        <div id="gestao" class="section">
            <div class="card">
                <h3 style="color:#f3d06c">Liberar Livros para Usuários</h3>
                <div style="display:flex; gap:5px;">
                    <input id="userEmail" placeholder="E-mail do Usuário">
                    <input id="bookID" placeholder="ID do Livro">
                    <button onclick="permitirAcesso()" style="width:150px">Permitir Acesso</button>
                </div>
                
                <table>
                    <thead>
                        <tr>
                            <th>Usuário</th>
                            <th>ID Livro</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="accessList"></tbody>
                </table>
            </div>
        </div>

        <div id="conf" class="section">
            <div class="card">
                <h3 style="color:#f3d06c">Conferência SW</h3>
                <button onclick="startCall()">Iniciar Sala</button>
                <div id="callArea" class="hidden">
                    <iframe id="callFrame"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts da Aplicação -->
    <script>
        const users = { 'G200207': 'Gabriel' };
        let currentUser = '';
        const DB_URL = 'https://triohnte-database-default-rtdb.europe-west1.firebasedatabase.app/';

        function login() {
            const code = document.getElementById('code').value.trim();
            if (users[code]) {
                currentUser = users[code];
                document.getElementById('login').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                initMap(); 
                loadSales(); 
                renderForum();
                renderAccessList();
            } else {
                document.getElementById('error').innerText = 'Código inválido';
            }
        }

        function openTab(id, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            document.getElementById(id).classList.add('active');
            if (id === 'gestao') renderAccessList();
            if (id === 'fin') loadSales();
            if (id === 'plan') renderForum();
            if (id === 'demo' && map) setTimeout(() => map.invalidateSize(), 200);
        }

        /* Lógica de Gestão de Acesso */
        function permitirAcesso() {
            const email = document.getElementById('userEmail').value.trim().toLowerCase();
            const bookId = document.getElementById('bookID').value.trim();

            if (!email || !bookId) return alert("Preencha todos os campos");

            let permissoes = JSON.parse(localStorage.getItem('sw_permissoes')) || [];
            
            if (!permissoes.find(p => p.email === email && p.bookId === bookId)) {
                permissoes.push({ email, bookId });
                localStorage.setItem('sw_permissoes', JSON.stringify(permissoes));
                renderAccessList();
            }
            
            document.getElementById('userEmail').value = '';
            document.getElementById('bookID').value = '';
        }

        function renderAccessList() {
            const list = document.getElementById('accessList');
            list.innerHTML = '';
            const permissoes = JSON.parse(localStorage.getItem('sw_permissoes')) || [];

            permissoes.forEach((p, index) => {
                const row = `<tr>
                    <td>${p.email}</td>
                    <td>${p.bookId}</td>
                    <td><button class="btn-del" onclick="removerAcesso(${index})">Revogar</button></td>
                </tr>`;
                list.innerHTML += row;
            });
        }

        function removerAcesso(index) {
            let permissoes = JSON.parse(localStorage.getItem('sw_permissoes')) || [];
            permissoes.splice(index, 1);
            localStorage.setItem('sw_permissoes', JSON.stringify(permissoes));
            renderAccessList();
        }

        /* Lógica de Finanças / Histórico de Vendas (Firebase Realtime Database) */
        async function loadSales() {
            try {
                const response = await fetch(`${DB_URL}/vendas.json`);
                const data = await response.json() || {};
                const list = document.getElementById('salesList');
                list.innerHTML = '';

                Object.keys(data).forEach(key => {
                    const venda = data[key];
                    const row = `<tr>
                        <td>${venda.item}</td>
                        <td>${venda.valor}</td>
                        <td><button class="btn-del" onclick="removerVenda('${key}')">Excluir</button></td>
                    </tr>`;
                    list.innerHTML += row;
                });
            } catch (e) {
                console.error("Erro ao carregar vendas", e);
            }
        }

        async function adicionarVenda() {
            const item = document.getElementById('saleItem').value.trim();
            const valor = document.getElementById('saleValue').value.trim();

            if (!item || !valor) return alert("Preencha todos os campos da venda");

            try {
                await fetch(`${DB_URL}/vendas.json`, {
                    method: 'POST',
                    body: JSON.stringify({ item, valor })
                });
                document.getElementById('saleItem').value = '';
                document.getElementById('saleValue').value = '';
                loadSales();
            } catch (e) {
                console.error("Erro ao adicionar venda", e);
            }
        }

        async function removerVenda(key) {
            try {
                await fetch(`${DB_URL}/vendas/${key}.json`, {
                    method: 'DELETE'
                });
                loadSales();
            } catch (e) {
                console.error("Erro ao remover venda", e);
            }
        }

        /* Lógica de Planejamentos / Fórum Interno (Persistente com LocalStorage) */
        function postIdea() {
            const text = document.getElementById('idea').value.trim();
            if (!text) return alert("Escreva algo para publicar");

            let posts = JSON.parse(localStorage.getItem('sw_forum')) || [];
            posts.unshift({ user: currentUser, text, date: new Date().toLocaleString() });
            localStorage.setItem('sw_forum', JSON.stringify(posts));

            document.getElementById('idea').value = '';
            renderForum();
        }

        function renderForum() {
            const forum = document.getElementById('forum');
            forum.innerHTML = '';
            let posts = JSON.parse(localStorage.getItem('sw_forum')) || [];

            posts.forEach(p => {
                const div = document.createElement('div');
                div.className = 'forum-post';
                div.innerHTML = `<strong style="color:#f3d06c">${p.user}</strong> <span class="small">(${p.date})</span><p style="margin:5px 0 0 0">${p.text}</p>`;
                forum.appendChild(div);
            });
        }

        /* Lógica de Demografia / Leitores Globais (Mapa interativo com alfinete vermelho) */
        let map;
        function initMap() {
            if (map) return;
            map = L.map('map').setView([20, 0], 2);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);

            // Carregar alfinetes salvos no localStorage se houver
            let pins = JSON.parse(localStorage.getItem('sw_pins')) || [];
            pins.forEach(pos => {
                addRedPin(pos.lat, pos.lng, false);
            });

            map.on('click', function(e) {
                addRedPin(e.latlng.lat, e.latlng.lng, true);
            });
        }

        function addRedPin(lat, lng, save) {
            const redIcon = L.icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
            });

            L.marker([lat, lng], { icon: redIcon }).addTo(map);

            if (save) {
                let pins = JSON.parse(localStorage.getItem('sw_pins')) || [];
                pins.push({ lat, lng });
                localStorage.setItem('sw_pins', JSON.stringify(pins));
            }
        }
        
        function startCall() { 
            const callArea = document.getElementById('callArea');
            callArea.classList.toggle('hidden');
        }
    </script>
</body>
</html>
