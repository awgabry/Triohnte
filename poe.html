<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Biblioteca - Triohnte</title>

  <!-- Fonte Cinzel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- PDF.js para leitura e camada de texto -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <!-- EmailJS configurado com suas chaves oficiais -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
      emailjs.init("AJRjiPfNJeMN84rol");
    })();
  </script>

  <style>
    /* ===================================================== */
    /* BASE E PROTEÇÃO CONTRA SELEÇÃO INDEVIDA E PRINT        */
    /* ===================================================== */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #000;
      color: #d6d6d6;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* ===================================================== */
    /* OURO METÁLICO — TÍTULOS                                */
    /* ===================================================== */
    .gold-text {
      background: linear-gradient(
        180deg,
        #fff4c9 0%,
        #f7e6b5 12%,
        #e4c27d 28%,
        #c89a4c 50%,
        #a8732d 68%,
        #8f5e22 82%,
        #e1bd72 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.95);
    }

    /* ===================================================== */
    /* BARRA SUPERIOR                                        */
    /* ===================================================== */
    .topbar {
      padding: 1rem;
      background: #080808;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: 1px;
      border-bottom: 1px solid #242424;
    }

    .topbar > span {
      background: linear-gradient(
        180deg,
        #fff4c9 0%,
        #f7e6b5 12%,
        #e4c27d 28%,
        #c89a4c 50%,
        #a8732d 70%,
        #8f5e22 84%,
        #e1bd72 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.9);
    }

    .btn-loja, .btn-admin {
      padding: 0.55rem 1rem;
      border-radius: 10px;
      background: #111;
      color: #d4af37;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      font-weight: 700;
      border: 1px solid #292929;
      transition: all 0.2s ease;
    }

    .btn-loja {
      margin-left: auto;
    }

    .btn-admin {
      display: none;
    }

    .btn-loja:hover, .btn-admin:hover {
      background: #1b1b1b;
      color: #f2d99d;
      border-color: #4a4a4a;
      transform: translateY(-1px);
    }

    /* ===================================================== */
    /* LAYOUT E GRADE DE LIVROS                              */
    /* ===================================================== */
    .layout {
      display: flex;
      min-height: calc(100vh - 58px);
      background: #000;
    }

    .main {
      display: flex;
      flex: 1;
      gap: 1.5rem;
      padding: 1rem;
      align-items: flex-start;
      background: #000;
    }

    #grade {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      flex: 1;
    }

    #novelGrid {
      width: 300px;
      background: #0b0b0b;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding: 1rem;
      border-left: 1px solid #242424;
      border-right: 1px solid #171717;
      flex-shrink: 0;
    }

    #novelGrid h2 {
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
      font-family: 'Cinzel', serif;
      background: linear-gradient(180deg, #fff4c9 0%, #c89a4c 50%, #dfba70 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* CARDS DE LIVROS */
    .card-book {
      background: #101010;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #292929;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
    }

    .cover {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #000;
      border-bottom: 1px solid #292929;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .meta {
      padding: 1.2rem;
      flex-grow: 1;
      background: #101010;
    }

    .meta h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.2rem;
      font-family: 'Cinzel', serif;
      background: linear-gradient(180deg, #fff4c9 0%, #c89a4c 50%, #dfba70 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .meta .author {
      color: #969696;
      font-size: 0.9rem;
      font-style: italic;
      margin-bottom: 0.8rem;
    }

    .meta .synopsis {
      font-size: 0.85rem;
      color: #b8b8b8;
      line-height: 1.5;
      margin-bottom: 0.8rem;
    }

    /* SISTEMA DE ESTRELAS NOS CARDS */
    .rating-container {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 0.5rem;
      cursor: pointer;
    }

    .star {
      font-size: 1.1rem;
      color: #444;
      transition: color 0.2s;
    }

    .star.selected, .star.hover {
      color: #f7e6b5;
    }

    .rating-score {
      font-size: 0.75rem;
      color: #888;
      margin-left: 6px;
    }

    .actions {
      display: flex;
      gap: 0.8rem;
      padding: 1.2rem;
      border-top: 1px solid #282828;
      background: #0c0c0c;
    }

    .btn {
      padding: .5rem .8rem;
      border-radius: 10px;
      border: 1px solid #292929;
      cursor: pointer;
      background: #050505;
      color: #d6d6d6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      height: 38px;
    }

    .btn:hover:not(:disabled) {
      background: #171717;
      border-color: #444;
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* ===================================================== */
    /* DRAWER / LEITOR DE PDF (COM PAINEL INTERNO)           */
    /* ===================================================== */
    .drawer {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .98);
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform .2s ease;
      z-index: 50;
    }

    .drawer.open {
      transform: translateY(0);
    }

    .drawer-body {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .drawer-content {
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000;
      flex: 1;
      position: relative;
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    .reader-sidebar {
      width: 340px;
      background: #080808;
      border-left: 1px solid #242424;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .reader-sidebar h3 {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      background: linear-gradient(180deg, #fff4c9 0%, #c89a4c 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 0;
      margin-bottom: 0.8rem;
    }

    .comment-section textarea {
      width: 100%;
      background: #050505;
      color: #fff;
      border: 1px solid #292929;
      border-radius: 8px;
      padding: 0.6rem;
      font-size: 0.85rem;
      margin-bottom: 0.6rem;
      outline: none;
      resize: none;
      height: 80px;
    }

    .btn-comment {
      width: 100%;
      background: #050505;
      color: #d6d6d6;
      padding: 0.6rem;
      border: 1px solid #292929;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
    }

    .btn-comment:hover {
      background: #171717;
      border-color: #444;
    }

    .email-alert-box {
      margin-top: 1rem;
      padding: 0.7rem;
      background: #141414;
      border: 1px dashed #c89a4c;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #aaa;
      line-height: 1.4;
    }

    #listaComentarios {
      margin-top: 1rem;
      max-height: 300px;
      overflow-y: auto;
    }

    .comentario-item {
      border-bottom: 1px solid #282828;
      padding: 8px 0;
    }

    .comentario-texto {
      font-size: 0.85rem;
      color: #d0d0d0;
      margin: 0;
    }

    .comentario-meta {
      color: #777;
      font-size: 0.7rem;
      display: block;
      margin-top: 4px;
    }

    /* PÁGINAS E CANVAS DO PDF */
    .page-container {
      position: relative;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    .page-container canvas {
      display: block;
      max-width: 100%;
      height: auto !important;
      pointer-events: none;
    }

    .textLayer {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      opacity: 0.2;
      line-height: 1.0;
      pointer-events: auto;
    }

    .textLayer span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }

    .textLayer span::selection {
      background: rgba(255, 235, 59, 0.4);
    }

    .textLayer span.marcado-amarelo {
      background-color: rgba(255, 235, 59, 0.65) !important;
      color: rgba(0, 0, 0, 0.9) !important;
    }

    .btn-marcar-pagina {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(10, 10, 10, 0.9);
      border: 1px solid #c89a4c;
      color: #f7e6b5;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: 'Cinzel', serif;
      cursor: pointer;
      z-index: 10;
    }

    .btn-marcar-pagina:hover {
      background: #c89a4c;
      color: #000;
    }

    /* MENU FLUTUANTE DE SELEÇÃO DE TEXTO */
    #selectionMenu {
      display: none;
      position: fixed;
      background: #141414;
      border: 1px solid #c89a4c;
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.8);
      z-index: 1000;
      padding: 4px;
      gap: 4px;
      flex-direction: column;
    }

    #selectionMenu button {
      background: transparent;
      border: none;
      color: #f7e6b5;
      padding: 6px 12px;
      text-align: left;
      font-size: 0.8rem;
      font-family: 'Cinzel', serif;
      cursor: pointer;
      border-radius: 4px;
      white-space: nowrap;
    }

    #selectionMenu button:hover {
      background: #c89a4c;
      color: #000;
    }

    .reader-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #111;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #292929;
      font-size: 0.8rem;
    }

    .btn-resume {
      background: #1b1b1b;
      color: #f7e6b5;
      border: 1px solid #c89a4c;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
    }

    .btn-resume:hover {
      background: #c89a4c;
      color: #000;
    }

    #drawer .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #drawer .topbar #closeDrawer {
      position: absolute;
      left: 1rem;
    }

    #drawer .topbar .reader-controls-wrapper {
      position: absolute;
      right: 1rem;
    }

    #drawer .topbar #drawerTitle {
      margin: 0;
      font-family: 'Cinzel', serif;
      background: linear-gradient(180deg, #fff4c9 0%, #c89a4c 50%, #dfba70 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>

<body>

  <!-- BARRA SUPERIOR -->
  <header class="topbar">
    <span>Biblioteca</span>
    <a href="loja.html" class="btn-loja">Loja</a>
    <a href="admin.html" class="btn-admin" id="btnAdmin">Admin</a>
  </header>

  <div class="layout">
    <main class="main">
      <div id="grade"></div>
      <div id="novelGrid">
        <h2>Contos de Walingardyn</h2>
      </div>
    </main>
  </div>

  <!-- DRAWER / LEITOR -->
  <div id="drawer" class="drawer" aria-hidden="true">
    <div class="topbar">
      <button class="btn" id="closeDrawer">Fechar</button>
      <h2 id="drawerTitle"></h2>
      <div class="reader-controls-wrapper">
        <div class="reader-controls" id="readerControls" style="display:none;">
          <span id="savedPageInfo" style="color:#d6d6d6;">Nenhum marcador</span>
          <button class="btn-resume" id="btnResume">Continuar de onde parei</button>
        </div>
      </div>
    </div>
    
    <div class="drawer-body">
      <div class="drawer-content" id="drawerContent"></div>

      <aside class="reader-sidebar">
        <div class="comment-section">
          <h3>Comentários da Leitura</h3>
          <textarea id="commentText" placeholder="Escreva seu comentário sobre esta obra..."></textarea>
          <button class="btn-comment" id="btnComment" disabled>Verificando login...</button>
          
          <div class="email-alert-box">
            📧 <strong>Aviso por E-mail:</strong> Anotações, marcações e comentários são enviados automaticamente para triohnte@gmail.com.
          </div>

          <div id="listaComentarios"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- MENU FLUTUANTE DE SELEÇÃO DE TEXTO -->
  <div id="selectionMenu">
    <button id="menuMarcarTexto">Marcar texto</button>
    <button id="menuComentario">Comentário</button>
    <button id="menuComentarioEditor">Comentário de editor</button>
  </div>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    /* ===================================================== */
    /* BLOQUEIO TOTAL DE CAPTURA DE TELA E IMPRESSÃO         */
    /* ===================================================== */
    document.addEventListener('contextmenu', e => e.preventDefault());

    document.addEventListener('keydown', e => {
      if (
        e.key === 'PrintScreen' ||
        e.keyCode === 44 ||
        e.key === 'F12' ||
        (e.ctrlKey && (e.key === 'p' || e.key === 's' || e.key === 'u' || e.key === 'P' || e.key === 'S' || e.key === 'U')) ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c'))
      ) {
        e.preventDefault();
        alert('Ação bloqueada por segurança e direitos autorais.');
        return false;
      }
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'PrintScreen' || e.keyCode === 44) {
        navigator.clipboard.writeText('').catch(() => {});
        alert('Captura de tela bloqueada.');
      }
    });

    /* ===================================================== */
    /* CONFIGURAÇÃO DO FIREBASE                              */
    /* ===================================================== */
    const firebaseConfig = {
      apiKey: "AIzaSyAajz5PVa79vH1FSWrC0pPrGxs0Q-9xkFk",
      authDomain: "triohnte-database.firebaseapp.com",
      databaseURL: "https://triohnte-database-default-rtdb.europe-west1.firebasedatabase.app/",
      projectId: "triohnte-database",
      appId: "1:127473963183:web:c071072d846a8d7240045a"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.database();

    let usuarioLogado = null;
    let livroAtualId = null;

    const EMAILS_AUTORIZADOS = [
      "mr.gabriel04.07.02@hotmail.com",
      "ga7144492@gmail.com",
      "triohnte@gmail.com"
    ];

    const btnAdmin = document.getElementById("btnAdmin");
    
    auth.onAuthStateChanged(user => {
      usuarioLogado = user;
      btnAdmin.style.display = (user && EMAILS_AUTORIZADOS.includes((user.email || "").trim().toLowerCase())) ? "inline-block" : "none";

      if (user) {
        document.getElementById("btnComment").disabled = false;
        document.getElementById("btnComment").innerText = "Enviar Comentário & Notificar";
      } else {
        document.getElementById("btnComment").disabled = false;
        document.getElementById("btnComment").innerText = "Entrar para comentar";
      }
    });

    /* ===================================================== */
    /* FUNÇÃO DE ENVIO DE E-MAIL VIA EMAILJS                 */
    /* ===================================================== */
    async function dispararEmail(tipoAcao, conteudoTexto) {
      try {
        await emailjs.send("service_rqptbco", "template_uzh4ocn", {
          email: usuarioLogado ? usuarioLogado.email : "triohnte@gmail.com",
          name: usuarioLogado ? usuarioLogado.email.split('@')[0] : "Leitor",
          title: `${tipoAcao} - ${document.getElementById("drawerTitle") ? document.getElementById("drawerTitle").textContent : "Obra"}`,
          tipo: tipoAcao,
          conteudo: conteudoTexto
        });
      } catch (err) {
        console.error("Erro ao despachar e-mail via EmailJS:", err);
      }
    }

    /* ===================================================== */
    /* DADOS DOS LIVROS E RENDERIZAÇÃO                       */
    /* ===================================================== */
    const livros = [
      { id: 777, titulo: "Triohnte", autor: "Gabryell Aweryan", capa: "Capa.png", arquivo: "triohnte.pdf", synopsis: "Em Walingardyn, o poder pertence àqueles que conseguem conquistá-lo..." }
    ];
    const novels = [
      { id: 101, titulo: "Contos de Walingardyn", autor: "Gabryell Aweryan", capa: "Coloque aqui seu png", arquivo: "Contos.pdf", synopsis: "Não, em Walingardyn não existe apenas um continente de nome Triohnte." }
    ];

    const grade = document.getElementById("grade");
    const novelGrid = document.getElementById("novelGrid");

    function renderCard(item, container) {
      const card = document.createElement("div");
      card.className = "card-book";
      card.innerHTML = `
        <div class="cover"><img src="${item.capa}" alt="${item.titulo}" onerror="this.style.display='none'"></div>
        <div class="meta">
          <h3>${item.titulo}</h3>
          <div class="author">Por: ${item.autor}</div>
          <div class="synopsis">${item.synopsis}</div>
          <div class="rating-container" data-id="${item.id}">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
            <span class="rating-score" id="score-${item.id}">(0.0)</span>
          </div>
        </div>
        <div class="actions">
          <button class="btn ler" data-id="${item.id}">Ler</button>
        </div>
      `;
      container.appendChild(card);
      carregarMediaEstrelas(item.id);
    }

    livros.forEach(l => renderCard(l, grade));
    novels.forEach(c => renderCard(c, novelGrid));

    /* ===================================================== */
    /* LÓGICA DE VOTAÇÃO POR ESTRELAS                        */
    /* ===================================================== */
    document.body.addEventListener("mouseover", e => {
      const star = e.target.closest(".star");
      if (!star) return;
      const container = star.closest(".rating-container");
      const val = parseInt(star.dataset.value);
      container.querySelectorAll(".star").forEach(s => {
        if (parseInt(s.dataset.value) <= val) {
          s.classList.add("hover");
        } else {
          s.classList.remove("hover");
        }
      });
    });

    document.body.addEventListener("mouseout", e => {
      const container = e.target.closest(".rating-container");
      if (!container) return;
      container.querySelectorAll(".star").forEach(s => s.classList.remove("hover"));
    });

    document.body.addEventListener("click", async e => {
      const star = e.target.closest(".star");
      if (star) {
        if (!usuarioLogado) {
          alert("Você precisa estar conectado para votar com estrelas.");
          return;
        }
        const container = star.closest(".rating-container");
        const livroId = container.dataset.id;
        const nota = parseInt(star.dataset.value);

        try {
          const safeUid = usuarioLogado.uid;
          await db.ref(`avaliacoes_estrelas/${livroId}/${safeUid}`).set({
            nota: nota,
            email: usuarioLogado.email,
            data: Date.now()
          });

          await dispararEmail("Avaliação por Estrela", `Voto de ${nota} estrela(s) atribuído à obra.`);
          alert(`Você avaliou com ${nota} estrela(s)! Obrigado.`);
          carregarMediaEstrelas(livroId);
        } catch (err) {
          console.error("Erro ao registrar avaliação:", err);
          alert("Erro ao registrar voto.");
        }
        return;
      }

      const btnLer = e.target.closest(".ler");
      if (btnLer) {
        const id = btnLer.dataset.id;
        const item = [...livros, ...novels].find(x => x.id == id);
        if (item) openDrawer(item);
      }
    });

    function carregarMediaEstrelas(livroId) {
      db.ref(`avaliacoes_estrelas/${livroId}`).on("value", snapshot => {
        const dados = snapshot.val();
        const scoreEl = document.getElementById(`score-${livroId}`);
        const container = document.querySelector(`.rating-container[data-id="${livroId}"]`);
        if (!scoreEl || !container) return;

        if (!dados) {
          scoreEl.textContent = "(0.0)";
          container.querySelectorAll(".star").forEach(s => s.classList.remove("selected"));
          return;
        }

        let soma = 0;
        let total = 0;
        let meuVoto = 0;

        Object.keys(dados).forEach(uid => {
          const aval = dados[uid];
          soma += aval.nota;
          total++;
          if (usuarioLogado && uid === usuarioLogado.uid) {
            meuVoto = aval.nota;
          }
        });

        const media = (soma / total).toFixed(1);
        scoreEl.textContent = `(${media} - ${total} voto${total > 1 ? 's' : ''})`;

        container.querySelectorAll(".star").forEach(s => {
          if (parseInt(s.dataset.value) <= meuVoto) {
            s.classList.add("selected");
          } else {
            s.classList.remove("selected");
          }
        });
      });
    }

    /* ===================================================== */
    /* LEITOR DE PDF COM CAMADA DE TEXTO E MENU FLUTUANTE    */
    /* ===================================================== */
    let textoSelecionadoGlobal = "";
    let rangeSelecionadoGlobal = null;

    async function openDrawer(item) {
      livroAtualId = item.id;
      const drawer = document.getElementById("drawer");
      const content = document.getElementById("drawerContent");
      const readerControls = document.getElementById("readerControls");
      const savedPageInfo = document.getElementById("savedPageInfo");
      const btnResume = document.getElementById("btnResume");

      document.getElementById("drawerTitle").textContent = item.titulo;
      content.innerHTML = "<p style='color: #888; padding: 2rem;'>Carregando leitor e camada de texto...</p>";
      drawer.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      carregarComentariosDoLivro(item.id);

      const storageKey = `triohnte_bookmark_${item.id}`;
      const savedPage = localStorage.getItem(storageKey);

      const saltarParaPagina = (pageNum) => {
        const targetElement = document.getElementById(`page-wrapper-${pageNum}`);
        if (targetElement) {
          content.scrollTop = targetElement.offsetTop - content.offsetTop;
        }
      };

      if (savedPage) {
        savedPageInfo.textContent = `Página salva: ${savedPage}`;
        readerControls.style.display = "flex";
        btnResume.onclick = () => saltarParaPagina(savedPage);
      } else {
        readerControls.style.display = "none";
      }

      try {
        const loadingTask = pdfjsLib.getDocument({ url: item.arquivo });
        const pdfDoc = await loadingTask.promise;
        content.innerHTML = "";

        for (let i = 1; i <= pdfDoc.numPages; i++) {
          const page = await pdfDoc.getPage(i);
          const viewport = page.getViewport({ scale: 1.5 });

          const pageWrapper = document.createElement('div');
          pageWrapper.className = 'page-container';
          pageWrapper.id = `page-wrapper-${i}`;
          pageWrapper.style.width = `${viewport.width}px`;
          pageWrapper.style.height = `${viewport.height}px`;

          const canvas = document.createElement('canvas');
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          const context = canvas.getContext('2d');
          await page.render({ canvasContext: context, viewport: viewport }).promise;

          const textLayerDiv = document.createElement('div');
          textLayerDiv.className = 'textLayer';
          textLayerDiv.style.width = `${viewport.width}px`;
          textLayerDiv.style.height = `${viewport.height}px`;

          pageWrapper.appendChild(canvas);
          pageWrapper.appendChild(textLayerDiv);

          const btnMarcar = document.createElement('button');
          btnMarcar.className = 'btn-marcar-pagina';
          btnMarcar.textContent = `Marcar pág. ${i}`;
          btnMarcar.onclick = () => {
            localStorage.setItem(storageKey, i);
            savedPageInfo.textContent = `Página salva: ${i}`;
            readerControls.style.display = "flex";
            alert(`Progresso salvo na página ${i}!`);
          };
          pageWrapper.appendChild(btnMarcar);
          content.appendChild(pageWrapper);

          const textContent = await page.getTextContent();
          pdfjsLib.renderTextLayer({
            textContentSource: textContent,
            container: textLayerDiv,
            viewport: viewport,
            textDivs: []
          });
        }

        if (savedPage) {
          setTimeout(() => saltarParaPagina(savedPage), 300);
        }

      } catch (error) {
        console.error("Erro ao carregar PDF:", error);
        content.innerHTML = "<p style='color: #e74c3c; padding: 2rem;'>Erro ao carregar documento.</p>";
      }
    }

    document.getElementById("closeDrawer").onclick = () => {
      document.getElementById("drawer").classList.remove("open");
      document.body.style.overflow = "auto";
      esconderMenuSelecao();
    };

    /* ===================================================== */
    /* CONTROLE DO MENU FLUTUANTE AO SELECIONAR COM MOUSE    */
    /* ===================================================== */
    const selectionMenu = document.getElementById("selectionMenu");

    function esconderMenuSelecao() {
      selectionMenu.style.display = "none";
    }

    document.addEventListener("mouseup", e => {
      const selection = window.getSelection();
      const selectedText = selection.toString().trim();

      if (selectedText.length > 0) {
        textoSelecionadoGlobal = selectedText;
        rangeSelecionadoGlobal = selection.getRangeAt(0);
        const rect = rangeSelecionadoGlobal.getBoundingClientRect();

        selectionMenu.style.display = "flex";
        selectionMenu.style.top = `${rect.bottom + window.scrollY + 8}px`;
        selectionMenu.style.left = `${rect.left + window.scrollX}px`;
      } else {
        if (!selectionMenu.contains(e.target)) {
          esconderMenuSelecao();
        }
      }
    });

    function aplicarDestaqueAmareloNaSelecao() {
      if (!rangeSelecionadoGlobal) return;
      try {
        const container = document.createElement("span");
        container.className = "marcado-amarelo";
        rangeSelecionadoGlobal.surroundContents(container);
      } catch (ex) {
        const spans = document.querySelectorAll('.textLayer span');
        spans.forEach(span => {
          if (window.getSelection().containsNode(span, true)) {
            span.classList.add('marcado-amarelo');
          }
        });
      }
    }

    document.getElementById("menuMarcarTexto").onclick = () => {
      aplicarDestaqueAmareloNaSelecao();
      salvarAcaoNoFirebase("Marcar texto", textoSelecionadoGlobal);
    };

    document.getElementById("menuComentario").onclick = () => {
      const comentario = prompt("Digite seu comentário para este trecho:");
      if (comentario) {
        aplicarDestaqueAmareloNaSelecao();
        salvarAcaoNoFirebase("Comentário", `${textoSelecionadoGlobal} - [Comentário: ${comentario}]`);
      }
    };

    document.getElementById("menuComentarioEditor").onclick = () => {
      const comentarioEditor = prompt("Digite o comentário de editor para este trecho:");
      if (comentarioEditor) {
        aplicarDestaqueAmareloNaSelecao();
        salvarAcaoNoFirebase("Comentário de editor", `${textoSelecionadoGlobal} - [Editor: ${comentarioEditor}]`);
      }
    };

    async function salvarAcaoNoFirebase(tipoAcao, conteudo) {
      esconderMenuSelecao();
      if (!usuarioLogado) {
        alert("Você precisa estar conectado para salvar anotações.");
        return;
      }

      try {
        await db.ref(`anotacoes_leitores/${livroAtualId}`).push({
          uid: usuarioLogado.uid,
          email: usuarioLogado.email,
          tipo: tipoAcao,
          conteudo: conteudo,
          data: Date.now()
        });

        await dispararEmail(tipoAcao, conteudo);
        alert(`Ação "${tipoAcao}" salva com sucesso e aviso enviado para triohnte@gmail.com!`);
      } catch (err) {
        console.error("Erro ao salvar:", err);
        alert("Erro ao salvar no banco de dados.");
      }
    }

    /* ===================================================== */
    /* COMENTÁRIOS E AVISO POR E-MAIL                        */
    /* ===================================================== */
    const btnComment = document.getElementById("btnComment");
    const commentText = document.getElementById("commentText");
    const listaComentarios = document.getElementById("listaComentarios");

    btnComment.onclick = async () => {
      if (!usuarioLogado) {
        alert("Faça login para enviar comentários.");
        return;
      }
      const texto = commentText.value.trim();
      if (!texto) {
        alert("Escreva algo no comentário.");
        return;
      }

      btnComment.disabled = true;
      try {
        await db.ref(`comentarios_gerais/${livroAtualId}`).push({
          uid: usuarioLogado.uid,
          email: usuarioLogado.email,
          texto: texto,
          data: Date.now()
        });

        await dispararEmail("Comentário Geral", texto);

        commentText.value = "";
        alert("Comentário publicado e notificação enviada para triohnte@gmail.com!");
      } catch (e) {
        console.error(e);
        alert("Erro ao enviar comentário.");
      }
      btnComment.disabled = false;
    };

    function carregarComentariosDoLivro(idLivro) {
      listaComentarios.innerHTML = "";
      db.ref(`comentarios_gerais/${idLivro}`).on("child_added", snapshot => {
        const dados = snapshot.val();
        if (!dados) return;

        const div = document.createElement("div");
        div.className = "comentario-item";
        div.innerHTML = `
          <p class="comentario-texto">${dados.texto}</p>
          <small class="comentario-meta">${dados.email} • ${new Date(dados.data).toLocaleDateString("pt-BR")}</small>
        `;
        listaComentarios.prepend(div);
      });
    }
  </script>

</body>
</html>
