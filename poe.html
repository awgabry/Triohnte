<script>
const viewport = document.getElementById('viewport');
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');
const infoCard = document.getElementById('infoCard');
const cardTitle = document.getElementById('cardTitle');
const cardDesc = document.getElementById('cardDesc');

const imgEscura = new Image();
imgEscura.src = 'tryu.png';

const imgColorida = new Image();
imgColorida.src = 'dertyh.png';

let mapsLoaded = 0;
let colorData = null;
let activeColor = null;

// 🔥 Canvas de máscara (NÃO recriar)
const maskCanvas = document.createElement('canvas');
const mCtx = maskCanvas.getContext('2d');

// Controle de visualização
let scale = 1;
let posX = 0;
let posY = 0;
let isDragging = false;
let startX, startY;

function mapLoaded() {
    mapsLoaded++;
    if (mapsLoaded === 2) initMap();
}
imgEscura.onload = mapLoaded;
imgColorida.onload = mapLoaded;

function initMap() {
    canvas.width = imgEscura.width;
    canvas.height = imgEscura.height;

    maskCanvas.width = canvas.width;
    maskCanvas.height = canvas.height;

    const hiddenCanvas = document.createElement('canvas');
    hiddenCanvas.width = canvas.width;
    hiddenCanvas.height = canvas.height;
    const hCtx = hiddenCanvas.getContext('2d');
    hCtx.drawImage(imgColorida, 0, 0);
    colorData = hCtx.getImageData(0, 0, canvas.width, canvas.height).data;

    const vRect = viewport.getBoundingClientRect();
    const scaleX = (vRect.width * 0.9) / canvas.width;
    const scaleY = (vRect.height * 0.9) / canvas.height;
    scale = Math.min(scaleX, scaleY, 1);

    posX = (vRect.width - canvas.width * scale) / 2;
    posY = (vRect.height - canvas.height * scale) / 2;

    updateCanvasPosition();
    draw();
}

function updateCanvasPosition() {
    canvas.style.width = (canvas.width * scale) + 'px';
    canvas.style.height = (canvas.height * scale) + 'px';
    canvas.style.left = posX + 'px';
    canvas.style.top = posY + 'px';
}

// 🔥 comparação com tolerância
function isSameColor(r, g, b, target, tolerance = 8) {
    return (
        Math.abs(r - target.r) <= tolerance &&
        Math.abs(g - target.g) <= tolerance &&
        Math.abs(b - target.b) <= tolerance
    );
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(imgEscura, 0, 0);

    if (!activeColor) return;

    const maskImgData = mCtx.createImageData(canvas.width, canvas.height);

    for (let i = 0; i < colorData.length; i += 4) {
        const r = colorData[i];
        const g = colorData[i + 1];
        const b = colorData[i + 2];
        const a = colorData[i + 3];

        if (a > 10 && isSameColor(r, g, b, activeColor)) {
            maskImgData.data[i] = 255;
            maskImgData.data[i + 1] = 255;
            maskImgData.data[i + 2] = 255;
            maskImgData.data[i + 3] = 255;
        }
    }

    mCtx.putImageData(maskImgData, 0, 0);

    // aplica máscara
    ctx.save();
    ctx.drawImage(maskCanvas, 0, 0);
    ctx.globalCompositeOperation = 'source-in';
    ctx.drawImage(imgColorida, 0, 0);
    ctx.restore();
}

// ZOOM
viewport.addEventListener('wheel', (e) => {
    e.preventDefault();

    const zoomIntensity = 0.1;
    const rect = viewport.getBoundingClientRect();

    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const oldScale = scale;

    scale += (e.deltaY < 0 ? zoomIntensity : -zoomIntensity);
    scale = Math.min(Math.max(scale, 0.2), 5);

    posX = mouseX - (mouseX - posX) * (scale / oldScale);
    posY = mouseY - (mouseY - posY) * (scale / oldScale);

    updateCanvasPosition();
}, { passive: false });

// DRAG
viewport.addEventListener('mousedown', (e) => {
    if (e.button === 0) {
        isDragging = true;
        startX = e.clientX - posX;
        startY = e.clientY - posY;
    }
});

window.addEventListener('mouseup', () => {
    isDragging = false;
});

window.addEventListener('mousemove', (e) => {
    if (isDragging) {
        posX = e.clientX - startX;
        posY = e.clientY - startY;
        updateCanvasPosition();
        return;
    }

    const rect = canvas.getBoundingClientRect();

    if (
        e.clientX >= rect.left &&
        e.clientX <= rect.right &&
        e.clientY >= rect.top &&
        e.clientY <= rect.bottom &&
        colorData
    ) {
        const x = Math.floor((e.clientX - rect.left) * (canvas.width / rect.width));
        const y = Math.floor((e.clientY - rect.top) * (canvas.height / rect.height));

        const idx = (y * canvas.width + x) * 4;
        const r = colorData[idx];
        const g = colorData[idx + 1];
        const b = colorData[idx + 2];
        const a = colorData[idx + 3];

        if (a > 10 && (r + g + b) > 30) {
            if (!activeColor || !isSameColor(r, g, b, activeColor)) {
                activeColor = { r, g, b };
                draw();
            }

            infoCard.style.opacity = 1;
            infoCard.style.visibility = 'visible';
            infoCard.style.left = (e.clientX + 20) + 'px';
            infoCard.style.top = (e.clientY - 20) + 'px';

            cardTitle.innerText = "Território";
            cardDesc.innerText = `RGB(${r}, ${g}, ${b})`;

            return;
        }
    }

    if (activeColor) {
        activeColor = null;
        draw();
        infoCard.style.opacity = 0;
        infoCard.style.visibility = 'hidden';
    }
});
</script>
