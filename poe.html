<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mapa - Responsivo com Brilho Dourado</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden; /* Remove barras de rolagem sob qualquer circunstância */
}

/* O viewport garante que o mapa fique perfeitamente centralizado na janela */
#viewport {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* O canvas agora se adapta dinamicamente mantendo a proporção original */
canvas {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain; 
    z-index: 2;
}

.info-card {
    position: fixed;
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 10px;
    border: 1px solid gold;
    pointer-events: none;
    opacity: 0;
    z-index: 10;
}
</style>
</head>

<body>

<div id="viewport">
    <canvas id="mapCanvas"></canvas>
</div>

<div class="info-card" id="infoCard">
    <b id="cardTitle"></b><br>
    <span id="cardDesc"></span>
</div>

<script>
// TAMANHO DA MATRIZ ORIGINAL DO MAPA
const MAP_WIDTH = 1441;
const MAP_HEIGHT = 1311;

// ELEMENTOS
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

const infoCard = document.getElementById('infoCard');
const cardTitle = document.getElementById('cardTitle');
const cardDesc = document.getElementById('cardDesc');

// IMAGENS
const imgEscura = new Image();
const imgColorida = new Image();

imgEscura.src = 'tryu.png';
imgColorida.src = 'dertyh.png';

let loaded = 0;
let colorData = null;
let activeColor = null;

imgEscura.onload = checkLoad;
imgColorida.onload = checkLoad;

function checkLoad(){
    loaded++;
    if(loaded === 2) init();
}

function init(){
    // A resolução interna do Canvas fica TRAVADA no tamanho real da imagem
    canvas.width = MAP_WIDTH;
    canvas.height = MAP_HEIGHT;

    // Canvas auxiliar em memória para ler a matriz de cores original
    const emMemoriaCanvas = document.createElement('canvas');
    emMemoriaCanvas.width = MAP_WIDTH;
    emMemoriaCanvas.height = MAP_HEIGHT;
    const emMemoriaCtx = emMemoriaCanvas.getContext('2d');
    
    emMemoriaCtx.drawImage(imgColorida, 0, 0, MAP_WIDTH, MAP_HEIGHT);
    colorData = emMemoriaCtx.getImageData(0, 0, MAP_WIDTH, MAP_HEIGHT).data;

    // Ajusta o tamanho visual do canvas na tela
    resizeCanvasDisplay();
    drawBase();
}

// Controla o tamanho de exibição CSS para caber na tela mantendo a proporção
function resizeCanvasDisplay() {
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;

    // Calcula a proporção de escala ideal (contain)
    const scale = Math.min(windowWidth / MAP_WIDTH, windowHeight / MAP_HEIGHT);

    // Define o tamanho físico que ele vai ocupar na tela do usuário
    canvas.style.width = Math.floor(MAP_WIDTH * scale) + "px";
    canvas.style.height = Math.floor(MAP_HEIGHT * scale) + "px";
}

function drawBase(){
    ctx.clearRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
    ctx.drawImage(imgEscura, 0, 0, MAP_WIDTH, MAP_HEIGHT);
}

// Comparação estrita de cor (tol = 0 garante precisão máxima de região)
function sameColor(r, g, b, tol = 0){
    return Math.abs(r - activeColor.r) <= tol &&
           Math.abs(g - activeColor.g) <= tol &&
           Math.abs(b - activeColor.b) <= tol;
}

function draw(){
    drawBase();

    if(!activeColor) return;

    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = MAP_WIDTH;
    tempCanvas.height = MAP_HEIGHT;
    const tempCtx = tempCanvas.getContext('2d');
    
    const mask = tempCtx.createImageData(MAP_WIDTH, MAP_HEIGHT);

    for(let i = 0; i < colorData.length; i += 4){
        const r = colorData[i];
        const g = colorData[i+1];
        const b = colorData[i+2];
        const a = colorData[i+3];

        if(a > 10 && sameColor(r, g, b)){
            mask.data[i] = 218;   
            mask.data[i+1] = 165; 
            mask.data[i+2] = 32;  
            mask.data[i+3] = 50; // Intensidade do preenchimento interno do brilho
        }
    }
    tempCtx.putImageData(mask, 0, 0);

    ctx.save();
    ctx.shadowColor = "rgba(255, 215, 0, 1)"; // Cor Dourada do neon
    ctx.shadowBlur = 20; // Força do efeito de desfoque/brilho
    ctx.drawImage(tempCanvas, 0, 0);
    ctx.restore();
}

// Captura e correção de coordenadas com base na escala dinâmica
canvas.addEventListener('mousemove', (e) => {
    // Pega as dimensões reais que o canvas está ocupando na tela naquele momento
    const rect = canvas.getBoundingClientRect();

    // Transforma a posição física do clique do mouse de volta para a escala matemática de 1441x1311
    const x = Math.floor((e.clientX - rect.left) * (MAP_WIDTH / rect.width));
    const y = Math.floor((e.clientY - rect.top) * (MAP_HEIGHT / rect.height));

    if(x < 0 || y < 0 || x >= MAP_WIDTH || y >= MAP_HEIGHT){
        if(activeColor){
            activeColor = null;
            drawBase();
            infoCard.style.opacity = 0;
        }
        return;
    }

    const i = (y * MAP_WIDTH + x) * 4;

    const r = colorData[i];
    const g = colorData[i+1];
    const b = colorData[i+2];
    const a = colorData[i+3];

    if(a > 10 && (r + g + b) > 20){
        if(!activeColor || activeColor.r !== r || activeColor.g !== g || activeColor.b !== b){
            activeColor = {r, g, b};
            draw();
        }

        infoCard.style.opacity = 1;
        infoCard.style.left = e.clientX + 15 + "px";
        infoCard.style.top = e.clientY + "px";

        cardTitle.innerText = "Território";
        cardDesc.innerText = `RGB(${r},${g},${b})`;
    } else {
        if(activeColor){
            activeColor = null;
            drawBase();
            infoCard.style.opacity = 0;
        }
    }
});

canvas.addEventListener('mouseleave', () => {
    if(activeColor){
        activeColor = null;
        drawBase();
        infoCard.style.opacity = 0;
    }
});

// Se o usuário mudar o tamanho da janela, reajusta as proporções instantaneamente
window.addEventListener('resize', () => {
    if(loaded === 2) {
        resizeCanvasDisplay();
    }
});

</script>

</body>
</html>
