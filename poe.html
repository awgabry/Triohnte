<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mapa</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
}

/* O viewport centraliza os mapas usando Flexbox */
#viewport {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Os canvas ocupam exatamente o mesmo espaço físico no centro */
canvas {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

/* Mapa colorido estritamente atrás */
#mapColor {
    z-index: 1;
}

/* Mapa escuro/interativo estritamente na frente */
#mapCanvas {
    z-index: 2;
}

.info-card {
    position: fixed;
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 10px;
    border: 1px solid gold;
    pointer-events: none;
    opacity: 0;
    z-index: 10;
}
</style>
</head>

<body>

<div id="viewport">
    <canvas id="mapColor"></canvas>
    <canvas id="mapCanvas"></canvas>
</div>

<div class="info-card" id="infoCard">
    <b id="cardTitle"></b><br>
    <span id="cardDesc"></span>
</div>

<script>
// ELEMENTOS
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

const colorCanvas = document.getElementById('mapColor');
const colorCtx = colorCanvas.getContext('2d');

const infoCard = document.getElementById('infoCard');
const cardTitle = document.getElementById('cardTitle');
const cardDesc = document.getElementById('cardDesc');

// IMAGENS
const imgEscura = new Image();
const imgColorida = new Image();

imgEscura.src = 'tryu.png';
imgColorida.src = 'dertyh.png';

// debug
imgEscura.onerror = () => console.log("Erro imagem escura");
imgColorida.onerror = () => console.log("Erro imagem colorida");

// estado
let loaded = 0;
let colorData = null;
let activeColor = null;

// escala / posição (baseados na tela)
let scale = 1;
let offsetX = 0;
let offsetY = 0;

// load
imgEscura.onload = checkLoad;
imgColorida.onload = checkLoad;

function checkLoad(){
    loaded++;
    if(loaded === 2) init();
}

// FIT NA TELA (Muda o tamanho real interno dos canvas de forma idêntica)
function fitToScreen(w, h){
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    // Calcula a escala ideal (contain)
    const s = Math.min(vw / w, vh / h);
    scale = s;

    // Tamanho final calculado
    const rw = Math.floor(w * s);
    const rh = Math.floor(h * s);

    // Salva o offset real em relação à janela para o cálculo do mouse de precisão
    offsetX = (vw - rw) / 2;
    offsetY = (vh - rh) / 2;

    // Redimensiona o tamanho de renderização interna (resolução pixel por pixel)
    canvas.width = rw;
    canvas.height = rh;
    colorCanvas.width = rw;
    colorCanvas.height = rh;

    // Garante que o tamanho de estilo CSS acompanhe exatamente o tamanho interno
    canvas.style.width = rw + "px";
    canvas.style.height = rh + "px";
    colorCanvas.style.width = rw + "px";
    colorCanvas.style.height = rh + "px";
}

// INIT
function init(){
    // Aplica o redimensionamento proporcional inicial
    fitToScreen(imgEscura.width, imgEscura.height);

    // Prepara o canvas colorido de fundo (com o tamanho já corrigido na tela)
    colorCtx.drawImage(imgColorida, 0, 0, colorCanvas.width, colorCanvas.height);
    colorData = colorCtx.getImageData(0, 0, colorCanvas.width, colorCanvas.height).data;

    drawBase();
}

// desenha mapa base escuro
function drawBase(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(imgEscura, 0, 0, canvas.width, canvas.height);
}

// comparação de cor (tolerância a variações suaves)
function sameColor(r, g, b, tol = 8){
    return Math.abs(r - activeColor.r) <= tol &&
           Math.abs(g - activeColor.g) <= tol &&
           Math.abs(b - activeColor.b) <= tol;
}

// Desenha o realce perfeitamente alinhado
function draw(){
    drawBase();

    if(!activeColor) return;

    const w = canvas.width;
    const h = canvas.height;

    // Cria a máscara no tamanho idêntico ao canvas visível atual
    const mask = ctx.createImageData(w, h);

    for(let i = 0; i < colorData.length; i += 4){
        const r = colorData[i];
        const g = colorData[i+1];
        const b = colorData[i+2];
        const a = colorData[i+3];

        if(a > 10 && sameColor(r, g, b)){
            mask.data[i] = 255;
            mask.data[i+1] = 255;
            mask.data[i+2] = 255;
            mask.data[i+3] = 255;
        }
    }

    ctx.putImageData(mask, 0, 0);

    // Mescla perfeitamente o recorte gerado com a imagem colorida escalada
    ctx.globalCompositeOperation = 'source-in';
    ctx.drawImage(imgColorida, 0, 0, w, h);
    ctx.globalCompositeOperation = 'source-over';
}

// Interação do mouse baseada na posição recalculada
window.addEventListener('mousemove', (e)=>{
    // Calcula a posição x e y exata baseada nos pixels atuais do canvas
    const x = Math.floor(e.clientX - offsetX);
    const y = Math.floor(e.clientY - offsetY);

    // Se o mouse estiver fora das bordas do mapa, desativa o realce
    if(x < 0 || y < 0 || x >= canvas.width || y >= canvas.height){
        if(activeColor){
            activeColor = null;
            drawBase();
            infoCard.style.opacity = 0;
        }
        return;
    }

    const i = (y * canvas.width + x) * 4;

    const r = colorData[i];
    const g = colorData[i+1];
    const b = colorData[i+2];
    const a = colorData[i+3];

    // Ignora fundos puramente transparentes ou tons extremamente escuros/pretos
    if(a > 10 && (r + g + b) > 30){
        if(!activeColor || activeColor.r !== r || activeColor.g !== g || activeColor.b !== b){
            activeColor = {r, g, b};
            draw();
        }

        infoCard.style.opacity = 1;
        infoCard.style.left = e.clientX + 15 + "px";
        infoCard.style.top = e.clientY + "px";

        cardTitle.innerText = "Território";
        cardDesc.innerText = `RGB(${r},${g},${b})`;
    } else {
        if(activeColor){
            activeColor = null;
            drawBase();
            infoCard.style.opacity = 0;
        }
    }
});

// Redimensionamento responsivo fluido
window.addEventListener('resize', ()=>{
    if(imgEscura.width) {
        fitToScreen(imgEscura.width, imgEscura.height);
        
        // Recarrega os dados de pixel do canvas de cores na escala atualizada
        colorCtx.clearRect(0, 0, colorCanvas.width, colorCanvas.height);
        colorCtx.drawImage(imgColorida, 0, 0, colorCanvas.width, colorCanvas.height);
        colorData = colorCtx.getImageData(0, 0, colorCanvas.width, colorCanvas.height).data;

        if(activeColor) draw(); else drawBase();
    }
});

</script>

</body>
</html>
