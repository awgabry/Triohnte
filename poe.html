<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Topografia</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

#viewport {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain; 
    z-index: 1;
}

/* Info-Card Repaginado e Explicativo */
.info-card {
    position: fixed;
    background: rgba(10, 10, 15, 0.95);
    color: #e0e0e0;
    padding: 15px;
    border: 1px solid #ffd700;
    border-radius: 6px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), 0 0 10px rgba(255, 215, 0, 0.2);
    pointer-events: none;
    opacity: 0;
    z-index: 10;
    min-width: 220px;
    transition: opacity 0.15s ease;
}

.info-card h3 {
    margin: 0 0 10px 0;
    color: #ffd700;
    font-size: 16px;
    border-bottom: 1px solid rgba(255, 215, 0, 0.3);
    padding-bottom: 5px;
    font-weight: 600;
}

.info-row {
    margin: 6px 0;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
}

.info-label {
    color: #888;
    font-weight: bold;
    margin-right: 15px;
}

.info-value {
    color: #fff;
    text-align: right;
}
</style>
</head>

<body>

<div id="viewport">
    <canvas id="mapColorCanvas"></canvas>
</div>

<div class="info-card" id="infoCard">
    <h3 id="cardTitle">Território</h3>
    <div class="info-row"><span class="info-label">Soberania:</span><span class="info-value" id="cardSoberania">-</span></div>
    <div class="info-row"><span class="info-label">Idade:</span><span class="info-value" id="cardIdade">-</span></div>
    <div class="info-row"><span class="info-label">Poder Militar:</span><span class="info-value" id="cardMilitar">-</span></div>
</div>

<script>
const MAP_WIDTH = 1441;
const MAP_HEIGHT = 1311;

// BANCO DE DADOS DOS TERRITÓRIOS
// Adicione aqui as cores RGB exatas do seu mapa dertyh.png e preencha a história deles!
const databaseTerritorios = {
    "42,70,3": {
        nome: "Kwazahdar",
        soberania: "Império de Veridia",
        idade: "420 anos",
        poderMilitar: "85.000 Soldados (Alta)"
    },
    "1,9,69": {
        nome: "Agaroff",
        soberania: "Dinastia Oculta",
        idade: "1.200 anos",
        poderMilitar: "12.000 Sentinelas (Média)"
    },
    "16,1,25": {
        nome: "Terras livres",
        soberania: "Soberania Desconhecida",
        idade: "Desconhecida",
        poderMilitar: "Incalculável"
    }
};

// ELEMENTOS
const canvas = document.getElementById('mapColorCanvas');
const ctx = canvas.getContext('2d');

const infoCard = document.getElementById('infoCard');
const cardTitle = document.getElementById('cardTitle');
const cardSoberania = document.getElementById('cardSoberania');
const cardIdade = document.getElementById('cardIdade');
const cardMilitar = document.getElementById('cardMilitar');

// IMAGEM
const imgColorida = new Image();
imgColorida.src = 'dertyh.png';

let colorData = null;
let activeColor = null;

imgColorida.onload = init;

function init(){
    canvas.width = MAP_WIDTH;
    canvas.height = MAP_HEIGHT;

    resizeCanvasDisplay();
    drawBase();

    colorData = ctx.getImageData(0, 0, MAP_WIDTH, MAP_HEIGHT).data;
}

function resizeCanvasDisplay() {
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    const scale = Math.min(windowWidth / MAP_WIDTH, windowHeight / MAP_HEIGHT);

    canvas.style.width = Math.floor(MAP_WIDTH * scale) + "px";
    canvas.style.height = Math.floor(MAP_HEIGHT * scale) + "px";
}

function drawBase(){
    ctx.clearRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
    ctx.drawImage(imgColorida, 0, 0, MAP_WIDTH, MAP_HEIGHT);
}

function sameColor(r, g, b, tol = 0){
    return Math.abs(r - activeColor.r) <= tol &&
           Math.abs(g - activeColor.g) <= tol &&
           Math.abs(b - activeColor.b) <= tol;
}

function draw(){
    drawBase();

    if(!activeColor) return;

    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = MAP_WIDTH;
    tempCanvas.height = MAP_HEIGHT;
    const tempCtx = tempCanvas.getContext('2d');
    
    const mask = tempCtx.createImageData(MAP_WIDTH, MAP_HEIGHT);

    for(let i = 0; i < colorData.length; i += 4){
        const r = colorData[i];
        const g = colorData[i+1];
        const b = colorData[i+2];
        const a = colorData[i+3];

        if(a > 10 && sameColor(r, g, b)){
            mask.data[i] = 255;   
            mask.data[i+1] = 215; 
            mask.data[i+2] = 0;  
            mask.data[i+3] = 90; 
        }
    }
    tempCtx.putImageData(mask, 0, 0);

    ctx.save();
    ctx.shadowColor = "rgba(255, 215, 0, 1)"; 
    ctx.shadowBlur = 25; 
    ctx.drawImage(tempCanvas, 0, 0);
    ctx.restore();
}

canvas.addEventListener('mousemove', (e) => {
    const cw = canvas.clientWidth;
    const ch = canvas.clientHeight;

    const x = Math.floor((e.offsetX / cw) * MAP_WIDTH);
    const y = Math.floor((e.offsetY / ch) * MAP_HEIGHT);

    if(x < 0 || y < 0 || x >= MAP_WIDTH || y >= MAP_HEIGHT){
        hideCard();
        return;
    }

    const i = (y * MAP_WIDTH + x) * 4;

    const r = colorData[i];
    const g = colorData[i+1];
    const b = colorData[i+2];
    const a = colorData[i+3];

    if(a > 10 && (r + g + b) > 20){
        if(!activeColor || activeColor.r !== r || activeColor.g !== g || activeColor.b !== b){
            activeColor = {r, g, b};
            draw();
        }

        // Chave de busca no formato "R,G,B"
        const corChave = `${r},${g},${b}`;
        const dadosDoTerritorio = databaseTerritorios[corChave];

        // Se encontrar a cor cadastrada, exibe os detalhes customizados. 
        // Caso contrário, mostra valores genéricos/RGB básicos.
        if (dadosDoTerritorio) {
            cardTitle.innerText = dadosDoTerritorio.nome;
            cardSoberania.innerText = dadosDoTerritorio.soberania;
            cardIdade.innerText = dadosDoTerritorio.idade;
            cardMilitar.innerText = dadosDoTerritorio.poderMilitar;
        } else {
            cardTitle.innerText = "Território Desconhecido";
            cardSoberania.innerText = "Nenhuma";
            cardIdade.innerText = "???";
            cardMilitar.innerText = `RGB(${corChave})`;
        }

        infoCard.style.opacity = 1;
        infoCard.style.left = e.clientX + 15 + "px";
        infoCard.style.top = e.clientY + "px";
    } else {
        hideCard();
    }
});

canvas.addEventListener('mouseleave', hideCard);

function hideCard() {
    if(activeColor){
        activeColor = null;
        drawBase();
        infoCard.style.opacity = 0;
    }
}

window.addEventListener('resize', () => {
    if(colorData) {
        resizeCanvasDisplay();
    }
});
</script>

</body>
</html>
