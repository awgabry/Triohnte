<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mapa - Revelar Território</title>

<style>
body {
    margin: 0;
    background: black;
}

#viewport {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: auto; 
    display: flex;
    justify-content: center;
    align-items: center;
}

.map-wrapper {
    width: 1441px;
    height: 1311px;
    position: relative;
    flex-shrink: 0;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 1441px;
    height: 1311px;
    display: block;
}

/* O mapa colorido fica visível atrás */
#mapColor {
    z-index: 1;
}

/* O mapa escuro fica na frente, mas terá pedaços "apagados" pelo mouse */
#mapCanvas {
    z-index: 2;
}

.info-card {
    position: fixed;
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 10px;
    border: 1px solid gold;
    pointer-events: none;
    opacity: 0;
    z-index: 10;
}
</style>
</head>

<body>

<div id="viewport">
    <div class="map-wrapper">
        <canvas id="mapColor"></canvas>
        <canvas id="mapCanvas"></canvas>
    </div>
</div>

<div class="info-card" id="infoCard">
    <b id="cardTitle"></b><br>
    <span id="cardDesc"></span>
</div>

<script>
const MAP_WIDTH = 1441;
const MAP_HEIGHT = 1311;

// ELEMENTOS
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

const colorCanvas = document.getElementById('mapColor');
const colorCtx = colorCanvas.getContext('2d');

const infoCard = document.getElementById('infoCard');
const cardTitle = document.getElementById('cardTitle');
const cardDesc = document.getElementById('cardDesc');

const wrapper = document.querySelector('.map-wrapper');

// IMAGENS
const imgEscura = new Image();
const imgColorida = new Image();

imgEscura.src = 'tryu.png';
imgColorida.src = 'dertyh.png';

let loaded = 0;
let colorData = null;
let activeColor = null;

imgEscura.onload = checkLoad;
imgColorida.onload = checkLoad;

function checkLoad(){
    loaded++;
    if(loaded === 2) init();
}

function init(){
    canvas.width = MAP_WIDTH;
    canvas.height = MAP_HEIGHT;

    colorCanvas.width = MAP_WIDTH;
    colorCanvas.height = MAP_HEIGHT;

    // Desenha o mapa colorido permanentemente no canvas de trás
    colorCtx.drawImage(imgColorida, 0, 0, MAP_WIDTH, MAP_HEIGHT);
    colorData = colorCtx.getImageData(0, 0, MAP_WIDTH, MAP_HEIGHT).data;

    drawBase();
}

// Redesenha o mapa escuro inteiro na frente
function drawBase(){
    ctx.clearRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
    ctx.drawImage(imgEscura, 0, 0, MAP_WIDTH, MAP_HEIGHT);
}

// Comparação de cor
function sameColor(r, g, b, tol = 8){
    return Math.abs(r - activeColor.r) <= tol &&
           Math.abs(g - activeColor.g) <= tol &&
           Math.abs(b - activeColor.b) <= tol;
}

// Transforma a região selecionada em um "buraco" transparente
function draw(){
    // 1. Recomeça com o mapa escuro inteiro
    drawBase();

    if(!activeColor) return;

    // 2. Cria uma máscara temporária na memória com a forma do território
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = MAP_WIDTH;
    tempCanvas.height = MAP_HEIGHT;
    const tempCtx = tempCanvas.getContext('2d');
    
    const mask = tempCtx.createImageData(MAP_WIDTH, MAP_HEIGHT);

    for(let i = 0; i < colorData.length; i += 4){
        const r = colorData[i];
        const g = colorData[i+1];
        const b = colorData[i+2];
        const a = colorData[i+3];

        if(a > 10 && sameColor(r, g, b)){
            mask.data[i] = 255;     // Qualquer cor serve,
            mask.data[i+1] = 255;   // pois usaremos apenas
            mask.data[i+2] = 255;   // o formato da silhueta (alfa)
            mask.data[i+3] = 255;
        }
    }
    tempCtx.putImageData(mask, 0, 0);

    // 3. Usa o modo de "Borracha" no mapa da frente
    ctx.globalCompositeOperation = 'destination-out';
    
    // 4. Apaga o formato do território do mapa escuro, revelando o fundo colorido
    ctx.drawImage(tempCanvas, 0, 0);
    
    // Restaura o modo padrão de desenho do canvas
    ctx.globalCompositeOperation = 'source-over';
}

// Mouse
window.addEventListener('mousemove', (e)=>{
    const rect = wrapper.getBoundingClientRect();
    const x = Math.floor(e.clientX - rect.left);
    const y = Math.floor(e.clientY - rect.top);

    if(x < 0 || y < 0 || x >= MAP_WIDTH || y >= MAP_HEIGHT){
        if(activeColor){
            activeColor = null;
            drawBase();
            infoCard.style.opacity = 0;
        }
        return;
    }

    const i = (y * MAP_WIDTH + x) * 4;

    const r = colorData[i];
    const g = colorData[i+1];
    const b = colorData[i+2];
    const a = colorData[i+3];

    if(a > 10 && (r + g + b) > 30){
        if(!activeColor || activeColor.r !== r || activeColor.g !== g || activeColor.b !== b){
            activeColor = {r, g, b};
            draw();
        }

        infoCard.style.opacity = 1;
        infoCard.style.left = e.clientX + 15 + "px";
        infoCard.style.top = e.clientY + "px";

        cardTitle.innerText = "Território";
        cardDesc.innerText = `RGB(${r},${g},${b})`;
    } else {
        if(activeColor){
            activeColor = null;
            drawBase();
            infoCard.style.opacity = 0;
        }
    }
});

</script>

</body>
</html>
