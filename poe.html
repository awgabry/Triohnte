    .btn-loja {

      padding: 0.55rem 1rem;
      border-radius: 12px;

      color: #d4af37;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }

    .btn-loja:hover {
      background: #1a1a1a;
      color: #fff;
      transform: translateY(-1px);
    }

    /* BOTÃO RESTRITO                 */
    /* ============================= */

    .btn-restrito {
      display: none;
      padding: 0.55rem 1rem;
      border-radius: 12px;
      background: #000;
      color: #d4af37;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;

      background: #1a1a1a;

    /* ============================= */

    .layout {
      display: flex;
      min-height: calc(100vh - 58px);
    }

    .sidebar {
      background: #000;
      padding: 1rem;
      overflow: auto;
      border-right: 1px solid #b8860b;
      width: 260px;
      flex-shrink: 0;
    }

    .main {
      display: flex;
      flex: 1;
      gap: 1.5rem;
      padding: 1rem;
      align-items: flex-start;
    }


    /* ============================= */
    /* GRADE PRINCIPAL */
    /* ============================= */

    #grade {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(280px, 1fr)

    /* CONTOS DE WALINGARDYN */

    #novelGrid {
      width: 300px;

      flex-shrink: 0;

    #novelGrid h2 {
      font-size: 1.2rem;

    /* ============================= */

    .card-book {
      background: #b8860b;

      flex-direction: column;
      border: 1px solid #d4af37;
      height: auto;
      color: #000;

    .cover {
      width: 100%;

      background: #000;
      flex-shrink: 0;

    .cover img {
      width: 100%;

      object-fit: cover;
    }

    .meta {
      padding: 1.2rem;
      flex-grow: 1;

    .meta h3 {
      margin: 0 0 0.5rem 0;

      font-family: 'Cinzel', serif;
      font-weight: 700;
    }

    .meta .author {
      color: #241800;
      font-size: 0.9rem;
      font-style: italic;
      margin-bottom: 0.8rem;
    }

    .meta .synopsis {
      font-size: 0.85rem;
      color: #1c1400;
      line-height: 1.5;
      white-space: pre-line;
    }


    /* ============================= */
    /* BOTÕES */
    /* ============================= */

    .actions {
      display: flex;
      gap: 0.8rem;
      padding: 1.2rem;
      align-items: center;

    .btn {
      padding: .5rem .8rem;

      font-size: 0.9rem;
      width: 70px;
      height: 38px;
      flex-shrink: 0;
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      filter: grayscale(1);
    }


    /* ============================= */
    /* ESTRELAS */
    /* ============================= */

    .fav[aria-pressed="true"]::before {
      content: "★";
      color: #fff;
    }

    .fav[aria-pressed="false"]::before {
      content: "☆";
    }

    .star-count {
      color: #fff;
      font-weight: 400;
      font-size: 0.75rem;
    }


    /* ============================= */
    /* COMENTÁRIOS */
    /* ============================= */

    .comment-section {
      margin-top: 2rem;
      background: #1a0901;
      padding: 1rem;
      border-radius: 12px;
    }

    .comment-section textarea {
      width: 100%;
      height: 80px;
      background: #000;
      color: #fff;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 0.5rem;
      box-sizing: border-box;
      resize: none;
    }

    .btn-comment {
      margin-top: 0.5rem;
      width: 100%;
      background: #000;
      color: #fff;
      padding: 0.6rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-comment:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #listaComentarios {
      margin-top: 1.5rem;
    }

    .comentario-item {
      border-bottom: 1px solid #333;
      padding: 12px 0;
    }

    .comentario-texto {
      font-size: 0.9rem;
      color: #e7e9ee;
      margin: 0;
      word-break: break-word;
    }

    .comentario-meta {
      color: #aab0bd;
      font-size: 0.75rem;
      display: block;
      margin-top: 6px;
    }


    /* ============================= */
    /* DRAWER */
    /* ============================= */

    .drawer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.95);
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform .2s ease;
      z-index: 50;
    }

    .drawer.open {
      transform: translateY(0);
    }

    .drawer-content {
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .drawer-content img {
      width: 100%;
      max-width: 800px;
      height: auto;
      margin-bottom: 1rem;
    }


    /* Barra do Drawer */

    #drawer .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 1rem;
      background: #b8860b;
    }

    #drawer .topbar #closeDrawer {
      position: absolute;
      left: 1rem;
    }

    #drawer .topbar #toggleSlide {
      position: absolute;
      right: 1rem;
    }

  </style>
</head>

  <!-- ============================= -->

  <div class="layout">

    <!-- CONTEÚDO -->

    <main class="main">

      <div id="novelGrid">

  </div>


  <!-- ============================= -->
  <!-- DRAWER -->
  <!-- ============================= -->

  <div
    id="drawer"
    class="drawer"
    aria-hidden="true"
  >

    <div class="topbar">

      <button
        class="btn"
        id="closeDrawer"

        Fechar
      </button>

      <h2 id="drawerTitle"></h2>

        class="btn"
        id="toggleSlide"

      </button>

    <div class="drawer-content"></div>

  </div>


  <!-- ============================= -->
  <!-- FIREBASE -->
  <!-- ============================= -->

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


  <script>

    /* ============================= */
    /* FIREBASE */
    /* ============================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyAajz5PVa79vH1FSWrC0pPrGxs0Q-9xkFk",

      authDomain:
        "triohnte-database.firebaseapp.com",

      databaseURL:
        "https://triohnte-database-default-rtdb.europe-west1.firebasedatabase.app/",

      projectId:
        "triohnte-database",

      appId:
        "1:127473963183:web:c071072d846a8d7240045a"

    };


    /* Inicializa Firebase */

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }


    const auth = firebase.auth();

    const db = firebase.database();


    /* ===================================================== */
    /* E-MAILS AUTORIZADOS PARA O BOTÃO RESTRITO             */
    /* ===================================================== */

    const emailsAutorizados = [

      "mr.gabriel04.07.02@hotmail",

      "ga7144492@gmail.com"

    ];


    /* ===================================================== */
    /* BOTÃO RESTRITO                                        */
    /* ===================================================== */

    const btnRestrito =
      document.getElementById("btnRestrito");


    function atualizarBotaoRestrito(user) {

      /*
        Por segurança, começa sempre escondido.
      */

      btnRestrito.style.display = "none";


      /*
        Se não existe usuário, não mostra.
      */

      if (!user || !user.email) {
        return;
      }


      /*
        Normaliza o e-mail para evitar
        diferença entre letras maiúsculas/minúsculas.
      */

      const email =
        user.email.trim().toLowerCase();


      /*
        Verifica se o e-mail está na lista.
      */

      const autorizado =
        emailsAutorizados.includes(email);


      /*
        Só os e-mails autorizados
        recebem o botão.
      */

      if (autorizado) {

        btnRestrito.style.display =
          "inline-block";

      }

    }


    /* ===================================================== */
    /* IMPORTANTE: MANTER A SESSÃO DO INDEX.HTML             */
    /* ===================================================== */

    let usuarioLogado = null;

    let autenticacaoVerificada = false;


    /*
      Força o Firebase a manter a sessão no navegador.

      Assim:

      index.html
          ↓
      usuário faz login
          ↓
      biblioteca.html
          ↓
      Firebase reconhece o mesmo usuário
    */

    auth.setPersistence(
      firebase.auth.Auth.Persistence.LOCAL
    )
    .then(() => {

      console.log(
        "Persistência de autenticação ativada."
      );

    })
    .catch(error => {

      console.error(
        "Erro ao configurar persistência:",
        error
      );

    });


    /* ============================= */
    /* LIVROS */
    /* ============================= */

    const livros = [

      {

        id: 2,

        titulo: "Triohnte",

        autor: "Gabryell Aweryan",

        capa: "Coloque aqui seu png",

        pasta: "Triohnte",

        totalPaginas: 3,

        prefixo: "",

        synopsis:
          "No tumultuoso mundo de Walingardyn, onde profecias antigas e guerras entre nobres definem o destino de gerações..."

      }

    ];


    /* ============================= */
    /* CONTOS */
    /* ============================= */

    const novels = [

      {

        id: 101,

        titulo: "Segredários",

        autor: "Gabryell Aweryan",

        capa: "Coloque aqui seu png",

        pasta: "S CAPS",

        totalPaginas: 1,

        prefixo: "S CAP ",

        synopsis:
          `Marco, João e Lucas vivem a rotina sem graça da Kenya Enlatados, uma pequena empresa de São Paulo que enlata legumes e sardinhas. Mas a monotonia acaba quando recebem um telefonema inesperado de Cleber F. Junior, do Amazonas: investigar um parque aquático abandonado, palco de uma tragédia que ainda assombra o local.

Aproveitando que suas férias estavam chegando, inventam um retiro espiritual para justificar a ausência, e claro, o chefe não entende nada! Munidos de curiosidade, improviso e sua van carateristicamente cômica, os Segredários partem rumo ao Amazonas.

No parque, descobrem que Cleber desapareceu misteriosamente e que a missão agora é coordenada por seu filho, Victor, que quer resolver o problema da propriedade para vendê-la. Entre mistérios, absurdos e perigos que ninguém ousaria enfrentar, Marco, João e Lucas vão aprender que segredos enterrados nem sempre ficam onde deveriam, e que a linha entre o banal e o bizarro pode ser mais fina do que imaginam.`

      }

    ];


    /* ============================= */
    /* ELEMENTOS */
    /* ============================= */

    const grade =
      document.getElementById("grade");

    const novelGrid =
      document.getElementById("novelGrid");

    const btnComment =
      document.getElementById("btnComment");

    const textarea =
      document.getElementById("commentText");

    const listaComentarios =
      document.getElementById("listaComentarios");


    /* ============================= */
    /* RENDER DOS CARDS */
    /* ============================= */

    function renderCard(
      item,
      container,
      includeFav = false
    ) {

      const card =
        document.createElement("div");

      card.className =
        "card-book";


      card.innerHTML = `

        <div class="cover">

          <img
            src="${item.capa}"
            alt="${item.titulo}"
            onerror="this.style.display='none'"
          >

        </div>


        <div class="meta">

          <h3>
            ${item.titulo}
          </h3>

          <div class="author">
            Por: ${item.autor}
          </div>

          <div class="synopsis">
            ${item.synopsis}
          </div>

        </div>


        <div class="actions">

          <button
            class="btn ler"
            data-id="${item.id}"
            disabled
          >
            🔒
          </button>


          ${
            includeFav
            ?

            `
              <button
                class="btn fav"
                aria-pressed="false"
                data-id="${item.id}"
              >

                <span
                  class="star-count"
                  id="stars-${item.id}"
                >
                  0
                </span>

              </button>
            `

            :

            ""
          }

        </div>

      `;


      container.appendChild(card);

    }


    /* Renderiza livros */

    livros.forEach(
      livro =>
        renderCard(
          livro,
          grade,
          true
        )
    );


    /* Renderiza contos */

    novels.forEach(
      conto =>
        renderCard(
          conto,
          novelGrid,
          true
        )
    );


    /* ============================= */
    /* GESTÃO DE ACESSO */
    /* ============================= */

    function atualizarPermissoesBotao(
      emailLogado
    ) {

      const permissoes =
        JSON.parse(
          localStorage.getItem(
            "sw_permissoes"
          )
        ) || [];


      const botoesLer =
        document.querySelectorAll(
          ".btn.ler"
        );


      botoesLer.forEach(botao => {

        const idDoLivro =
          botao.getAttribute(
            "data-id"
          );


        const temAcesso =
          permissoes.some(p => {

            if (
              !p.email ||
              p.bookId === undefined
            ) {
              return false;
            }


            return (

              p.email
                .toLowerCase()
                ===
              emailLogado
                .toLowerCase()

              &&

              p.bookId.toString()
                ===
              idDoLivro.toString()

            );

          });


        if (temAcesso) {

          botao.disabled = false;

          botao.innerText =
            "Ler";

        }

        else {

          botao.disabled = true;

          botao.innerText =
            "🔒";

        }

      });

    }


    /* ===================================================== */
    /* AUTENTICAÇÃO                                           */
    /* ===================================================== */

    auth.onAuthStateChanged(
      user => {

        autenticacaoVerificada = true;

        usuarioLogado = user;


        console.log(
          "Estado de autenticação:",
          user
            ? user.email
            : "nenhum usuário"
        );


        /* ================================================= */
        /* ATUALIZA BOTÃO RESTRITO                            */
        /* ================================================= */

        atualizarBotaoRestrito(user);


        /* ===================================== */
        /* USUÁRIO ESTÁ LOGADO                   */
        /* ===================================== */

        if (
          user &&
          user.email
        ) {

          console.log(
            "Usuário reconhecido na Biblioteca:",
            user.email
          );


          /* Libera comentários */

          btnComment.disabled = false;

          btnComment.innerText =
            "Enviar";


          /* Atualiza permissões */

          atualizarPermissoesBotao(
            user.email
          );

        }


        /* ===================================== */
        /* USUÁRIO NÃO ESTÁ LOGADO               */
        /* ===================================== */

        else {

          console.log(
            "Nenhum usuário autenticado."
          );


          btnComment.disabled = false;

          btnComment.innerText =
            "Entrar para comentar";


          /*
            Os livros continuam aparecendo.

            Apenas comentários exigem login.
          */

          document
            .querySelectorAll(".btn.ler")
            .forEach(botao => {

              botao.disabled = true;

              botao.innerText =
                "🔒";

            });

        }

      }
    );


    /* ===================================================== */
    /* EVENTOS DE CLIQUE                                      */
    /* ===================================================== */

    document.body.addEventListener(
      "click",
      e => {


        /* ============================= */
        /* BOTÃO LER */
        /* ============================= */

        const btnLer =
          e.target.closest(
            ".ler"
          );


        if (
          btnLer &&
          !btnLer.disabled
        ) {

          const id =
            btnLer.dataset.id;


          const item =
            [
              ...livros,
              ...novels
            ].find(
              x =>
                x.id == id
            );


          if (item) {

            openDrawer(item);

          }


          return;

        }


        /* ============================= */
        /* FAVORITOS */
        /* ============================= */

        const btnFav =
          e.target.closest(
            ".fav"
          );


        if (btnFav) {

          const id =
            btnFav.dataset.id;


          /*
            Evita clicar repetidamente
            no mesmo botão.
          */

          if (
            btnFav.getAttribute(
              "aria-pressed"
            ) === "true"
          ) {

            return;

          }


          btnFav.setAttribute(
            "aria-pressed",
            "true"
          );


          db.ref(
            "estrelas/" + id
          )
          .transaction(
            valor =>
              (valor || 0) + 1
          )
          .catch(error => {

            console.error(
              "Erro ao registrar estrela:",
              error
            );

          });

        }

      }
    );


    /* ============================= */
    /* ABRIR LIVRO */
    /* ============================= */

    function openDrawer(item) {

      const drawer =
        document.getElementById(
          "drawer"
        );


      const content =
        document.querySelector(
          ".drawer-content"
        );


      document.getElementById(
        "drawerTitle"
      ).textContent =
        item.titulo;


      content.innerHTML = "";


      for (
        let i = 1;
        i <= item.totalPaginas;
        i++
      ) {

        const img =
          document.createElement(
            "img"
          );


        img.src =
          `${item.pasta}/${item.prefixo}${i}.png`;


        img.alt =
          `${item.titulo} - página ${i}`;


        content.appendChild(
          img
        );

      }


      drawer.classList.add(
        "open"
      );


      drawer.setAttribute(
        "aria-hidden",
        "false"
      );


      document.body.style.overflow =
        "hidden";

    }


    /* ============================= */
    /* FECHAR LIVRO */
    /* ============================= */

    document.getElementById(
      "closeDrawer"
    ).onclick = () => {

      const drawer =
        document.getElementById(
          "drawer"
        );


      drawer.classList.remove(
        "open"
      );


      drawer.setAttribute(
        "aria-hidden",
        "true"
      );


      document.body.style.overflow =
        "auto";

    };


    /* ===================================================== */
    /* COMENTÁRIOS                                            */
    /* ===================================================== */

    btnComment.onclick = async () => {


      /* ================================= */
      /* GARANTE QUE O FIREBASE TERMINOU   */
      /* DE VERIFICAR A SESSÃO             */
      /* ================================= */

      if (!autenticacaoVerificada) {

        alert(
          "Aguarde. Estamos verificando seu login..."
        );

        return;

      }


      /* ================================= */
      /* VERIFICA USUÁRIO                  */
      /* ================================= */

      const user =
        usuarioLogado ||
        auth.currentUser;


      if (!user) {

        alert(
          "Você precisa estar conectado para comentar."
        );

        return;

      }


      /* ================================= */
      /* VERIFICA TEXTO                    */
      /* ================================= */

      const texto =
        textarea.value.trim();


      if (!texto) {

        alert(
          "Escreva um comentário antes de enviar."
        );

        return;

      }


      /* ================================= */
      /* DESABILITA BOTÃO                  */
      /* ================================= */

      btnComment.disabled = true;

      btnComment.innerText =
        "Enviando...";


      try {


        /* ================================= */
        /* BUSCA DADOS DO USUÁRIO             */
        /* ================================= */

        const snapshot =
          await db.ref(
            `usuarios/${user.uid}`
          ).once("value");


        const dados =
          snapshot.val() || {};


        const nome =
          dados.nome ||
          user.displayName ||
          user.email.split("@")[0];


        const pais =
          dados.pais ||
          "Walingardyn";


        /* ================================= */
        /* CRIA COMENTÁRIO                    */
        /* ================================= */

        await db.ref(
          "comentarios"
        ).push({

          uid:
            user.uid,

          email:
            user.email,

          nome:
            nome,

          texto:
            texto,

          data:
            Date.now(),

          pais:
            `- de ${nome} (${pais})`

        });


        /* ================================= */
        /* LIMPA CAMPO                        */
        /* ================================= */

        textarea.value = "";


        alert(
          "Comentário publicado com sucesso."
        );

      }

      catch (error) {

        console.error(
          "Erro ao publicar comentário:",
          error
        );


        /*
          Agora o erro real aparece.
          Isso é importante para descobrir
          se são as Rules do Firebase.
        */

        if (
          error.code ===
          "PERMISSION_DENIED"
        ) {

          alert(
            "O Firebase recusou o comentário. Verifique as regras do Realtime Database."
          );

        }

        else {

          alert(
            "Não foi possível publicar o comentário.\n\nErro: " +
            error.message
          );

        }

      }


      /* ================================= */
      /* RESTAURA BOTÃO                     */
      /* ================================= */

      btnComment.disabled = false;

      btnComment.innerText =
        "Enviar";

    };


    /* ===================================================== */
    /* CARREGAR COMENTÁRIOS                                  */
    /* ===================================================== */

    db.ref(
      "comentarios"
    )
    .on(
      "child_added",
      snapshot => {

        const dados =
          snapshot.val();


        if (!dados) {
          return;
        }


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "comentario-item";


        /*
          NÃO usamos innerHTML para o texto
          do usuário.

          Isso evita que alguém publique
          HTML/JavaScript dentro do comentário.
        */

        const p =
          document.createElement(
            "p"
          );


        p.className =
          "comentario-texto";


        p.textContent =
          dados.texto || "";


        const small =
          document.createElement(
            "small"
          );


        small.className =
          "comentario-meta";


        const dataFormatada =
          dados.data
            ? new Date(
                dados.data
              ).toLocaleDateString(
                "pt-BR"
              )
            : "";


        small.textContent =
          `${dados.pais || "Walingardyn"} • ${dataFormatada}`;


        div.appendChild(
          p
        );


        div.appendChild(
          small
        );


        listaComentarios.prepend(
          div
        );

      },

      error => {

        console.error(
          "Erro ao carregar comentários:",
          error
        );

      }
    );


    /* ===================================================== */
    /* ESTRELAS                                               */
    /* ===================================================== */

    [
      ...livros,
      ...novels
    ].forEach(
      item => {

        db.ref(
          "estrelas/" + item.id
        )
        .on(
          "value",
          snap => {

            const el =
              document.getElementById(
                "stars-" + item.id
              );


            if (el) {

              el.textContent =
                snap.val() || 0;

            }

          }
        );

      }
    );

  </script>

</body>

</html>
