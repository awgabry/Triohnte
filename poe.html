<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mapa - Brilho Dourado</title>

<style>
body {
    margin: 0;
    background: black;
}

#viewport {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: auto; 
    display: flex;
    justify-content: center;
    align-items: center;
}

.map-wrapper {
    width: 1441px;
    height: 1311px;
    position: relative;
    flex-shrink: 0;
}

/* Agora temos apenas um único canvas visível na tela */
canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 1441px;
    height: 1311px;
    display: block;
    z-index: 2;
}

.info-card {
    position: fixed;
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 10px;
    border: 1px solid gold;
    pointer-events: none;
    opacity: 0;
    z-index: 10;
}
</style>
</head>

<body>

<div id="viewport">
    <div class="map-wrapper">
        <canvas id="mapCanvas"></canvas>
    </div>
</div>

<div class="info-card" id="infoCard">
    <b id="cardTitle"></b><br>
    <span id="cardDesc"></span>
</div>

<script>
const MAP_WIDTH = 1441;
const MAP_HEIGHT = 1311;

// ELEMENTOS
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

const infoCard = document.getElementById('infoCard');
const cardTitle = document.getElementById('cardTitle');
const cardDesc = document.getElementById('cardDesc');

const wrapper = document.querySelector('.map-wrapper');

// IMAGENS
const imgEscura = new Image();
const imgColorida = new Image(); // Mantida apenas na memória para ler os mapas de cores

imgEscura.src = 'tryu.png';
imgColorida.src = 'dertyh.png';

let loaded = 0;
let colorData = null;
let activeColor = null;

imgEscura.onload = checkLoad;
imgColorida.onload = checkLoad;

function checkLoad(){
    loaded++;
    if(loaded === 2) init();
}

function init(){
    canvas.width = MAP_WIDTH;
    canvas.height = MAP_HEIGHT;

    // Criamos um canvas invisível apenas na memória para extrair os dados RGB
    const emMemoriaCanvas = document.createElement('canvas');
    emMemoriaCanvas.width = MAP_WIDTH;
    emMemoriaCanvas.height = MAP_HEIGHT;
    const emMemoriaCtx = emMemoriaCanvas.getContext('2d');
    
    emMemoriaCtx.drawImage(imgColorida, 0, 0, MAP_WIDTH, MAP_HEIGHT);
    colorData = emMemoriaCtx.getImageData(0, 0, MAP_WIDTH, MAP_HEIGHT).data;

    drawBase();
}

// Desenha o mapa normal (escuro)
function drawBase(){
    ctx.clearRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
    ctx.drawImage(imgEscura, 0, 0, MAP_WIDTH, MAP_HEIGHT);
}

// Comparação de cor
function sameColor(r, g, b, tol = 8){
    return Math.abs(r - activeColor.r) <= tol &&
           Math.abs(g - activeColor.g) <= tol &&
           Math.abs(b - activeColor.b) <= tol;
}

// Desenha a silhueta do território aplicando o efeito de brilho neon dourado
function draw(){
    drawBase();

    if(!activeColor) return;

    // 1. Cria uma máscara na memória contendo apenas a forma daquele território
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = MAP_WIDTH;
    tempCanvas.height = MAP_HEIGHT;
    const tempCtx = tempCanvas.getContext('2d');
    
    const mask = tempCtx.createImageData(MAP_WIDTH, MAP_HEIGHT);

    for(let i = 0; i < colorData.length; i += 4){
        const r = colorData[i];
        const g = colorData[i+1];
        const b = colorData[i+2];
        const a = colorData[i+3];

        if(a > 10 && sameColor(r, g, b)){
            // Preenchemos com uma cor base sólida (dourado semi-transparente para o miolo)
            mask.data[i] = 218;   
            mask.data[i+1] = 165; 
            mask.data[i+2] = 32;  
            mask.data[i+3] = 40;  // Opacidade baixa no miolo para não cobrir totalmente os detalhes
        }
    }
    tempCtx.putImageData(mask, 0, 0);

    // 2. Configura os filtros de sombra do canvas principal para simular o "glow" (brilho)
    ctx.save(); // Salva o estado atual do canvas
    ctx.shadowColor = "rgba(255, 215, 0, 1)"; // Cor do brilho: Ouro puro (Gold)
    ctx.shadowBlur = 20;                      // Intensidade/tamanho da aura do brilho

    // 3. Desenha a forma do território por cima. O Canvas criará a aura dourada nas bordas automaticamente.
    ctx.drawImage(tempCanvas, 0, 0);
    
    // Desenha também uma linha fina de contorno dourado para dar acabamento ao contorno
    ctx.globalCompositeOperation = 'source-over';
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(255, 225, 100, 0.8)";
    
    // Restaura as configurações normais do canvas para que o brilho não afete as próximas renderizações
    ctx.restore();
}

// Mouse
window.addEventListener('mousemove', (e)=>{
    const rect = wrapper.getBoundingClientRect();
    const x = Math.floor(e.clientX - rect.left);
    const y = Math.floor(e.clientY - rect.top);

    if(x < 0 || y < 0 || x >= MAP_WIDTH || y >= MAP_HEIGHT){
        if(activeColor){
            activeColor = null;
            drawBase();
            infoCard.style.opacity = 0;
        }
        return;
    }

    const i = (y * MAP_WIDTH + x) * 4;

    const r = colorData[i];
    const g = colorData[i+1];
    const b = colorData[i+2];
    const a = colorData[i+3];

    if(a > 10 && (r + g + b) > 30){
        if(!activeColor || activeColor.r !== r || activeColor.g !== g || activeColor.b !== b){
            activeColor = {r, g, b};
            draw();
        }

        infoCard.style.opacity = 1;
        infoCard.style.left = e.clientX + 15 + "px";
        infoCard.style.top = e.clientY + "px";

        cardTitle.innerText = "Território";
        cardDesc.innerText = `RGB(${r},${g},${b})`;
    } else {
        if(activeColor){
            activeColor = null;
            drawBase();
            infoCard.style.opacity = 0;
        }
    }
});

</script>

</body>
</html>
