<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contorno de Triohnte</title>

    <link rel="icon" type="image/png" href="mu.png">
    
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        .map-viewport {
            width: 85vw;
            height: 85vh;
            border: 1px solid #333;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            cursor: grab;
            background-color: #000;
        }

        .map-viewport:active {
            cursor: grabbing;
        }

        /* O Canvas conterá a renderização visual e responderá ao Zoom/Pan */
        #mapCanvas {
            position: absolute;
            transform-origin: center center;
            transition: transform 0.05s ease-out;
        }

        /* Card flutuante lateral */
        .info-card {
            position: absolute;
            background-color: rgba(10, 10, 10, 0.95);
            color: #fff;
            border: 1px solid #d4af37;
            padding: 12px 18px;
            border-radius: 6px;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
            z-index: 1000;
            min-width: 180px;
        }

        .info-card h4 {
            margin: 0 0 5px 0;
            color: #d4af37;
            letter-spacing: 1px;
        }
        
        .info-card p {
            margin: 0;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="map-viewport" id="viewport">
        <canvas id="mapCanvas"></canvas>
    </div>

    <div class="info-card" id="infoCard">
        <h4 id="cardTitle">Território</h4>
        <p id="cardDesc">Região selecionada.</p>
    </div>

    <script>
        const viewport = document.getElementById('viewport');
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const infoCard = document.getElementById('infoCard');
        const cardTitle = document.getElementById('cardTitle');
        const cardDesc = document.getElementById('cardDesc');

        // Carrega as duas versões do mapa
        const imgEscura = new Image();
        imgEscura.src = 'tryu.png';

        const imgColorida = new Image();
        imgColorida.src = 'dertyh.png';

        let mapsLoaded = 0;
        function mapLoaded() {
            mapsLoaded++;
            if (mapsLoaded === 2) {
                initMap();
            }
        }
        imgEscura.onload = mapLoaded;
        imgColorida.onload = mapLoaded;

        // Variáveis de controle de visualização (Zoom e Pan)
        let scale = 1;
        const minScale = 1;
        const maxScale = 5;
        let isDragging = false;
        let startX, startY, posX = 0, posY = 0;
        
        // Dados de pixel das imagens para detecção de cor
        let colorData = null;
        let activeColor = null;

        function initMap() {
            // Ajusta o tamanho do canvas baseado nas dimensões da imagem original
            canvas.width = imgEscura.width;
            canvas.height = imgEscura.height;
            
            // Desenha o estado inicial (tudo escuro)
            ctx.drawImage(imgEscura, 0, 0);

            // Cria um canvas oculto para mapear os pixels coloridos da dertyh.png
            const hiddenCanvas = document.createElement('canvas');
            hiddenCanvas.width = canvas.width;
            hiddenCanvas.height = canvas.height;
            const hCtx = hiddenCanvas.getContext('2d');
            hCtx.drawImage(imgColorida, 0, 0);
            colorData = hCtx.getImageData(0, 0, canvas.width, canvas.height).data;

            // Centraliza o canvas inicialmente dentro do viewport
            resetPosition();
        }

        function resetPosition() {
            const vRect = viewport.getBoundingClientRect();
            // Escala para caber no viewport mantendo proporções
            const scaleX = (vRect.width * 0.9) / canvas.width;
            const scaleY = (vRect.height * 0.9) / canvas.height;
            scale = Math.min(scaleX, scaleY, 1);
            
            posX = (vRect.width - canvas.width * scale) / 2;
            posY = (vRect.height - canvas.height * scale) / 2;
            updateTransform();
            draw();
        }

        // --- RENDERIZAÇÃO DO MAPA (ESCURA + ACENDIMENTO + BORDA GLOW) ---
        function draw() {
            if (mapsLoaded < 2) return;

            // Limpa o canvas principal
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Desenha a base escura completa
            ctx.drawImage(imgEscura, 0, 0);

            // 2. Se houver uma região selecionada pelo mouse, isola e acende ela
            if (activeColor) {
                ctx.save();
                
                // Cria uma máscara contendo apenas os pixels da cor ativa
                const maskCanvas = document.createElement('canvas');
                maskCanvas.width = canvas.width;
                maskCanvas.height = canvas.height;
                const mCtx = maskCanvas.getContext('2d');
                
                const maskImgData = mCtx.createImageData(canvas.width, canvas.height);
                for (let i = 0; i < colorData.length; i += 4) {
                    const r = colorData[i];
                    const g = colorData[i+1];
                    const b = colorData[i+2];
                    const a = colorData[i+3];

                    if (a > 10 && r === activeColor.r && g === activeColor.g && b === activeColor.b) {
                        maskImgData.data[i] = 255;
                        maskImgData.data[i+1] = 255;
                        maskImgData.data[i+2] = 255;
                        maskImgData.data[i+3] = 255;
                    }
                }
                mCtx.putImageData(maskImgData, 0, 0);

                // Recorta o canvas usando a máscara gerada
                ctx.beginPath();
                ctx.drawImage(maskCanvas, 0, 0);
                ctx.globalCompositeOperation = 'source-in';
                
                // Desenha a imagem colorida apenas por cima da área mascarada
                ctx.drawImage(imgColorida, 0, 0);
                ctx.restore();

                // 3. Desenha a borda dourada luminosa (Glow) ao redor do pedaço ativo
                ctx.save();
                ctx.shadowColor = "rgba(212, 175, 55, 1)"; // Dourado
                ctx.shadowBlur = 15;                       // Intensidade do brilho
                ctx.strokeStyle = "rgba(212, 175, 55, 0.9)";
                ctx.lineWidth = 3;
                
                // Desenha o contorno baseado na silhueta da máscara
                ctx.globalCompositeOperation = 'source-over';
                ctx.drawImage(maskCanvas, 0, 0);
                // Executa um stroke sutil no contorno do canvas de máscara
                ctx.stroke(); 
                ctx.restore();
            }
        }

        // --- CONTROLE DE LUPA (ZOOM COM A RODA DO MOUSE) ---
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.05;
            if (e.deltaY < 0) {
                scale = Math.min(maxScale, scale + zoomIntensity);
            } else {
                scale = Math.max(minScale, scale - zoomIntensity);
            }
            updateTransform();
        });

        // --- CONTROLE DE ARRASTAR (PAN) ---
        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - posX;
            startY = e.clientY - posY;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // --- RASTREAMENTO DO CURSOR EM CIMA DO CANVAS ---
        window.addEventListener('mousemove', (e) => {
            const vRect = viewport.getBoundingClientRect();
            
            if (isDragging) {
                posX = e.clientX - startX;
                posY = e.clientY - startY;
                updateTransform();
            }

            // Verifica se o mouse está na área do viewport
            if (e.clientX >= vRect.left && e.clientX <= vRect.right && e.clientY >= vRect.top && e.clientY <= vRect.bottom && colorData) {
                
                // Converte a coordenada do mouse na tela para a coordenada interna do Canvas levando em conta Zoom e Pan
                const canvasRect = canvas.getBoundingClientRect();
                const xCanvas = Math.floor((e.clientX - canvasRect.left) * (canvas.width / canvasRect.width));
                const yCanvas = Math.floor((e.clientY - canvasRect.top) * (canvas.height / canvasRect.height));

                if (xCanvas >= 0 && xCanvas < canvas.width && yCanvas >= 0 && yCanvas < canvas.height) {
                    const pixelIndex = (yCanvas * canvas.width + xCanvas) * 4;
                    const r = colorData[pixelIndex];
                    const g = colorData[pixelIndex+1];
                    const b = colorData[pixelIndex+2];
                    const a = colorData[pixelIndex+3];

                    // Ignora pixels transparentes ou brancos de fundo puro
                    if (a > 10 && !(r === 255 && g === 255 && b === 255) && !(r === 0 && g === 0 && b === 0)) {
                        if (!activeColor || activeColor.r !== r || activeColor.g !== g || activeColor.b !== b) {
                            activeColor = { r, g, b };
                            draw(); // Redesenha aplicando cor e contorno
                        }
                        
                        // Atualiza e posiciona o Card ao lado, nunca em cima
                        infoCard.style.opacity = 1;
                        infoCard.style.visibility = 'visible';
                        infoCard.style.left = (e.clientX + 25) + 'px';
                        infoCard.style.top = (e.clientY - 30) + 'px';
                        
                        // Define o título dinâmico com base na cor identificada (ID do Território)
                        cardTitle.innerText = `Região #${r}${g}${b}`;
                        cardDesc.innerText = "Território integrado ao ecossistema mapeado.";
                        return;
                    }
                }
            }

            // Se sair de cima de uma região válida, limpa os efeitos
            if (activeColor) {
                activeColor = null;
                draw();
                infoCard.style.opacity = 0;
                infoCard.style.visibility = 'hidden';
            }
        });

        function updateTransform() {
            // Aplica movimentação e aproximação mantendo o Canvas fluido
            canvas.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
        }
    </script>

</body>
</html>
