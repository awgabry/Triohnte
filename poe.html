<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mapa - Alinhamento Perfeito de Telas</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden; /* Evita qualquer barra de rolagem */
}

#viewport {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Ambos os canvas vão compartilhar exatamente o mesmo comportamento e posição */
canvas {
    position: absolute;
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain; 
}

/* O mapa de seleção (colorido) fica embaixo */
#mapColor {
    z-index: 1;
}

/* O mapa normal (escuro) fica perfeitamente acima */
#mapCanvas {
    z-index: 2;
}

.info-card {
    position: fixed;
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 10px;
    border: 1px solid gold;
    pointer-events: none;
    opacity: 0;
    z-index: 10;
}
</style>
</head>

<body>

<div id="viewport">
    <canvas id="mapColor"></canvas>
    <canvas id="mapCanvas"></canvas>
</div>

<div class="info-card" id="infoCard">
    <b id="cardTitle"></b><br>
    <span id="cardDesc"></span>
</div>

<script>
// DIMENSÕES BASE DA MATRIZ ORIGINAL (1441 x 1311)
const MAP_WIDTH = 1441;
const MAP_HEIGHT = 1311;

// ELEMENTOS DO MAPA NORMAL (CIMA)
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

// ELEMENTOS DO MAPA DE SELEÇÃO (BAIXO)
const colorCanvas = document.getElementById('mapColor');
const colorCtx = colorCanvas.getContext('2d');

const infoCard = document.getElementById('infoCard');
const cardTitle = document.getElementById('cardTitle');
const cardDesc = document.getElementById('cardDesc');

// IMAGENS

const imgColorida = new Image();


imgColorida.src = 'dertyh.png';

let loaded = 0;
let colorData = null;
let activeColor = null;

imgEscura.onload = checkLoad;
imgColorida.onload = checkLoad;

function checkLoad(){
    loaded++;
    if(loaded === 2) init();
}

function init(){
    // Força a resolução interna de pixels a ser IDÊNTICA em ambos
    canvas.width = MAP_WIDTH;
    canvas.height = MAP_HEIGHT;

    colorCanvas.width = MAP_WIDTH;
    colorCanvas.height = MAP_HEIGHT;

    // Ajusta o tamanho de exibição CSS na tela para ambos
    resizeBothCanvas();

    // Desenha o mapa de seleção no fundo
    colorCtx.drawImage(imgColorida, 0, 0, MAP_WIDTH, MAP_HEIGHT);
    // Extrai os dados para o mouse ler
    colorData = colorCtx.getImageData(0, 0, MAP_WIDTH, MAP_HEIGHT).data;

    // Desenha o mapa normal na frente
    drawBase();
}

// Redimensiona e alinha milimetricamente os dois mapas com as mesmas dimensões
function resizeBothCanvas() {
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    
    // Calcula a escala "contain" ideal para a tela atual
    const scale = Math.min(windowWidth / MAP_WIDTH, windowHeight / MAP_HEIGHT);

    const finalWidth = Math.floor(MAP_WIDTH * scale) + "px";
    const finalHeight = Math.floor(MAP_HEIGHT * scale) + "px";

    // Aplica exatamente a mesma largura/altura CSS no mapa de cima
    canvas.style.width = finalWidth;
    canvas.style.height = finalHeight;

    // Aplica exatamente a mesma largura/altura CSS no mapa de baixo
    colorCanvas.style.width = finalWidth;
    colorCanvas.style.height = finalHeight;
}

function drawBase(){
    ctx.clearRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
    ctx.drawImage(imgEscura, 0, 0, MAP_WIDTH, MAP_HEIGHT);
}

function sameColor(r, g, b, tol = 0){
    return Math.abs(r - activeColor.r) <= tol &&
           Math.abs(g - activeColor.g) <= tol &&
           Math.abs(b - activeColor.b) <= tol;
}

function draw(){
    drawBase();

    if(!activeColor) return;

    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = MAP_WIDTH;
    tempCanvas.height = MAP_HEIGHT;
    const tempCtx = tempCanvas.getContext('2d');
    
    const mask = tempCtx.createImageData(MAP_WIDTH, MAP_HEIGHT);

    for(let i = 0; i < colorData.length; i += 4){
        const r = colorData[i];
        const g = colorData[i+1];
        const b = colorData[i+2];
        const a = colorData[i+3];

        if(a > 10 && sameColor(r, g, b)){
            mask.data[i] = 218;   
            mask.data[i+1] = 165; 
            mask.data[i+2] = 32;  
            mask.data[i+3] = 50; 
        }
    }
    tempCtx.putImageData(mask, 0, 0);

    ctx.save();
    ctx.shadowColor = "rgba(255, 215, 0, 1)"; 
    ctx.shadowBlur = 20; 
    ctx.drawImage(tempCanvas, 0, 0);
    ctx.restore();
}

// O mouse escuta no mapa de cima, mapeando os pixels com precisão perfeita
canvas.addEventListener('mousemove', (e) => {
    const cw = canvas.clientWidth;
    const ch = canvas.clientHeight;

    const x = Math.floor((e.offsetX / cw) * MAP_WIDTH);
    const y = Math.floor((e.offsetY / ch) * MAP_HEIGHT);

    if(x < 0 || y < 0 || x >= MAP_WIDTH || y >= MAP_HEIGHT){
        if(activeColor){
            activeColor = null;
            drawBase();
            infoCard.style.opacity = 0;
        }
        return;
    }

    const i = (y * MAP_WIDTH + x) * 4;

    const r = colorData[i];
    const g = colorData[i+1];
    const b = colorData[i+2];
    const a = colorData[i+3];

    if(a > 10 && (r + g + b) > 20){
        if(!activeColor || activeColor.r !== r || activeColor.g !== g || activeColor.b !== b){
            activeColor = {r, g, b};
            draw();
        }

        infoCard.style.opacity = 1;
        infoCard.style.left = e.clientX + 15 + "px";
        infoCard.style.top = e.clientY + "px";

        cardTitle.innerText = "Território";
        cardDesc.innerText = `RGB(${r},${g},${b})`;
    } else {
        if(activeColor){
            activeColor = null;
            drawBase();
            infoCard.style.opacity = 0;
        }
    }
});

canvas.addEventListener('mouseleave', () => {
    if(activeColor){
        activeColor = null;
        drawBase();
        infoCard.style.opacity = 0;
    }
});

window.addEventListener('resize', () => {
    if(loaded === 2) {
        resizeBothCanvas();
    }
});

</script>

</body>
</html>
