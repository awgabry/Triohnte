<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contorno de Triohnte</title>

    <link rel="icon" type="image/png" href="mu.png">
    
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        /* Área visível do mapa */
        .map-viewport {
            width: 90vw;
            height: 85vh;
            border: 1px solid #333;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            cursor: grab;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .map-viewport:active {
            cursor: grabbing;
        }

        /* Grupo do mapa que sofre o Zoom e Pan */
        .map-wrapper {
            transform-origin: center center;
            transition: transform 0.05s ease-out;
            display: inline-block;
        }

        /* O SVG que organiza o mapa e as imagens */
        svg {
            display: block;
            max-width: 100%;
            max-height: 80vh;
            height: auto;
        }

        /* Configuração de cada região/pedaço do mapa */
        .region {
            cursor: pointer;
            fill: transparent;         /* Invisível por padrão (mostra o fundo preto) */
            stroke: transparent;       /* Sem borda por padrão */
            transition: fill 0.2s ease, stroke 0.2s ease, filter 0.2s ease;
        }

        /* EFEITO AO PASSAR O MOUSE: Revela a cor e adiciona a borda dourada luminosa */
        .region:hover {
            fill: url(#pattern-color);  /* Revela o pedaço da imagem colorida dertyh.png */
            stroke: #d4af37;            /* Cor da borda: Dourado */
            stroke-width: 3px;          /* Espessura da borda */
            stroke-linejoin: round;
            filter: drop-shadow(0px 0px 8px rgba(212, 175, 55, 0.8)); /* Brilho luminoso dourado */
        }

        /* Card flutuante lateral */
        .info-card {
            position: absolute;
            background-color: rgba(10, 10, 10, 0.95);
            color: #fff;
            border: 1px solid #d4af37;
            padding: 12px 18px;
            border-radius: 6px;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s ease, visibility 0.15s ease;
            z-index: 1000;
            min-width: 180px;
        }

        .info-card h4 {
            margin: 0 0 5px 0;
            color: #d4af37;
            letter-spacing: 1px;
        }
        
        .info-card p {
            margin: 0;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="map-viewport" id="viewport">
        <div class="map-wrapper" id="mapWrapper">
            
            <svg viewBox="0 0 1000 1000" width="1000" height="1000" id="mapSvg">
                <defs>
                    <pattern id="pattern-dark" width="1000" height="1000" patternUnits="userSpaceOnUse">
                        <image href="tryu.png" width="1000" height="1000" />
                    </pattern>
                    <pattern id="pattern-color" width="1000" height="1000" patternUnits="userSpaceOnUse">
                        <image href="dertyh.png" width="1000" height="1000" />
                    </pattern>
                </defs>

                <rect width="1000" height="1000" fill="url(#pattern-dark)" pointer-events="none" />

                <path class="region" data-name="Região Noroeste" data-desc="Território de relevo acidentado e fronteiras fortificadas." 
                      d="M 50,150 L 300,150 L 250,400 L 50,300 Z" />
                      
                <path class="region" data-name="Região Central" data-desc="O coração geopolítico do ecossistema mapeado." 
                      d="M 300,150 L 600,200 L 550,550 L 250,400 Z" />
                      
                <path class="region" data-name="Território Oriental" data-desc="Planícies dominadas pelas forças costeiras." 
                      d="M 600,200 L 950,250 L 850,700 L 550,550 Z" />

                <path class="region" data-name="Província do Sul" data-desc="Vastidão de terras áridas e caminhos sinuosos." 
                      d="M 250,400 L 550,550 L 600,900 L 350,850 Z" />
            </svg>

        </div>
    </div>

    <div class="info-card" id="infoCard">
        <h4 id="cardTitle">Território</h4>
        <p id="cardDesc">Região selecionada.</p>
