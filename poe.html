<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mapa</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
}

#viewport {
    width: 100vw;
    height: 100vh;
    position: relative;
}

canvas {
    position: absolute;
}

.info-card {
    position: fixed;
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 10px;
    border: 1px solid gold;
    pointer-events: none;
    opacity: 0;
}
</style>
</head>

<body>

<div id="viewport">
    <canvas id="mapCanvas"></canvas>
</div>

<div class="info-card" id="infoCard">
    <b id="cardTitle"></b><br>
    <span id="cardDesc"></span>
</div>

<script>
// ELEMENTOS
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');
const viewport = document.getElementById('viewport');

const infoCard = document.getElementById('infoCard');
const cardTitle = document.getElementById('cardTitle');
const cardDesc = document.getElementById('cardDesc');

// IMAGENS
const imgEscura = new Image();
const imgColorida = new Image();

imgEscura.src = 'tryu.png';
imgColorida.src = 'dertyh.png';

// DEBUG (se der tela branca, isso acusa)
imgEscura.onerror = () => console.log("Erro na imagem escura");
imgColorida.onerror = () => console.log("Erro na imagem colorida");

// VARIÁVEIS
let loaded = 0;
let colorData = null;
let activeColor = null;

// 🔥 máscara FIXA (corrige bug)
const maskCanvas = document.createElement('canvas');
const mCtx = maskCanvas.getContext('2d');

// INIT
imgEscura.onload = checkLoad;
imgColorida.onload = checkLoad;

function checkLoad() {
    loaded++;
    if (loaded === 2) init();
}

function init() {
    canvas.width = imgEscura.width;
    canvas.height = imgEscura.height;

    maskCanvas.width = canvas.width;
    maskCanvas.height = canvas.height;

    // pega dados da imagem colorida
    const temp = document.createElement('canvas');
    temp.width = canvas.width;
    temp.height = canvas.height;
    const tctx = temp.getContext('2d');
    tctx.drawImage(imgColorida, 0, 0);

    colorData = tctx.getImageData(0,0,canvas.width,canvas.height).data;

    draw();
}

// comparação com tolerância
function sameColor(r,g,b,t, tol=8){
    return Math.abs(r-t.r)<=tol &&
           Math.abs(g-t.g)<=tol &&
           Math.abs(b-t.b)<=tol;
}

// RENDER
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(imgEscura,0,0);

    if(!activeColor) return;

    const imgData = mCtx.createImageData(canvas.width, canvas.height);

    for(let i=0;i<colorData.length;i+=4){
        const r=colorData[i];
        const g=colorData[i+1];
        const b=colorData[i+2];
        const a=colorData[i+3];

        if(a>10 && sameColor(r,g,b,activeColor)){
            imgData.data[i]=255;
            imgData.data[i+1]=255;
            imgData.data[i+2]=255;
            imgData.data[i+3]=255;
        }
    }

    mCtx.putImageData(imgData,0,0);

    ctx.save();
    ctx.drawImage(maskCanvas,0,0);
    ctx.globalCompositeOperation='source-in';
    ctx.drawImage(imgColorida,0,0);
    ctx.restore();
}

// MOUSE
window.addEventListener('mousemove',(e)=>{
    const rect = canvas.getBoundingClientRect();

    if(
        e.clientX>=rect.left &&
        e.clientX<=rect.right &&
        e.clientY>=rect.top &&
        e.clientY<=rect.bottom &&
        colorData
    ){
        const x = Math.floor((e.clientX-rect.left)*(canvas.width/rect.width));
        const y = Math.floor((e.clientY-rect.top)*(canvas.height/rect.height));

        const i=(y*canvas.width+x)*4;

        const r=colorData[i];
        const g=colorData[i+1];
        const b=colorData[i+2];
        const a=colorData[i+3];

        if(a>10 && (r+g+b)>30){
            if(!activeColor || !sameColor(r,g,b,activeColor)){
                activeColor={r,g,b};
                draw();
            }

            infoCard.style.opacity=1;
            infoCard.style.left=e.clientX+15+"px";
            infoCard.style.top=e.clientY+"px";

            cardTitle.innerText="Território";
            cardDesc.innerText=`RGB(${r},${g},${b})`;

            return;
        }
    }

    if(activeColor){
        activeColor=null;
        draw();
        infoCard.style.opacity=0;
    }
});
</script>

</body>
</html>
