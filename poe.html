<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mapa - Brilho Dourado Perfeito</title>

<style>
body {
    margin: 0;
    background: black;
}

/* O contêiner permite rolagem se a tela for pequena, mantendo o alinhamento */
#viewport {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: auto; 
    display: flex;
    justify-content: center;
    align-items: center;
}

.map-wrapper {
    width: 1441px;
    height: 1311px;
    position: relative;
    flex-shrink: 0;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 1441px;
    height: 1311px;
    display: block;
    z-index: 2;
}

.info-card {
    position: fixed;
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 10px;
    border: 1px solid gold;
    pointer-events: none;
    opacity: 0;
    z-index: 10;
}
</style>
</head>

<body>

<div id="viewport">
    <div class="map-wrapper">
        <canvas id="mapCanvas"></canvas>
    </div>
</div>

<div class="info-card" id="infoCard">
    <b id="cardTitle"></b><br>
    <span id="cardDesc"></span>
</div>

<script>
const MAP_WIDTH = 1441;
const MAP_HEIGHT = 1311;

// ELEMENTOS
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

const infoCard = document.getElementById('infoCard');
const cardTitle = document.getElementById('cardTitle');
const cardDesc = document.getElementById('cardDesc');

// IMAGENS
const imgEscura = new Image();
const imgColorida = new Image();

imgEscura.src = 'tryu.png';
imgColorida.src = 'dertyh.png';

let loaded = 0;
let colorData = null;
let activeColor = null;

imgEscura.onload = checkLoad;
imgColorida.onload = checkLoad;

function checkLoad(){
    loaded++;
    if(loaded === 2) init();
}

function init(){
    canvas.width = MAP_WIDTH;
    canvas.height = MAP_HEIGHT;

    // Canvas auxiliar na memória para extrair o array de cores puro
    const emMemoriaCanvas = document.createElement('canvas');
    emMemoriaCanvas.width = MAP_WIDTH;
    emMemoriaCanvas.height = MAP_HEIGHT;
    const emMemoriaCtx = emMemoriaCanvas.getContext('2d');
    
    emMemoriaCtx.drawImage(imgColorida, 0, 0, MAP_WIDTH, MAP_HEIGHT);
    colorData = emMemoriaCtx.getImageData(0, 0, MAP_WIDTH, MAP_HEIGHT).data;

    drawBase();
}

function drawBase(){
    ctx.clearRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
    ctx.drawImage(imgEscura, 0, 0, MAP_WIDTH, MAP_HEIGHT);
}

// Comparação estrita para não acender múltiplos territórios vizinhos por engano
function sameColor(r, g, b, tol = 0){
    return Math.abs(r - activeColor.r) <= tol &&
           Math.abs(g - activeColor.g) <= tol &&
           Math.abs(b - activeColor.b) <= tol;
}

function draw(){
    drawBase();

    if(!activeColor) return;

    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = MAP_WIDTH;
    tempCanvas.height = MAP_HEIGHT;
    const tempCtx = tempCanvas.getContext('2d');
    
    const mask = tempCtx.createImageData(MAP_WIDTH, MAP_HEIGHT);

    for(let i = 0; i < colorData.length; i += 4){
        const r = colorData[i];
        const g = colorData[i+1];
        const b = colorData[i+2];
        const a = colorData[i+3];

        if(a > 10 && sameColor(r, g, b)){
            // Cor interna do preenchimento dourado do território ativo
            mask.data[i] = 218;   
            mask.data[i+1] = 165; 
            mask.data[i+2] = 32;  
            mask.data[i+3] = 45; // Opacidade interna controlada (máx 255)
        }
    }
    tempCtx.putImageData(mask, 0, 0);

    ctx.save();
    // Configuração do motor de desfoque/brilho neon dourado
    ctx.shadowColor = "rgba(255, 215, 0, 1)";
    ctx.shadowBlur = 18;

    // Renderiza a máscara com o brilho ativado
    ctx.drawImage(tempCanvas, 0, 0);
    ctx.restore();
}

// Ouvinte de movimento aplicado diretamente no elemento Canvas interativo
canvas.addEventListener('mousemove', (e)=>{
    // e.offsetX e e.offsetY pegam a posição exata dentro do Canvas descartando qualquer scroll
    const x = Math.floor(e.offsetX);
    const y = Math.floor(e.offsetY);

    if(x < 0 || y < 0 || x >= MAP_WIDTH || y >= MAP_HEIGHT){
        if(activeColor){
            activeColor = null;
            drawBase();
            infoCard.style.opacity = 0;
        }
        return;
    }

    const i = (y * MAP_WIDTH + x) * 4;

    const r = colorData[i];
    const g = colorData[i+1];
    const b = colorData[i+2];
    const a = colorData[i+3];

    // Ignora fundos puramente escuros/transparentes da imagem
    if(a > 10 && (r + g + b) > 20){
        if(!activeColor || activeColor.r !== r || activeColor.g !== g || activeColor.b !== b){
            activeColor = {r, g, b};
            draw();
        }

        infoCard.style.opacity = 1;
        infoCard.style.left = e.clientX + 15 + "px";
        infoCard.style.top = e.clientY + "px";

        cardTitle.innerText = "Território";
        cardDesc.innerText = `RGB(${r},${g},${b})`;
    } else {
        if(activeColor){
            activeColor = null;
            drawBase();
            infoCard.style.opacity = 0;
        }
    }
});

// Remove o card se o mouse sair da área útil do mapa
canvas.addEventListener('mouseleave', () => {
    if(activeColor){
        activeColor = null;
        drawBase();
        infoCard.style.opacity = 0;
    }
});

</script>

</body>
</html>
