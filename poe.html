<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mapa</title>

<style>
body {
    margin: 0;
    background: black;
}

/* Permite rolagem caso a tela seja menor que o mapa de 1441x1311 */
#viewport {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: auto; 
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Contêiner interno fixo no tamanho que você pediu */
.map-wrapper {
    width: 1441px;
    height: 1311px;
    position: relative;
    flex-shrink: 0; /* Impede que o flexbox amasse o mapa */
}

/* Ambos os canvas ocupam exatamente o mesmo tamanho e posição dentro do wrapper */
canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 1441px;
    height: 1311px;
    display: block;
}

/* Mapa colorido estritamente atrás */
#mapColor {
    z-index: 1;
}

/* Mapa escuro/interativo estritamente na frente */
#mapCanvas {
    z-index: 2;
}

.info-card {
    position: fixed;
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 10px;
    border: 1px solid gold;
    pointer-events: none;
    opacity: 0;
    z-index: 10;
}
</style>
</head>

<body>

<div id="viewport">
    <div class="map-wrapper">
        <canvas id="mapColor"></canvas>
        <canvas id="mapCanvas"></canvas>
    </div>
</div>

<div class="info-card" id="infoCard">
    <b id="cardTitle"></b><br>
    <span id="cardDesc"></span>
</div>

<script>
// DIMENSÕES FIXAS SOLICITADAS
const MAP_WIDTH = 1441;
const MAP_HEIGHT = 1311;

// ELEMENTOS
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

const colorCanvas = document.getElementById('mapColor');
const colorCtx = colorCanvas.getContext('2d');

const infoCard = document.getElementById('infoCard');
const cardTitle = document.getElementById('cardTitle');
const cardDesc = document.getElementById('cardDesc');

const wrapper = document.querySelector('.map-wrapper');

// IMAGENS
const imgEscura = new Image();
const imgColorida = new Image();

imgEscura.src = 'tryu.png';
imgColorida.src = 'dertyh.png';

// debug
imgEscura.onerror = () => console.log("Erro imagem escura");
imgColorida.onerror = () => console.log("Erro imagem colorida");

// estado
let loaded = 0;
let colorData = null;
let activeColor = null;

// load
imgEscura.onload = checkLoad;
imgColorida.onload = checkLoad;

function checkLoad(){
    loaded++;
    if(loaded === 2) init();
}

// INIT
function init(){
    // Força a resolução interna (quantidade de pixels) para 1441 x 1311 de forma idêntica
    canvas.width = MAP_WIDTH;
    canvas.height = MAP_HEIGHT;

    colorCanvas.width = MAP_WIDTH;
    colorCanvas.height = MAP_HEIGHT;

    // Desenha o mapa colorido de fundo ocupando todo o espaço definido
    colorCtx.drawImage(imgColorida, 0, 0, MAP_WIDTH, MAP_HEIGHT);
    colorData = colorCtx.getImageData(0, 0, MAP_WIDTH, MAP_HEIGHT).data;

    drawBase();
}

// desenha mapa base escuro
function drawBase(){
    ctx.clearRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
    ctx.drawImage(imgEscura, 0, 0, MAP_WIDTH, MAP_HEIGHT);
}

// comparação de cor (tolerância a variações suaves)
function sameColor(r, g, b, tol = 8){
    return Math.abs(r - activeColor.r) <= tol &&
           Math.abs(g - activeColor.g) <= tol &&
           Math.abs(b - activeColor.b) <= tol;
}

// Desenha o realce perfeitamente alinhado na resolução correta
function draw(){
    drawBase();

    if(!activeColor) return;

    // Cria a máscara no tamanho idêntico de 1441 x 1311
    const mask = ctx.createImageData(MAP_WIDTH, MAP_HEIGHT);

    for(let i = 0; i < colorData.length; i += 4){
        const r = colorData[i];
        const g = colorData[i+1];
        const b = colorData[i+2];
        const a = colorData[i+3];

        if(a > 10 && sameColor(r, g, b)){
            mask.data[i] = 255;
            mask.data[i+1] = 255;
            mask.data[i+2] = 255;
            mask.data[i+3] = 255;
        }
    }

    ctx.putImageData(mask, 0, 0);

    // Mescla o recorte gerado com a imagem colorida no tamanho correto
    ctx.globalCompositeOperation = 'source-in';
    ctx.drawImage(imgColorida, 0, 0, MAP_WIDTH, MAP_HEIGHT);
    ctx.globalCompositeOperation = 'source-over';
}

// Interação do mouse baseada na posição do elemento contêiner (wrapper)
window.addEventListener('mousemove', (e)=>{
    // Pega as coordenadas do mouse relativas ao contêiner do mapa
    const rect = wrapper.getBoundingClientRect();
    const x = Math.floor(e.clientX - rect.left);
    const y = Math.floor(e.clientY - rect.top);

    // Se o mouse estiver fora das bordas de 1441x1311, desativa o realce
    if(x < 0 || y < 0 || x >= MAP_WIDTH || y >= MAP_HEIGHT){
        if(activeColor){
            activeColor = null;
            drawBase();
            infoCard.style.opacity = 0;
        }
        return;
    }

    const i = (y * MAP_WIDTH + x) * 4;

    const r = colorData[i];
    const g = colorData[i+1];
    const b = colorData[i+2];
    const a = colorData[i+3];

    // Ignora fundos puramente transparentes ou tons extremamente escuros/pretos
    if(a > 10 && (r + g + b) > 30){
        if(!activeColor || activeColor.r !== r || activeColor.g !== g || activeColor.b !== b){
            activeColor = {r, g, b};
            draw();
        }

        infoCard.style.opacity = 1;
        infoCard.style.left = e.clientX + 15 + "px";
        infoCard.style.top = e.clientY + "px";

        cardTitle.innerText = "Território";
        cardDesc.innerText = `RGB(${r},${g},${b})`;
    } else {
        if(activeColor){
            activeColor = null;
            drawBase();
            infoCard.style.opacity = 0;
        }
    }
});

</script>

</body>
</html>
