<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Topografia</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

#viewport {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain; 
    z-index: 1;
}

/* Info-Card Repaginado e Explicativo */
.info-card {
    position: fixed;
    background: rgba(10, 10, 15, 0.95);
    color: #e0e0e0;
    padding: 15px;
    border: 1px solid #ffd700;
    border-radius: 6px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), 0 0 10px rgba(255, 215, 0, 0.2);
    pointer-events: none;
    opacity: 0;
    z-index: 10;
    min-width: 240px;
    max-width: 320px; /* Garante que textos longos quebrem linha elegantemente */
    transition: opacity 0.15s ease;
}

.info-card h3 {
    margin: 0 0 10px 0;
    color: #ffd700;
    font-size: 16px;
    border-bottom: 1px solid rgba(255, 215, 0, 0.3);
    padding-bottom: 5px;
    font-weight: 600;
}

.info-row {
    margin: 6px 0;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
}

.info-label {
    color: #888;
    font-weight: bold;
    margin-right: 15px;
    white-space: nowrap;
}

.info-value {
    color: #fff;
    text-align: right;
}

/* Novo estilo para o bloco explicativo de descrição */
.info-desc {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed rgba(255, 215, 0, 0.2);
    font-size: 12px;
    color: #ccc;
    line-height: 1.4;
    text-align: justify;
}
</style>
</head>

<body>

<div id="viewport">
    <canvas id="mapColorCanvas"></canvas>
</div>

<div class="info-card" id="infoCard">
    <h3 id="cardTitle">Território</h3>
    <div class="info-row"><span class="info-label">Soberania:</span><span class="info-value" id="cardSoberania">-</span></div>
    <div class="info-row"><span class="info-label">Idade:</span><span class="info-value" id="cardIdade">-</span></div>
    <div class="info-row"><span class="info-label">Poder Militar:</span><span class="info-value" id="cardMilitar">-</span></div>
    <div class="info-desc" id="cardDescricao">-</div>
</div>
