<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Biblioteca</title>

  <!-- Fonte Cinzel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    body {
      margin: 0;
      font-family: sans-serif;
      background: #000;
      color: #e7e9ee;
    }

    .topbar {
      padding: 1rem;
      background: #b8860b;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
      color: #000;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .btn-loja {
      margin-left: auto;
      padding: 0.55rem 1rem;
      border-radius: 12px;
      background: #000;
      color: #d4af37;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }

    .btn-loja:hover {
      background: #1a1a1a;
      color: #fff;
      transform: translateY(-1px);
    }

    /* BOTÃO ADMINISTRATIVO */

    .btn-admin {
      display: none;
      padding: 0.55rem 1rem;
      border-radius: 12px;
      background: #000;
      color: #d4af37;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }

    .btn-admin:hover {
      background: #1a1a1a;
      color: #fff;
      transform: translateY(-1px);
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 58px);
    }

    .sidebar {
      background: #000;
      padding: 1rem;
      overflow: auto;
      border-right: 1px solid #b8860b;
      width: 260px;
      flex-shrink: 0;
    }

    .main {
      display: flex;
      flex: 1;
      gap: 1.5rem;
      padding: 1rem;
      align-items: flex-start;
    }

    #grade {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(280px, 1fr)
      );
      gap: 1.5rem;
      flex: 1;
    }

    #novelGrid {
      width: 300px;
      background: #b8860b;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding: 1rem;
      border-left: 2px solid #b8860b;
      flex-shrink: 0;
    }

    #novelGrid h2 {
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      color: #000;
      margin-bottom: 0.5rem;
      font-family: 'Cinzel', serif;
    }

    .card-book {
      background: #b8860b;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #d4af37;
      height: auto;
      color: #000;
    }

    .cover {
      width: 100%;
      aspect-ratio: 3/4;
      background: #000;
      flex-shrink: 0;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .meta {
      padding: 1.2rem;
      flex-grow: 1;
    }

    .meta h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.2rem;
      color: #000;
      font-family: 'Cinzel', serif;
      font-weight: 700;
    }

    .meta .author {
      color: #241800;
      font-size: 0.9rem;
      font-style: italic;
      margin-bottom: 0.8rem;
    }

    .meta .synopsis {
      font-size: 0.85rem;
      color: #1c1400;
      line-height: 1.5;
      white-space: pre-line;
    }

    .actions {
      display: flex;
      gap: 0.8rem;
      padding: 1.2rem;
      align-items: center;
      border-top: 1px solid #8c6508;
      margin-top: auto;
    }

    .btn {
      padding: .5rem .8rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: #000;
      color: #e7e9ee;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      width: 70px;
      height: 38px;
      flex-shrink: 0;
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      filter: grayscale(1);
    }

    .fav[aria-pressed="true"]::before {
      content: "★";
      color: #fff;
    }

    .fav[aria-pressed="false"]::before {
      content: "☆";
    }

    .star-count {
      color: #fff;
      font-weight: 400;
      font-size: 0.75rem;
    }

    .comment-section {
      margin-top: 2rem;
      background: #1a0901;
      padding: 1rem;
      border-radius: 12px;
    }

    .comment-section textarea {
      width: 100%;
      height: 80px;
      background: #000;
      color: #fff;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 0.5rem;
      box-sizing: border-box;
      resize: none;
    }

    .btn-comment {
      margin-top: 0.5rem;
      width: 100%;
      background: #000;
      color: #fff;
      padding: 0.6rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-comment:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #listaComentarios {
      margin-top: 1.5rem;
    }

    .comentario-item {
      border-bottom: 1px solid #333;
      padding: 12px 0;
    }

    .comentario-texto {
      font-size: 0.9rem;
      color: #e7e9ee;
      margin: 0;
      word-break: break-word;
    }

    .comentario-meta {
      color: #aab0bd;
      font-size: 0.75rem;
      display: block;
      margin-top: 6px;
    }

    .drawer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.95);
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform .2s ease;
      z-index: 50;
    }

    .drawer.open {
      transform: translateY(0);
    }

    .drawer-content {
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .drawer-content img {
      width: 100%;
      max-width: 800px;
      height: auto;
      margin-bottom: 1rem;
    }

    #drawer .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 1rem;
      background: #b8860b;
    }

    #drawer .topbar #closeDrawer {
      position: absolute;
      left: 1rem;
    }

    #drawer .topbar #toggleSlide {
      position: absolute;
      right: 1rem;
    }

  </style>
</head>

<body>

  <!-- BARRA SUPERIOR -->

  <header class="topbar">

    <span>Biblioteca</span>

    <a href="loja.html" class="btn-loja">
      Loja
    </a>

    <!--
      ESTE BOTÃO COMEÇA INVISÍVEL.

      O Firebase Authentication decidirá
      se ele será exibido.
    -->

    <a
      href="admin.html"
      class="btn-admin"
      id="btnAdmin"
    >
      Admin
    </a>

  </header>


  <div class="layout">

    <aside class="sidebar">

      <h2>
        Triohnte a saga começou aqui, online.
      </h2>

      <div class="comment-section">

        <h3>
          Deixe seu comentário
        </h3>

        <textarea
          id="commentText"
          placeholder="O que você está lendo hoje?"
        ></textarea>

        <button
          class="btn-comment"
          id="btnComment"
          disabled
        >
          Verificando login...
        </button>

        <div id="listaComentarios"></div>

      </div>

    </aside>


    <main class="main">

      <div id="grade"></div>

      <div id="novelGrid">

        <h2>
          Contos de Walingardyn
        </h2>

      </div>

    </main>

  </div>


  <!-- DRAWER -->

  <div
    id="drawer"
    class="drawer"
    aria-hidden="true"
  >

    <div class="topbar">

      <button
        class="btn"
        id="closeDrawer"
      >
        Fechar
      </button>

      <h2 id="drawerTitle"></h2>

      <button
        class="btn"
        id="toggleSlide"
      >
        Slide
      </button>

    </div>

    <div class="drawer-content"></div>

  </div>


  <!-- FIREBASE -->

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


  <script>

    /* ===================================================== */
    /* FIREBASE                                                */
    /* ===================================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyAajz5PVa79vH1FSWrC0pPrGxs0Q-9xkFk",

      authDomain:
        "triohnte-database.firebaseapp.com",

      databaseURL:
        "https://triohnte-database-default-rtdb.europe-west1.firebasedatabase.app/",

      projectId:
        "triohnte-database",

      appId:
        "1:127473963183:web:c071072d846a8d7240045a"

    };


    if (!firebase.apps.length) {

      firebase.initializeApp(
        firebaseConfig
      );

    }


    const auth =
      firebase.auth();

    const db =
      firebase.database();


    /* ===================================================== */
    /* E-MAILS COM ACESSO ADMINISTRATIVO                      */
    /* ===================================================== */

    const EMAILS_AUTORIZADOS = [

      "mr.gabriel04.07.02@hotmail.com",

      "ga7144492@gmail.com"

    ];


    /* ===================================================== */
    /* BOTÃO ADMIN                                             */
    /* ===================================================== */

    const btnAdmin =
      document.getElementById(
        "btnAdmin"
      );


    /*
      Sempre começa escondido.

      Isso evita que o botão apareça
      por alguns segundos para usuários
      não autorizados enquanto o Firebase
      restaura a sessão.
    */

    btnAdmin.style.display =
      "none";


    /*
      Esta função NÃO procura o e-mail
      no localStorage.

      Ela recebe diretamente o objeto
      "user" fornecido pelo Firebase Authentication.
    */

    function verificarAcessoAdministrativo(user) {

      /*
        Primeiro remove o acesso visual.
      */

      btnAdmin.style.display =
        "none";


      /*
        Se não existe usuário autenticado,
        termina aqui.
      */

      if (!user) {

        console.log(
          "Firebase: nenhum usuário logado."
        );

        return;

      }


      /*
        O Firebase informou o e-mail
        da conta atualmente autenticada
        neste navegador/dispositivo.
      */

      const emailFirebase =
        (user.email || "")
          .trim()
          .toLowerCase();


      console.log(
        "Firebase Authentication informou:",
        emailFirebase
      );


      /*
        Compara o e-mail recebido do Firebase
        com a lista de administradores.
      */

      if (
        EMAILS_AUTORIZADOS.includes(
          emailFirebase
        )
      ) {

        console.log(
          "ACESSO ADMINISTRATIVO CONCEDIDO:",
          emailFirebase
        );


        btnAdmin.style.display =
          "inline-block";

      }

      else {

        console.log(
          "Usuário autenticado, mas sem acesso administrativo:",
          emailFirebase
        );

        btnAdmin.style.display =
          "none";

      }

    }


    /* ===================================================== */
    /* PERSISTÊNCIA                                            */
    /* ===================================================== */

    auth.setPersistence(
      firebase.auth.Auth.Persistence.LOCAL
    )
    .then(() => {

      console.log(
        "Firebase: persistência LOCAL ativada."
      );

    })
    .catch(error => {

      console.error(
        "Firebase: erro na persistência:",
        error
      );

    });


    /* ===================================================== */
    /* LIVROS                                                  */
    /* ===================================================== */

    const livros = [

      {

        id: 777,

        titulo: "Triohnte",

        autor: "Gabryell Aweryan",

        capa: "Capa.png",

        pasta: "Triohnte",

        totalPaginas: 400,

        prefixo: "",

        synopsis:
          "Em Walingardyn, o poder pertence àqueles que conseguem conquistá-lo, e, sobretudo, mantê-lo. Reinos disputam fronteiras, lordes conspiram para elevar suas casas e a plebe sobrevive sob o peso de uma hierarquia que parece impossível de romper. Por gerações, guerras e intrigas moldaram um mundo onde honra, lealdade e justiça frequentemente cedem lugar à ambição. Mas algo começa a mudar. Sem aviso, quatro reis são alvo de ataques repentinos, distintos entre si, porém ligados por circunstâncias que desafiam qualquer explicação. O que a princípio parece ser apenas mais uma disputa pelo poder logo revela sinais de uma conspiração muito mais profunda. Até então separados por seus próprios interesses, os quatro soberanos começam a perceber aquilo que seus tronos os impediram de enxergar: há algo profundamente corrompido em Walingardyn. Por trás das guerras existem interesses ocultos. Por trás das alianças, traições. E por trás da própria ordem que sustenta os reinos, uma verdade que permaneceu escondida por tempo demais. Enquanto os ataques se intensificam e a confiança entre coroas começa a desaparecer, os quatro reis são obrigados a confrontar uma realidade inquietante: talvez seus maiores inimigos não estejam além de suas fronteiras. Talvez estejam dentro de seus próprios reinos. E quando a verdade finalmente começar a emergir, nenhum trono permanecerá seguro."

      }

    ];


    /* ===================================================== */
    /* CONTOS                                                  */
    /* ===================================================== */

    const novels = [

      {

        id: 101,

        titulo: "Segredários",

        autor: "Gabryell Aweryan",

        capa: "Coloque aqui seu png",

        pasta: "S CAPS",

        totalPaginas: 1,

        prefixo: "S CAP ",

        synopsis:
          `Marco, João e Lucas vivem a rotina sem graça da Kenya Enlatados, uma pequena empresa de São Paulo que enlata legumes e sardinhas. Mas a monotonia acaba quando recebem um telefonema inesperado de Cleber F. Junior, do Amazonas: investigar um parque aquático abandonado, palco de uma tragédia que ainda assombra o local.

Aproveitando que suas férias estavam chegando, inventam um retiro espiritual para justificar a ausência, e claro, o chefe não entende nada! Munidos de curiosidade, improviso e sua van carateristicamente cômica, os Segredários partem rumo ao Amazonas.

No parque, descobrem que Cleber desapareceu misteriosamente e que a missão agora é coordenada por seu filho, Victor, que quer resolver o problema da propriedade para vendê-la. Entre mistérios, absurdos e perigos que ninguém ousaria enfrentar, Marco, João e Lucas vão aprender que segredos enterrados nem sempre ficam onde deveriam, e que a linha entre o banal e o bizarro pode ser mais fina do que imaginam.`

      }

    ];


    /* ===================================================== */
    /* ELEMENTOS                                               */
    /* ===================================================== */

    const grade =
      document.getElementById(
        "grade"
      );

    const novelGrid =
      document.getElementById(
        "novelGrid"
      );

    const btnComment =
      document.getElementById(
        "btnComment"
      );

    const textarea =
      document.getElementById(
        "commentText"
      );

    const listaComentarios =
      document.getElementById(
        "listaComentarios"
      );


    /* ===================================================== */
    /* RENDER DOS CARDS                                        */
    /* ===================================================== */

    function renderCard(
      item,
      container,
      includeFav = false
    ) {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "card-book";


      card.innerHTML = `

        <div class="cover">

          <img
            src="${item.capa}"
            alt="${item.titulo}"
            onerror="this.style.display='none'"
          >

        </div>

        <div class="meta">

          <h3>
            ${item.titulo}
          </h3>

          <div class="author">
            Por: ${item.autor}
          </div>

          <div class="synopsis">
            ${item.synopsis}
          </div>

        </div>

        <div class="actions">

          <button
            class="btn ler"
            data-id="${item.id}"
            disabled
          >
            🔒
          </button>

          ${
            includeFav
            ?

            `
              <button
                class="btn fav"
                aria-pressed="false"
                data-id="${item.id}"
              >

                <span
                  class="star-count"
                  id="stars-${item.id}"
                >
                  0
                </span>

              </button>
            `

            :

            ""
          }

        </div>

      `;


      container.appendChild(
        card
      );

    }


    livros.forEach(
      livro =>
        renderCard(
          livro,
          grade,
          true
        )
    );


    novels.forEach(
      conto =>
        renderCard(
          conto,
          novelGrid,
          true
        )
    );


    /* ===================================================== */
    /* PERMISSÕES DOS LIVROS                                  */
    /* ===================================================== */

    function atualizarPermissoesBotao(
      emailLogado
    ) {

      const permissoes =
        JSON.parse(
          localStorage.getItem(
            "sw_permissoes"
          )
        ) || [];


      const botoesLer =
        document.querySelectorAll(
          ".btn.ler"
        );


      botoesLer.forEach(
        botao => {

          const idDoLivro =
            botao.getAttribute(
              "data-id"
            );


          const temAcesso =
            permissoes.some(
              p => {

                if (
                  !p.email ||
                  p.bookId === undefined
                ) {

                  return false;

                }


                return (

                  p.email
                    .toLowerCase()
                    ===
                  emailLogado
                    .toLowerCase()

                  &&

                  p.bookId
                    .toString()
                    ===
                  idDoLivro
                    .toString()

                );

              }
            );


          if (temAcesso) {

            botao.disabled =
              false;

            botao.innerText =
              "Ler";

          }

          else {

            botao.disabled =
              true;

            botao.innerText =
              "🔒";

          }

        }
      );

    }


    /* ===================================================== */
    /* AUTENTICAÇÃO FIREBASE                                  */
    /* ===================================================== */

    auth.onAuthStateChanged(
      user => {

        /*
          A partir daqui, o Firebase terminou
          de verificar/restaurar a sessão.
        */

        usuarioLogado =
          user;


        autenticacaoVerificada =
          true;


        console.log(
          "================================="
        );

        console.log(
          "FIREBASE AUTHENTICATION"
        );

        console.log(
          "Usuário:",
          user
            ? user.email
            : "nenhum"
        );

        console.log(
          "UID:",
          user
            ? user.uid
            : "nenhum"
        );

        console.log(
          "================================="
        );


        /*
          ESTA É A PARTE IMPORTANTE.

          O Firebase fornece diretamente
          o usuário atualmente autenticado.

          Não estamos lendo o login do index.html.
          Não estamos usando localStorage para
          descobrir quem está logado.
        */

        verificarAcessoAdministrativo(
          user
        );


        if (
          user &&
          user.email
        ) {

          console.log(
            "Usuário reconhecido na Biblioteca:",
            user.email
          );


          btnComment.disabled =
            false;

          btnComment.innerText =
            "Enviar";


          atualizarPermissoesBotao(
            user.email
          );

        }

        else {

          console.log(
            "Nenhum usuário autenticado."
          );


          btnComment.disabled =
            false;

          btnComment.innerText =
            "Entrar para comentar";


          document
            .querySelectorAll(
              ".btn.ler"
            )
            .forEach(
              botao => {

                botao.disabled =
                  true;

                botao.innerText =
                  "🔒";

              }
            );

        }

      }
    );


    /* ===================================================== */
    /* EVENTOS                                                 */
    /* ===================================================== */

    document.body.addEventListener(
      "click",
      e => {

        const btnLer =
          e.target.closest(
            ".ler"
          );


        if (
          btnLer &&
          !btnLer.disabled
        ) {

          const id =
            btnLer.dataset.id;


          const item =
            [
              ...livros,
              ...novels
            ].find(
              x =>
                x.id == id
            );


          if (item) {

            openDrawer(
              item
            );

          }


          return;

        }


        const btnFav =
          e.target.closest(
            ".fav"
          );


        if (btnFav) {

          const id =
            btnFav.dataset.id;


          if (
            btnFav.getAttribute(
              "aria-pressed"
            ) === "true"
          ) {

            return;

          }


          btnFav.setAttribute(
            "aria-pressed",
            "true"
          );


          db.ref(
            "estrelas/" + id
          )
          .transaction(
            valor =>
              (valor || 0) + 1
          )
          .catch(
            error => {

              console.error(
                "Erro ao registrar estrela:",
                error
              );

            }
          );

        }

      }
    );


    /* ===================================================== */
    /* ABRIR LIVRO                                             */
    /* ===================================================== */

    function openDrawer(
      item
    ) {

      const drawer =
        document.getElementById(
          "drawer"
        );


      const content =
        document.querySelector(
          ".drawer-content"
        );


      document.getElementById(
        "drawerTitle"
      ).textContent =
        item.titulo;


      content.innerHTML =
        "";


      for (
        let i = 1;
        i <= item.totalPaginas;
        i++
      ) {

        const img =
          document.createElement(
            "img"
          );


        img.src =
          `${item.pasta}/${item.prefixo}${i}.png`;


        img.alt =
          `${item.titulo} - página ${i}`;


        content.appendChild(
          img
        );

      }


      drawer.classList.add(
        "open"
      );


      drawer.setAttribute(
        "aria-hidden",
        "false"
      );


      document.body.style.overflow =
        "hidden";

    }


    /* ===================================================== */
    /* FECHAR LIVRO                                           */
    /* ===================================================== */

    document.getElementById(
      "closeDrawer"
    ).onclick = () => {

      const drawer =
        document.getElementById(
          "drawer"
        );


      drawer.classList.remove(
        "open"
      );


      drawer.setAttribute(
        "aria-hidden",
        "true"
      );


      document.body.style.overflow =
        "auto";

    };


    /* ===================================================== */
    /* COMENTÁRIOS                                             */
    /* ===================================================== */

    btnComment.onclick =
      async () => {

        if (
          !autenticacaoVerificada
        ) {

          alert(
            "Aguarde. Estamos verificando seu login..."
          );

          return;

        }


        const user =
          usuarioLogado ||
          auth.currentUser;


        if (!user) {

          alert(
            "Você precisa estar conectado para comentar."
          );

          return;

        }


        const texto =
          textarea.value.trim();


        if (!texto) {

          alert(
            "Escreva um comentário antes de enviar."
          );

          return;

        }


        btnComment.disabled =
          true;

        btnComment.innerText =
          "Enviando...";


        try {

          const snapshot =
            await db.ref(
              `usuarios/${user.uid}`
            ).once(
              "value"
            );


          const dados =
            snapshot.val() || {};


          const nome =
            dados.nome ||
            user.displayName ||
            user.email.split("@")[0];


          const pais =
            dados.pais ||
            "Walingardyn";


          await db.ref(
            "comentarios"
          ).push({

            uid:
              user.uid,

            email:
              user.email,

            nome:
              nome,

            texto:
              texto,

            data:
              Date.now(),

            pais:
              `- de ${nome} (${pais})`

          });


          textarea.value =
            "";


          alert(
            "Comentário publicado com sucesso."
          );

        }

        catch (error) {

          console.error(
            "Erro ao publicar comentário:",
            error
          );


          if (
            error.code ===
            "PERMISSION_DENIED"
          ) {

            alert(
              "O Firebase recusou o comentário. Verifique as regras do Realtime Database."
            );

          }

          else {

            alert(
              "Não foi possível publicar o comentário.\n\nErro: " +
              error.message
            );

          }

        }


        btnComment.disabled =
          false;

        btnComment.innerText =
          "Enviar";

      };


    /* ===================================================== */
    /* CARREGAR COMENTÁRIOS                                  */
    /* ===================================================== */

    db.ref(
      "comentarios"
    )
    .on(
      "child_added",
      snapshot => {

        const dados =
          snapshot.val();


        if (!dados) {

          return;

        }


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "comentario-item";


        const p =
          document.createElement(
            "p"
          );


        p.className =
          "comentario-texto";


        p.textContent =
          dados.texto || "";


        const small =
          document.createElement(
            "small"
          );


        small.className =
          "comentario-meta";


        const dataFormatada =
          dados.data
            ? new Date(
                dados.data
              ).toLocaleDateString(
                "pt-BR"
              )
            : "";


        small.textContent =
          `${dados.pais || "Walingardyn"} • ${dataFormatada}`;


        div.appendChild(
          p
        );


        div.appendChild(
          small
        );


        listaComentarios.prepend(
          div
        );

      },

      error => {

        console.error(
          "Erro ao carregar comentários:",
          error
        );

      }
    );


    /* ===================================================== */
    /* ESTRELAS                                               */
    /* ===================================================== */

    [
      ...livros,
      ...novels
    ].forEach(
      item => {

        db.ref(
          "estrelas/" + item.id
        )
        .on(
          "value",
          snap => {

            const el =
              document.getElementById(
                "stars-" + item.id
              );


            if (el) {

              el.textContent =
                snap.val() || 0;

            }

          }
        );

      }
    );

  </script>

</body>

</html>
