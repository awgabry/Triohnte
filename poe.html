<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Biblioteca - Triohnte</title>

  <!-- Fonte Cinzel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- PDF.js para leitura e camada de texto -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <!-- EmailJS configurado com suas chaves oficiais -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
      emailjs.init("AJRjiPfNJeMN84rol");
    })();
  </script>

  <style>
    /* ===================================================== */
    /* BASE E PROTEÇÃO CONTRA SELEÇÃO INDEVIDA E PRINT        */
    /* ===================================================== */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #000;
      color: #d6d6d6;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* ===================================================== */
    /* OURO METÁLICO — TÍTULOS                                */
    /* ===================================================== */
    .gold-text {
      background: linear-gradient(
        180deg,
        #fff4c9 0%,
        #f7e6b5 12%,
        #e4c27d 28%,
        #c89a4c 50%,
        #a8732d 68%,
        #8f5e22 82%,
        #e1bd72 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.95);
    }

    /* ===================================================== */
    /* BARRA SUPERIOR                                        */
    /* ===================================================== */
    .topbar {
      padding: 1rem;
      background: #080808;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: 1px;
      border-bottom: 1px solid #242424;
    }

    .topbar > span {
      background: linear-gradient(
        180deg,
        #fff4c9 0%,
        #f7e6b5 12%,
        #e4c27d 28%,
        #c89a4c 50%,
        #a8732d 70%,
        #8f5e22 84%,
        #e1bd72 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.9);
    }

    .btn-loja, .btn-admin {
      padding: 0.55rem 1rem;
      border-radius: 10px;
      background: #111;
      color: #d4af37;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      font-weight: 700;
      border: 1px solid #292929;
      transition: all 0.2s ease;
    }

    .btn-loja {
      margin-left: auto;
    }

    .btn-admin {
      display: none;
    }

    .btn-loja:hover, .btn-admin:hover {
      background: #1b1b1b;
      color: #f2d99d;
      border-color: #4a4a4a;
      transform: translateY(-1px);
    }

    /* ===================================================== */
    /* LAYOUT E GRADE DE LIVROS                              */
    /* ===================================================== */
    .layout {
      display: flex;
      min-height: calc(100vh - 58px);
      background: #000;
    }

    .main {
      display: flex;
      flex: 1;
      gap: 1.5rem;
      padding: 1rem;
      align-items: flex-start;
      background: #000;
    }

    #grade {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      flex: 1;
    }

    #novelGrid {
      width: 300px;
      background: #0b0b0b;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding: 1rem;
      border-left: 1px solid #242424;
      border-right: 1px solid #171717;
      flex-shrink: 0;
    }

    #novelGrid h2 {
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
      font-family: 'Cinzel', serif;
      background: linear-gradient(
        180deg,
        #fff4c9 0%,
        #f7e6b5 12%,
        #e4c27d 28%,
        #c89a4c 50%,
        #a8732d 70%,
        #8f5e22 84%,
        #e1bd72 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* CARDS DE LIVROS */
    .card-book {
      background: #101010;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #292929;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
    }

    .cover {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #000;
      border-bottom: 1px solid #292929;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .meta {
      padding: 1.2rem;
      flex-grow: 1;
      background: #101010;
    }

    .meta h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.2rem;
      font-family: 'Cinzel', serif;
      background: linear-gradient(
        180deg,
        #fff4c9 0%,
        #f7e6b5 12%,
        #e4c27d 28%,
        #c89a4c 50%,
        #a8732d 70%,
        #8f5e22 84%,
        #e1bd72 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .meta .author {
      color: #969696;
      font-size: 0.9rem;
      font-style: italic;
      margin-bottom: 0.8rem;
    }

    .meta .synopsis {
      font-size: 0.85rem;
      color: #b8b8b8;
      line-height: 1.5;
      margin-bottom: 0.8rem;
    }

    .synopsis-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      align-self: flex-start;
      margin: -0.25rem 0 0.85rem;
      padding: 0.35rem 0.55rem;
      border: 1px solid #c59b27;
      border-radius: 20px;
      background: transparent;
      color: #ffffff;
      font: inherit;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .synopsis-toggle:hover,
    .synopsis-toggle:focus-visible {
      background: #1b1710;
      border-color: #9b7944;
      outline: none;
    }

    .synopsis-toggle .arrow {
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .synopsis-toggle[aria-expanded="true"] .arrow {
      transform: rotate(180deg);
    }

    .synopsis-full {
      display: none;
      margin: 0 0 0.9rem;
      color: #c8c1b5;
      font-size: 0.9rem;
      line-height: 1.65;
      white-space: pre-line;
    }

    .synopsis-full.is-open {
      display: block;
    }

    /* SISTEMA DE ESTRELAS NOS CARDS */
    .rating-container {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 0.5rem;
      cursor: pointer;
    }

    .star {
      font-size: 1.1rem;
      color: #444;
      transition: color 0.2s;
      cursor: ew-resize;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }

    .rating-container.is-dragging {
      cursor: ew-resize;
    }

    .votar {
      padding: 4px 9px;
      margin-left: 5px;
      font-size: 0.72rem;
      line-height: 1.2;
    }

    .star.selected {
      background: linear-gradient(90deg, #fff var(--star-fill, 0%), #444 var(--star-fill, 0%));
      color: transparent;
      -webkit-text-fill-color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
    }

    .star.hover {
      color: #fff;
      background: none;
      -webkit-text-fill-color: #fff;
    }

    .rating-container .star.vote-choice {
      color: #fff;
      background: none;
      -webkit-text-fill-color: #fff;
    }

    .rating-score {
      font-size: 0.75rem;
      color: #888;
      margin-left: 6px;
    }

    .actions {
      display: flex;
      gap: 0.8rem;
      padding: 1.2rem;
      border-top: 1px solid #282828;
      background: #0c0c0c;
    }

    .btn {
      padding: .5rem .8rem;
      border-radius: 10px;
      border: 1px solid #292929;
      cursor: pointer;
      background: #050505;
      color: #d6d6d6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      height: 38px;
    }

    .btn:hover:not(:disabled) {
      background: #171717;
      border-color: #444;
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* ===================================================== */
    /* DRAWER / LEITOR DE PDF (COM PAINEL INTERNO)           */
    /* ===================================================== */
    .drawer {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .98);
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform .2s ease;
      z-index: 50;
    }

    .drawer.open {
      transform: translateY(0);
    }

    .drawer-body {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .drawer-content {
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000;
      flex: 1;
      position: relative;
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    .reader-sidebar {
      width: 340px;
      background: #080808;
      border-left: 1px solid #242424;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      overflow-y: auto;
      flex-shrink: 0;
      transition: width .22s ease, padding .22s ease, transform .22s ease;
      position: relative;
    }

    .reader-sidebar-toggle {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 3;
      width: 38px;
      min-width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid #c89a4c;
      border-radius: 7px;
      background: #111;
      color: #f7e6b5;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .reader-sidebar.collapsed {
      width: 0;
      padding: 0;
      border-left: 0;
      overflow: visible;
    }

    .reader-sidebar.collapsed .comment-section {
      display: none;
    }

    .reader-sidebar.collapsed .reader-sidebar-toggle {
      right: 8px;
      transform: translateX(100%);
    }

    /* ADAPTACAO DA BIBLIOTECA PARA TABLETS E CELULARES */
    @media (max-width: 900px) {
      .main {
        flex-direction: column;
        gap: 1rem;
      }

      #grade {
        width: 100%;
        grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
      }

      #novelGrid {
        width: 100%;
        flex-shrink: 1;
        border: 1px solid #242424;
        border-radius: 12px;
      }
    }

    @media (max-width: 700px) {
      .topbar {
        padding: .75rem;
        gap: .6rem;
        flex-wrap: wrap;
      }

      .topbar > span {
        font-size: 1rem;
      }

      .btn-loja, .btn-admin {
        padding: .45rem .7rem;
        font-size: .75rem;
      }

      .main {
        display: flex;
        flex-direction: column;
        width: 100%;
        min-width: 0;
        padding: .65rem;
      }

      #grade {
        display: grid;
        width: 100%;
        min-width: 0;
        grid-template-columns: minmax(0, 1fr);
        gap: .9rem;
      }

      #novelGrid {
        width: 100%;
        min-width: 0;
        padding: .75rem;
      }

      .card-book {
        width: 100%;
        min-width: 0;
      }

      .meta {
        padding: 1rem;
      }

      .actions {
        padding: 1rem;
      }

      .rating-container {
        flex-wrap: wrap;
        min-height: 44px;
      }

      .star {
        font-size: 1.35rem;
        padding: 4px 2px;
      }

      .drawer-body {
        min-width: 0;
        width: 100%;
      }

      .drawer-content {
        min-width: 0;
        width: 100%;
        padding: .35rem;
      }

      .page-container {
        max-width: 100%;
        margin-bottom: .8rem;
      }

      .page-container canvas {
        width: 100%;
        max-width: 100%;
      }

      .reader-sidebar {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        width: min(88vw, 340px);
        max-width: 100%;
      }

      .reader-sidebar.collapsed {
        width: 0;
      }

      #drawer .topbar {
        min-height: 58px;
        padding: .55rem 3.5rem;
      }

      #drawer .topbar #closeDrawer {
        left: .5rem;
        padding: .4rem .55rem;
        height: 36px;
        font-size: .75rem;
      }

      #drawer .topbar .reader-controls-wrapper {
        right: .5rem;
      }

      #drawer .topbar .reader-controls {
        gap: 4px;
        padding: 4px;
      }

      #drawer .topbar #savedPageInfo {
        display: none;
      }

      #drawer .topbar #drawerTitle {
        font-size: .9rem;
        text-align: center;
      }
    }

    .reader-sidebar h3 {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      background: linear-gradient(180deg, #fff4c9 0%, #c89a4c 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 0;
      margin-bottom: 0.8rem;
    }

    .comment-section textarea {
      width: 100%;
      background: #050505;
      color: #fff;
      border: 1px solid #292929;
      border-radius: 8px;
      padding: 0.6rem;
      font-size: 0.85rem;
      margin-bottom: 0.6rem;
      outline: none;
      resize: none;
      height: 80px;
    }

    .btn-comment {
      width: 100%;
      background: #050505;
      color: #d6d6d6;
      padding: 0.6rem;
      border: 1px solid #292929;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
    }

    .btn-comment:hover {
      background: #171717;
      border-color: #444;
    }

    .email-alert-box {
      margin-top: 1rem;
      padding: 0.7rem;
      background: #141414;
      border: 1px dashed #c89a4c;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #aaa;
      line-height: 1.4;
    }

    #listaComentarios {
      margin-top: 1rem;
      max-height: 300px;
      overflow-y: auto;
    }

    .comentario-item {
      border-bottom: 1px solid #282828;
      padding: 8px 0;
    }

    .comentario-texto {
      font-size: 0.85rem;
      color: #d0d0d0;
      margin: 0;
    }

    .comentario-meta {
      color: #777;
      font-size: 0.7rem;
      display: block;
      margin-top: 4px;
    }

    /* PÁGINAS E CANVAS DO PDF */
    .page-container {
      position: relative;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    .page-container canvas {
      display: block;
      max-width: 100%;
      height: auto !important;
      pointer-events: none;
    }

    .textLayer {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      opacity: 0.2;
      line-height: 1.0;
      pointer-events: auto;
    }

    .textLayer span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }

    .textLayer span::selection {
      background: rgba(255, 235, 59, 0.4);
    }

    /* COR FORTE PARA MARCAÇÃO DE TEXTO */
    .textLayer span.marcado-amarelo {
      background-color: #ffeb3b !important;
      color: #000000 !important;
      opacity: 1 !important;
    }

    .btn-marcar-pagina {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(10, 10, 10, 0.9);
      border: 1px solid #c89a4c;
      color: #f7e6b5;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: 'Cinzel', serif;
      cursor: pointer;
      z-index: 10;
    }

    .btn-marcar-pagina:hover {
      background: #c89a4c;
      color: #000;
    }

    /* MENU FLUTUANTE DE SELEÇÃO DE TEXTO */
    #selectionMenu {
      display: none;
      position: fixed;
      background: #141414;
      border: 1px solid #c89a4c;
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.8);
      z-index: 1000;
      padding: 4px;
      gap: 4px;
      flex-direction: column;
    }

    #selectionMenu button {
      background: transparent;
      border: none;
      color: #f7e6b5;
      padding: 6px 12px;
      text-align: left;
      font-size: 0.8rem;
      font-family: 'Cinzel', serif;
      cursor: pointer;
      border-radius: 4px;
      white-space: nowrap;
    }

    #selectionMenu button:hover {
      background: #c89a4c;
      color: #000;
    }

    .reader-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #111;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #292929;
      font-size: 0.8rem;
    }

    .btn-resume {
      background: #1b1b1b;
      color: #f7e6b5;
      border: 1px solid #c89a4c;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
    }

    .btn-resume:hover {
      background: #c89a4c;
      color: #000;
    }

    #drawer .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #drawer .topbar #closeDrawer {
      position: absolute;
      left: 1rem;
    }

    #drawer .topbar .reader-controls-wrapper {
      position: absolute;
      right: 1rem;
    }

    #drawer .topbar #drawerTitle {
      margin: 0;
      font-family: 'Cinzel', serif;
      background: linear-gradient(180deg, #fff4c9 0%, #c89a4c 50%, #dfba70 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>

<body>

  <!-- BARRA SUPERIOR -->
  <header class="topbar">
    <span>Biblioteca</span>
    <a href="loja.html" class="btn-loja">Loja</a>
    <a href="admin.html" class="btn-admin" id="btnAdmin">Admin</a>
  </header>

  <div class="layout">
    <main class="main">
      <div id="grade"></div>
      <div id="novelGrid">
        <h2>Contos de Walingardyn</h2>
      </div>
    </main>
  </div>

  <!-- DRAWER / LEITOR -->
  <div id="drawer" class="drawer" aria-hidden="true">
    <div class="topbar">
      <button class="btn" id="closeDrawer">Fechar</button>
      <h2 id="drawerTitle"></h2>
      <div class="reader-controls-wrapper">
        <div class="reader-controls" id="readerControls" style="display:none;">
          <span id="savedPageInfo" style="color:#d6d6d6;">Nenhum marcador</span>
          <button class="btn-resume" id="btnResume">Continuar de onde parei</button>
        </div>
      </div>
    </div>
    
    <div class="drawer-body">
      <div class="drawer-content" id="drawerContent"></div>

      <aside class="reader-sidebar" id="readerSidebar">
        <button type="button" class="reader-sidebar-toggle" id="toggleReaderSidebar"
          aria-label="Recolher comentários" aria-expanded="true" title="Recolher comentários">›</button>
        <div class="comment-section">
          <h3>Comentários da Leitura</h3>
          <textarea id="commentText" placeholder="Escreva seu comentário sobre esta obra..."></textarea>
          <button class="btn-comment" id="btnComment" disabled>Verificando login...</button>
          
          <div class="email-alert-box">
            📧 <strong>Aviso por E-mail:</strong> Comentários enviados são notificados automaticamente para triohnte@gmail.com.
          </div>

          <div id="listaComentarios"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- MENU FLUTUANTE DE SELEÇÃO DE TEXTO -->
  <div id="selectionMenu">
    <button id="menuMarcarTexto">Marcar texto</button>
    <button id="menuComentario">Comentário</button>
    <button id="menuComentarioEditor">Comentário de editor</button>
  </div>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    /* ===================================================== */
    /* BLOQUEIO TOTAL DE CAPTURA DE TELA E IMPRESSÃO         */
    /* ===================================================== */
    document.addEventListener('contextmenu', e => e.preventDefault());

    document.addEventListener('keydown', e => {
      if (
        e.key === 'PrintScreen' ||
        e.keyCode === 44 ||
        e.key === 'F12' ||
        (e.ctrlKey && (e.key === 'p' || e.key === 's' || e.key === 'u' || e.key === 'P' || e.key === 'S' || e.key === 'U')) ||

    function selecionarNota(container, nota) {
      if (!container || nota < 1 || nota > 5) return;
      container.dataset.notaSelecionada = String(nota);
      container.querySelectorAll(".star").forEach(star => {
        star.classList.toggle("vote-choice", Number(star.dataset.value) <= nota);
        star.setAttribute("aria-pressed", Number(star.dataset.value) === nota ? "true" : "false");
      });
    }

    let arrastoVotacao = null;

    document.body.addEventListener("pointerdown", e => {
      const star = e.target.closest(".star");
      if (!star || e.button !== 0) return;
      const container = star.closest(".rating-container");

      // Ao iniciar uma nova avaliação, limpa a representação da média anterior
      // para que ela não seja confundida com a escolha que está sendo feita.
      container.querySelectorAll(".star").forEach(s => {
        s.classList.remove("selected", "vote-choice", "hover");
        s.style.removeProperty("--star-fill");
        s.setAttribute("aria-pressed", "false");
      });
      container.dataset.notaSelecionada = "";

      arrastoVotacao = { container, pointerId: e.pointerId };
      container.classList.add("is-dragging");
      selecionarNota(container, Number(star.dataset.value));
      // Captura o gesto no conjunto inteiro para continuar recebendo o movimento
      // mesmo quando o dedo ou mouse sai da área da estrela inicial.
      try { container.setPointerCapture(e.pointerId); } catch (_) {}
      e.preventDefault();
    });

    document.addEventListener("pointermove", e => {
      if (!arrastoVotacao || arrastoVotacao.pointerId !== e.pointerId) return;

      // Calcula a estrela pela posição horizontal, inclusive ao arrastar para trás
      // ou passar pelo espaço entre duas estrelas.
      const estrelas = [...arrastoVotacao.container.querySelectorAll(".star")];
      if (!estrelas.length) return;

      let nota = 1;
      let menorDistancia = Infinity;
      estrelas.forEach(star => {
        const rect = star.getBoundingClientRect();
        const centro = rect.left + rect.width / 2;
        const distancia = Math.abs(e.clientX - centro);
        if (distancia < menorDistancia) {
          menorDistancia = distancia;
          nota = Number(star.dataset.value);
        }
      });

      const primeiro = estrelas[0].getBoundingClientRect();
      const ultimo = estrelas[estrelas.length - 1].getBoundingClientRect();

      // A escala comeca exatamente na borda esquerda da primeira estrela.
      // Fora da faixa das estrelas, nao atribui uma nota por aproximacao.
      if (e.clientX < primeiro.left || e.clientX > ultimo.right) return;

      selecionarNota(arrastoVotacao.container, nota);
    }, true);

    function encerrarArrastoVotacao(e) {
      if (!arrastoVotacao || (e && arrastoVotacao.pointerId !== e.pointerId)) return;
      const container = arrastoVotacao.container;
      container.classList.remove("is-dragging");
      // A nota escolhida permanece em data-nota-selecionada após soltar.
      arrastoVotacao = null;

    function carregarMediaEstrelas(livroId) {
      db.ref(`avaliacoes_estrelas/${livroId}`).on("value", snapshot => {
        const dados = snapshot.val();
        const scoreEl = document.getElementById(`score-${livroId}`);
        const container = document.querySelector(`.rating-container[data-id="${livroId}"]`);
        if (!scoreEl || !container) return;

        if (!dados) {
          scoreEl.textContent = "(0.0)";
          container.querySelectorAll(".star").forEach(s => s.classList.remove("selected"));
          return;
        }

        let soma = 0;
        let total = 0;
        let meuVoto = 0;

        Object.keys(dados).forEach(uid => {
          const aval = dados[uid];
          soma += aval.nota;
          total++;
          if (usuarioLogado && uid === usuarioLogado.uid) {
            meuVoto = aval.nota;
          }
        });

        const media = (soma / total).toFixed(1);
        scoreEl.textContent = `(${media} - ${total} voto${total > 1 ? 's' : ''})`;

        // As estrelas representam a média global, igual para todas as contas.
        const mediaNumerica = soma / total;
        container.querySelectorAll(".star").forEach(s => {
          const valor = parseInt(s.dataset.value, 10);
          const preenchimento = Math.max(0, Math.min(100, (mediaNumerica - (valor - 1)) * 100));
          s.style.setProperty("--star-fill", preenchimento + "%");
          s.classList.toggle("selected", preenchimento > 0);
        });
      });
    }

      }

      carregarComentariosDoLivro(item.id);

      const storageKey = `triohnte_bookmark_${item.id}`;
      const savedPage = localStorage.getItem(storageKey);

      const saltarParaPagina = (pageNum) => {
        const targetElement = document.getElementById(`page-wrapper-${pageNum}`);
        if (targetElement) {
          content.scrollTop = targetElement.offsetTop - content.offsetTop;
        }
      };

      if (savedPage) {
        savedPageInfo.textContent = `Página salva: ${savedPage}`;
        readerControls.style.display = "flex";
        btnResume.onclick = () => saltarParaPagina(savedPage);
      } else {
        readerControls.style.display = "none";
      }

      try {
        const loadingTask = pdfjsLib.getDocument({ url: item.arquivo });
        const pdfDoc = await loadingTask.promise;
        content.innerHTML = "";

        for (let i = 1; i <= pdfDoc.numPages; i++) {
          const page = await pdfDoc.getPage(i);
          const larguraBase = page.getViewport({ scale: 1 }).width;
          const larguraDisponivel = Math.max(240, content.clientWidth - 16);
          const escalaAjustada = Math.min(1.5, larguraDisponivel / larguraBase);
          const viewport = page.getViewport({ scale: escalaAjustada });

          const pageWrapper = document.createElement('div');
          pageWrapper.className = 'page-container';
          pageWrapper.id = `page-wrapper-${i}`;
          pageWrapper.style.width = `${viewport.width}px`;
          pageWrapper.style.height = `${viewport.height}px`;

          const canvas = document.createElement('canvas');
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          const context = canvas.getContext('2d');
          await page.render({ canvasContext: context, viewport: viewport }).promise;

          const textLayerDiv = document.createElement('div');
          textLayerDiv.className = 'textLayer';
          textLayerDiv.style.width = `${viewport.width}px`;
          textLayerDiv.style.height = `${viewport.height}px`;

          pageWrapper.appendChild(canvas);
          pageWrapper.appendChild(textLayerDiv);

          const btnMarcar = document.createElement('button');
          btnMarcar.className = 'btn-marcar-pagina';
          btnMarcar.textContent = `Marcar pág. ${i}`;
          btnMarcar.onclick = () => {
            localStorage.setItem(storageKey, i);
            savedPageInfo.textContent = `Página salva: ${i}`;
            readerControls.style.display = "flex";
            alert(`Progresso salvo na página ${i}!`);
          };
          pageWrapper.appendChild(btnMarcar);
          content.appendChild(pageWrapper);

          const textContent = await page.getTextContent();
          pdfjsLib.renderTextLayer({
            textContentSource: textContent,
            container: textLayerDiv,
            viewport: viewport,
            textDivs: []
          });
        }

        if (savedPage) {
          setTimeout(() => saltarParaPagina(savedPage), 300);
        }

      } catch (error) {
        console.error("Erro ao carregar PDF:", error);
        content.innerHTML = "<p style='color: #e74c3c; padding: 2rem;'>Erro ao carregar documento.</p>";
      }

      if (comentario) {
        aplicarDestaqueAmareloNaSelecao();
        await salvarAcaoNoFirebase("Comentário", `${textoSelecionadoGlobal} - [Comentário: ${comentario}]`, true);
      }
    };

    document.getElementById("menuComentarioEditor").onclick = async () => {
      const comentarioEditor = prompt("Digite o comentário de editor para este trecho:");
      if (comentarioEditor) {
        aplicarDestaqueAmareloNaSelecao();
        await salvarAcaoNoFirebase("Comentário de editor", `${textoSelecionadoGlobal} - [Editor: ${comentarioEditor}]`, true);
      }
    };

    async function salvarAcaoNoFirebase(tipoAcao, conteudo, dispararNotificacao) {
      esconderMenuSelecao();
      if (!usuarioLogado) {
        alert("Você precisa estar conectado para salvar anotações.");
        return;
      }

      try {
        await db.ref(`anotacoes_leitores/${livroAtualId}`).push({
          uid: usuarioLogado.uid,
          email: usuarioLogado.email,
          tipo: tipoAcao,
          conteudo: conteudo,
          data: Date.now()
        });

        if (dispararNotificacao) {
          await dispararEmail(tipoAcao, conteudo);
          alert(`Ação "${tipoAcao}" salva com sucesso e aviso enviado para triohnte@gmail.com!`);
        } else {
          alert(`Ação "${tipoAcao}" salva com sucesso!`);
        }
      } catch (err) {
        console.error("Erro ao salvar:", err);
        alert("Erro ao salvar no banco de dados.");
      }
    }

    /* ===================================================== */
    /* COMENTÁRIOS E AVISO POR E-MAIL                        */
    /* ===================================================== */
    const btnComment = document.getElementById("btnComment");
    const commentText = document.getElementById("commentText");
    const listaComentarios = document.getElementById("listaComentarios");

    btnComment.onclick = async () => {
      if (!usuarioLogado) {
        alert("Faça login para enviar comentários.");
        return;
      }
      const texto = commentText.value.trim();
      if (!texto) {
        alert("Escreva algo no comentário.");
        return;
      }

      btnComment.disabled = true;
      try {
        await db.ref(`comentarios_gerais/${livroAtualId}`).push({
          uid: usuarioLogado.uid,
          email: usuarioLogado.email,
          texto: texto,
          data: Date.now()
        });

        await dispararEmail("Comentário Geral", texto);

        commentText.value = "";
        alert("Comentário publicado e notificação enviada para triohnte@gmail.com!");
      } catch (e) {
        console.error(e);
        alert("Erro ao enviar comentário.");
      }
      btnComment.disabled = false;
    };

    function carregarComentariosDoLivro(idLivro) {
      listaComentarios.innerHTML = "";
      db.ref(`comentarios_gerais/${idLivro}`).on("child_added", snapshot => {
        const dados = snapshot.val();
        if (!dados) return;

        const div = document.createElement("div");
        div.className = "comentario-item";
        div.innerHTML = `
          <p class="comentario-texto">${dados.texto}</p>
          <small class="comentario-meta">${dados.email} • ${new Date(dados.data).toLocaleDateString("pt-BR")}</small>
        `;
        listaComentarios.prepend(div);
      });
    }
  </script>

</body>
</html>
