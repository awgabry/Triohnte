<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contorno de Triohnte</title>

    <link rel="icon" type="image/png" href="mu.png">
    
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Evita barras de rolagem desnecessárias */
        }
        
        .container {
            text-align: center;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 10px;
            max-width: 90vw;  /* Garante que o contêiner caiba na largura da tela */
            max-height: 90vh; /* Garante que o contêiner caiba na altura da tela */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .map-image {
            max-width: 100%;  /* Impede que a imagem fique maior que o contêiner */
            max-height: 70vh; /* Limita a altura para que não corte no fundo da tela */
            height: auto;     /* Mantém a proporção original do mapa */
            width: auto;      /* Mantém a proporção original do mapa */
            display: block;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="tryu.png" alt="Contorno de Triohnte" class="map-image">
    </div>

</body>
</html>
