<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mapa</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
}

#viewport {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* canvas empilhados */
canvas {
    position: absolute;
    top: 0;
    left: 0;
}

/* mapa colorido atrás */
#mapColor {
    z-index: 1;
}

/* mapa escuro em cima */
#mapCanvas {
    z-index: 2;
}

.info-card {
    position: fixed;
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 10px;
    border: 1px solid gold;
    pointer-events: none;
    opacity: 0;
}
</style>
</head>

<body>

<div id="viewport">
    <canvas id="mapColor"></canvas>
    <canvas id="mapCanvas"></canvas>
</div>

<div class="info-card" id="infoCard">
    <b id="cardTitle"></b><br>
    <span id="cardDesc"></span>
</div>

<script>
// ELEMENTOS
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

const colorCanvas = document.getElementById('mapColor');
const colorCtx = colorCanvas.getContext('2d');

const infoCard = document.getElementById('infoCard');
const cardTitle = document.getElementById('cardTitle');
const cardDesc = document.getElementById('cardDesc');

// IMAGENS
const imgEscura = new Image();
const imgColorida = new Image();

imgEscura.src = 'tryu.png';
imgColorida.src = 'dertyh.png';

// debug
imgEscura.onerror = () => console.log("Erro imagem escura");
imgColorida.onerror = () => console.log("Erro imagem colorida");

// estado
let loaded = 0;
let colorData = null;
let activeColor = null;

// escala / posição
let scale = 1;
let offsetX = 0;
let offsetY = 0;

// load
imgEscura.onload = checkLoad;
imgColorida.onload = checkLoad;

function checkLoad(){
    loaded++;
    if(loaded === 2) init();
}

// FIT NA TELA (contain)
function fitToScreen(w, h){
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const s = Math.min(vw / w, vh / h);
    scale = s;

    const rw = w * s;
    const rh = h * s;

    offsetX = (vw - rw) / 2;
    offsetY = (vh - rh) / 2;

    canvas.style.width = rw + "px";
    canvas.style.height = rh + "px";

    colorCanvas.style.width = rw + "px";
    colorCanvas.style.height = rh + "px";

    canvas.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
    colorCanvas.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
}

// INIT
function init(){
    const w = imgEscura.width;
    const h = imgEscura.height;

    canvas.width = w;
    canvas.height = h;

    colorCanvas.width = w;
    colorCanvas.height = h;

    fitToScreen(w, h);

    // desenha mapa colorido invisível para leitura
    colorCtx.drawImage(imgColorida, 0, 0);
    colorData = colorCtx.getImageData(0,0,w,h).data;

    drawBase();
}

// desenha mapa base
function drawBase(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(imgEscura,0,0);
}

// comparação de cor
function sameColor(r,g,b,tol=8){
    return Math.abs(r - activeColor.r) <= tol &&
           Math.abs(g - activeColor.g) <= tol &&
           Math.abs(b - activeColor.b) <= tol;
}

// DRAW highlight
function draw(){
    drawBase();

    if(!activeColor) return;

    const w = canvas.width;
    const h = canvas.height;

    const mask = ctx.createImageData(w, h);

    for(let i=0;i<colorData.length;i+=4){
        const r = colorData[i];
        const g = colorData[i+1];
        const b = colorData[i+2];
        const a = colorData[i+3];

        if(a > 10 && sameColor(r,g,b)){
            mask.data[i] = 255;
            mask.data[i+1] = 255;
            mask.data[i+2] = 255;
            mask.data[i+3] = 255;
        }
    }

    ctx.putImageData(mask,0,0);

    ctx.globalCompositeOperation = 'source-in';
    ctx.drawImage(imgColorida,0,0);
    ctx.globalCompositeOperation = 'source-over';
}

// mouse
window.addEventListener('mousemove', (e)=>{

    const x = Math.floor((e.clientX - offsetX) / scale);
    const y = Math.floor((e.clientY - offsetY) / scale);

    if(x < 0 || y < 0 || x >= canvas.width || y >= canvas.height){
        if(activeColor){
            activeColor = null;
            drawBase();
            infoCard.style.opacity = 0;
        }
        return;
    }

    const i = (y * canvas.width + x) * 4;

    const r = colorData[i];
    const g = colorData[i+1];
    const b = colorData[i+2];
    const a = colorData[i+3];

    if(a > 10 && (r+g+b) > 30){

        if(!activeColor || activeColor.r !== r || activeColor.g !== g || activeColor.b !== b){
            activeColor = {r,g,b};
            draw();
        }

        infoCard.style.opacity = 1;
        infoCard.style.left = e.clientX + 15 + "px";
        infoCard.style.top = e.clientY + "px";

        cardTitle.innerText = "Território";
        cardDesc.innerText = `RGB(${r},${g},${b})`;
    }
});

// resize
window.addEventListener('resize', ()=>{
    if(imgEscura.width) fitToScreen(imgEscura.width, imgEscura.height);
});

</script>

</body>
</html>
