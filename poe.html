<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mapa de Seleção - Ativo</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden; /* Remove as barras de rolagem */
}

#viewport {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* O canvas se adapta dinamicamente à tela mantendo a proporção original */
canvas {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain; 
    z-index: 1;
}

.info-card {
    position: fixed;
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 10px;
    border: 1px solid gold;
    pointer-events: none;
    opacity: 0;
    z-index: 10;
}
</style>
</head>

<body>

<div id="viewport">
    <canvas id="mapColorCanvas"></canvas>
</div>

<div class="info-card" id="infoCard">
    <b id="cardTitle"></b><br>
    <span id="cardDesc"></span>
</div>

<script>
// DIMENSÕES ORIGINAIS DA SUA IMAGEM
const MAP_WIDTH = 1441;
const MAP_HEIGHT = 1311;

// ELEMENTOS
const canvas = document.getElementById('mapColorCanvas');
const ctx = canvas.getContext('2d');

const infoCard = document.getElementById('infoCard');
const cardTitle = document.getElementById('cardTitle');
const cardDesc = document.getElementById('cardDesc');

// IMAGEM (Usando apenas o mapa de seleção colorido agora)
const imgColorida = new Image();
imgColorida.src = 'dertyh.png';

let colorData = null;
let activeColor = null;

imgColorida.onload = init;
imgColorida.onerror = () => console.log("Erro ao carregar a imagem colorida dertyh.png");

function init(){
    // Define a resolução interna fixa do Canvas
    canvas.width = MAP_WIDTH;
    canvas.height = MAP_HEIGHT;

    // Ajusta o tamanho visual do canvas na tela do navegador
    resizeCanvasDisplay();

    // Desenha o mapa colorido como a base visível do projeto
    drawBase();

    // Captura a matriz de pixels para sabermos onde o mouse está passando
    colorData = ctx.getImageData(0, 0, MAP_WIDTH, MAP_HEIGHT).data;
}

// Faz o mapa caber perfeitamente na janela do usuário
function resizeCanvasDisplay() {
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    const scale = Math.min(windowWidth / MAP_WIDTH, windowHeight / MAP_HEIGHT);

    canvas.style.width = Math.floor(MAP_WIDTH * scale) + "px";
    canvas.style.height = Math.floor(MAP_HEIGHT * scale) + "px";
}

// Desenha o estado inicial com o mapa colorido limpo
function drawBase(){
    ctx.clearRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
    ctx.drawImage(imgColorida, 0, 0, MAP_WIDTH, MAP_HEIGHT);
}

// Comparação estrita de cor para evitar acender territórios errados
function sameColor(r, g, b, tol = 0){
    return Math.abs(r - activeColor.r) <= tol &&
           Math.abs(g - activeColor.g) <= tol &&
           Math.abs(b - activeColor.b) <= tol;
}

// Aplica o realce dourado por cima do território ativo do mapa de cores
function draw(){
    drawBase();

    if(!activeColor) return;

    // Cria a máscara na memória apenas com o formato do território selecionado
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = MAP_WIDTH;
    tempCanvas.height = MAP_HEIGHT;
    const tempCtx = tempCanvas.getContext('2d');
    
    const mask = tempCtx.createImageData(MAP_WIDTH, MAP_HEIGHT);

    for(let i = 0; i < colorData.length; i += 4){
        const r = colorData[i];
        const g = colorData[i+1];
        const b = colorData[i+2];
        const a = colorData[i+3];

        if(a > 10 && sameColor(r, g, b)){
            // Uma camada dourada semi-transparente por cima da cor original do território
            mask.data[i] = 255;   
            mask.data[i+1] = 215; 
            mask.data[i+2] = 0;  
            mask.data[i+3] = 90; // Opacidade do realce (ajuste se quiser mais claro/escuro)
        }
    }
    tempCtx.putImageData(mask, 0, 0);

    ctx.save();
    // Configuração do brilho neon dourado
    ctx.shadowColor = "rgba(255, 215, 0, 1)"; 
    ctx.shadowBlur = 25; 
    
    // Aplica a máscara brilhante exatamente no local correspondente
    ctx.drawImage(tempCanvas, 0, 0);
    ctx.restore();
}

// Escuta o movimento do mouse na mesma proporção do canvas
canvas.addEventListener('mousemove', (e) => {
    const cw = canvas.clientWidth;
    const ch = canvas.clientHeight;

    // Converte a posição do ponteiro na tela para a escala de 1441x1311
    const x = Math.floor((e.offsetX / cw) * MAP_WIDTH);
    const y = Math.floor((e.offsetY / ch) * MAP_HEIGHT);

    if(x < 0 || y < 0 || x >= MAP_WIDTH || y >= MAP_HEIGHT){
        if(activeColor){
            activeColor = null;
            drawBase();
            infoCard.style.opacity = 0;
        }
        return;
    }

    const i = (y * MAP_WIDTH + x) * 4;

    const r = colorData[i];
    const g = colorData[i+1];
    const b = colorData[i+2];
    const a = colorData[i+3];

    // Ignora fundos pretos da imagem externa
    if(a > 10 && (r + g + b) > 20){
        if(!activeColor || activeColor.r !== r || activeColor.g !== g || activeColor.b !== b){
            activeColor = {r, g, b};
            draw();
        }

        infoCard.style.opacity = 1;
        infoCard.style.left = e.clientX + 15 + "px";
        infoCard.style.top = e.clientY + "px";

        cardTitle.innerText = "Território";
        cardDesc.innerText = `RGB(${r},${g},${b})`;
    } else {
        if(activeColor){
            activeColor = null;
            drawBase();
            infoCard.style.opacity = 0;
        }
    }
});

// Limpa o efeito se o mouse sair da imagem do mapa
canvas.addEventListener('mouseleave', () => {
    if(activeColor){
        activeColor = null;
        drawBase();
        infoCard.style.opacity = 0;
    }
});

window.addEventListener('resize', () => {
    if(colorData) {
        resizeCanvasDisplay();
    }
});

</script>

</body>
</html>
