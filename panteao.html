<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panteão dos deuses</title>

    <link rel="icon" type="image/png" href="mu.png">
    
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            
            /* BLOQUEIO DE SELEÇÃO DE TEXTO (CSS) */
            -webkit-user-select: none;  /* Safari */
            -moz-user-select: none;     /* Firefox */
            -ms-user-select: none;      /* IE10+ */
            user-select: none;          /* Padrão */
        }

        /* Estilo do Título Principal Corrigido */
        .main-title {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 0; 
            margin-bottom: 40px;
            text-align: center;
            font-weight: bold;
            line-height: 1.2; 
            display: block; 
            
            /* Efeito de degradê dourado */
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #bf953f; 
        }

        /* Container principal que organiza os blocos de deuses */
        .panteon-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
        }

        /* Linha onde os cards dos deuses ficam lado a lado */
        .cards-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-bottom: 20px;
        }

        /* Estilo individual de cada card */
        .card {
            background-color: #111;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            width: 180px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        /* Hover e estado ativo */
        .card:hover, .card.active {
            transform: scale(1.05);
            border-color: #bf953f;
            box-shadow: 0 0 10px rgba(191, 149, 63, 0.4);
        }

        /* Imagens dos deuses */
        .card img {
            width: 100%;
            height: 250px;
            border-radius: 6px;
            object-fit: cover;
            pointer-events: none;
        }

        /* Nomes dos deuses nos cards */
        .god-name {
            font-size: 1.2rem;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        /* Painel de História Expandido (Abaixo dos cards) */
        .history-dropdown {
            width: 100%;
            max-width: 800px;
            background-color: #111;
            border: 1px solid #bf953f;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(191, 149, 63, 0.2);
            padding: 0px;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s ease, padding 0.4s ease, opacity 0.3s ease;
            box-sizing: border-box;
            text-align: left;
            margin-top: 10px;
        }

        /* Quando ativo, expande suavemente */
        .history-dropdown.open {
            max-height: 500px;
            padding: 25px;
            opacity: 1;
        }

        .history-title {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 12px;
            font-weight: bold;
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .history-text {
            color: #ccc;
            font-size: 1rem;
            line-height: 1.6;
            margin: 0;
        }

        /* ESTILO PARA OCULTAR O CONTEÚDO DURANTE CAPTURAS */
        .blur-protection {
            filter: blur(20px) !important;
            opacity: 0 !important;
            transition: none !important;
        }
    </style>
</head>
<body>

    <h1 class="main-title">Panteão dos Deuses</h1>

    <div class="panteon-container" id="mainContent">
        
        <div class="cards-row">
            
            <div class="card" onclick="toggleHistory(this)" 
                 data-title="Gaugyal, deusa da guerra, do fogo e do poder" 
                 data-history="Originária do grande deserto, Gaugyal desperta o sol com seu toque e molda a areia em templos sagrados. Diz-se que sua voz é o primeiro raio da manhã. Uma vez salvou seu povo de um milênio de escuridão profunda.">
                <img src="deuses/gaugyal.png" alt="Gaugyal">
                <h3 class="god-name">Gaugyal</h3>
            </div>

            <div class="card" onclick="toggleHistory(this)" 
                 data-title="Haragum, deus da luz e da cura" 
                 data-history="Guardião das tempestades e das constelações antigas. Com seu cetro de ouro puro, Haragum dita as estações e rege o destino dos ventos. Ele é a justiça implacável e a calmaria após a tempestade.">
                <img src="deuses/haragum.png" alt="Haragum">
                <h3 class="god-name">Haragum</h3>
            </div>

            <div class="card" onclick="toggleHistory(this)" 
                 data-title="Hyobdor, deus da vida e do poder ancestral" 
                 data-history="Nascido das profundezas das florestas sagradas, Hyobdor é a força viva da natureza. Carrega a tocha do conhecimento e usa sua coroa de folhas raras para se comunicar com todas as criaturas e feras vivas.">
                <img src="deuses/hyobdor.png" alt="Hyobdor">
                <h3 class="god-name">Hyobdor</h3>
            </div>

            <div class="card" onclick="toggleHistory(this)" 
                 data-title="Nabulork, deus dos espiritos e do finito" 
                 data-history="Mestre do submundo e dos mistérios ocultos. Nabulork governa o que não pode ser visto, canalizando a energia do vazio e o fogo etéreo. Ele não representa o mal, mas sim o equilíbrio necessário do descanso eterno.">
                <img src="deuses/nabulork.png" alt="Nabulork">
                <h3 class="god-name">Nabulork</h3>
            </div>

        </div>

        <div class="history-dropdown" id="dropdownPanel">
            <h2 class="history-title" id="dropdownTitle"></h2>
            <p class="history-text" id="dropdownText"></p>
        </div>

    </div>

    <script>
        let currentActiveCard = null;

        function toggleHistory(cardElement) {
            const dropdown = document.getElementById('dropdownPanel');
            const dropdownTitle = document.getElementById('dropdownTitle');
            const dropdownText = document.getElementById('dropdownText');

            if (currentActiveCard === cardElement) {
                cardElement.classList.remove('active');
                dropdown.classList.remove('open');
                currentActiveCard = null;
                return;
            }

            if (currentActiveCard) {
                currentActiveCard.classList.remove('active');
            }

            cardElement.classList.add('active');
            currentActiveCard = cardElement;

            const title = cardElement.getAttribute('data-title');
            const history = cardElement.getAttribute('data-history');

            if (dropdown.classList.contains('open')) {
                dropdown.style.opacity = '0';
                setTimeout(() => {
                    dropdownTitle.innerText = title;
                    dropdownText.innerText = history;
                    dropdown.style.opacity = '1';
                }, 200);
            } else {
                dropdownTitle.innerText = title;
                dropdownText.innerText = history;
                dropdown.classList.add('open');
            }
        }

        /* ==========================================================
           SCRIPTS DE PROTEÇÃO CONTRA CÓPIA E CAPTURA DE TELA (PRINT)
           ========================================================== */

        const content = document.getElementById('mainContent');

        // 1. Bloqueia o Clique Direito (Menu de Contexto)
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 2. Bloqueia Atalhos de Teclado (Ctrl+C, Ctrl+S, Ctrl+U, PrintScreen, etc.)
        document.addEventListener('keydown', (e) => {
            // Bloqueia Ctrl+C, Ctrl+X, Ctrl+U (Ver código), Ctrl+S (Salvar)
            if (e.ctrlKey && (e.key === 'c' || e.key === 'c' || e.key === 'x' || e.key === 'u' || e.key === 's' || e.key === 'p')) {
                e.preventDefault();
                return false;
            }
            
            // Bloqueia a tecla PrintScreen isolada limpa a área de transferência
            if (e.key === 'PrintScreen') {
                navigator.clipboard.writeText('');
                alert('Capturas de tela não são permitidas nesta página.');
                e.preventDefault();
            }
        });

        // 3. Mitigação para Win+Shift+S e ferramentas de captura de terceiros
        // Quando a janela perde o foco (o que acontece quando o Win+Shift+S é ativado), a tela fica preta/invisível
        window.addEventListener('blur', () => {
            content.classList.add('blur-protection');
            document.body.style.backgroundColor = 'black';
        });

        window.addEventListener('focus', () => {
            content.classList.remove('blur-protection');
        });

        // 4. Limpeza constante do Clipboard (Área de transferência) caso tentem copiar algo fora
        document.addEventListener('copy', (e) => {
            e.clipboardData.setData('text/plain', 'Conteúdo Protegido!');
            e.preventDefault();
        });
    </script>

</body>
</html>
