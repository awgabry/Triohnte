<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panteão dos deuses</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px; /* Aumentado o padding superior para dar respiro */
            box-sizing: border-box;
        }

        /* Estilo do Título Principal */
        .main-title {
            font-size: 3rem; /* Tamanho grande e imponente */
            text-transform: uppercase; /* Letras maiúsculas */
            letter-spacing: 3px; /* Espaçamento elegante entre as letras */
            margin-bottom: 40px; /* Empurra os cards para baixo, criando o espaço ideal */
            text-align: center;
            font-weight: bold;
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        /* Container que envolve todos os cards */
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
        }

        /* Estilo individual de cada card */
        .card {
            background-color: #111;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            width: 200px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: scale(1.05);
            border-color: #bf953f;
        }

        /* Estilo das imagens dos deuses */
        .card img {
            width: 100%;
            height: 280px;
            border-radius: 6px;
            object-fit: cover;
        }

        /* Efeito de Degradê Dourado nos nomes */
        .god-name {
            font-size: 1.3rem;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }
    </style>
</head>
<body>

    <h1 class="main-title">Panteão dos Deuses</h1>

    <div class="cards-container">
        
        <div class="card">
            <img src="deuses/gaugyal.png" alt="Gaugyal">
            <h3 class="god-name">Gaugyal</h3>
        </div>

        <div class="card">
            <img src="deuses/haragum.png" alt="Haragum">
            <h3 class="god-name">Haragum</h3>
        </div>

        <div class="card">
            <img src="deuses/hyobdor.png" alt="Hyobdor">
            <h3 class="god-name">Hyobdor</h3>
        </div>

        <div class="card">
            <img src="deuses/nabulork.png" alt="Nabulork">
            <h3 class="god-name">Nabulork</h3>
        </div>

    </div>

</body>
</html>
